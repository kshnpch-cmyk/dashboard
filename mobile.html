<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theborn OMS 모바일 현황</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Pretendard', sans-serif; }
        .mobile-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .center-tag { display: inline-block; background-color: #e8f5e9; color: #2e7d32; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container py-3">
        <h4 class="fw-bold mb-3">📱 OMS 주문 현황</h4>

        <!-- 모바일 기간 및 센터 선택 -->
        <div class="card p-3 mb-3 border-0 shadow-sm">
            <div class="row g-2">
                <div class="col-6">
                    <input type="date" id="mStartDate" class="form-control form-control-sm">
                </div>
                <div class="col-6">
                    <input type="date" id="mEndDate" class="form-control form-control-sm">
                </div>
                <div class="col-12">
                    <select id="mCenterFilter" class="form-select form-select-sm">
                        <option value="">전체 물류센터</option>
                    </select>
                </div>
                <div class="col-12 mt-2">
                    <button class="btn btn-primary btn-sm w-100 fw-bold" onclick="loadMobileData()">조회하기</button>
                </div>
            </div>
        </div>

        <!-- 카드형 요약 -->
        <div class="card p-3 mb-3 border-0 bg-dark text-white shadow-sm">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span class="small text-white-50">총 수량</span>
                    <h5 id="mTotalQty" class="fw-bold mb-0 text-info">0개</h5>
                </div>
                <div class="text-end">
                    <span class="small text-white-50">총 금액</span>
                    <h5 id="mTotalAmount" class="fw-bold mb-0 text-warning">0원</h5>
                </div>
            </div>
        </div>

        <!-- 주문 목록 (카드 뷰) -->
        <div id="mobileList">
            <div class="text-center py-5 text-muted">조회 버튼을 눌러주세요.</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://zbilhsgfgyfrolveaego.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN";

        let mRawData = [];

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('mStartDate').value = today;
            document.getElementById('mEndDate').value = today;
            loadMobileData();
        };

        async function loadMobileData() {
            const sDate = document.getElementById('mStartDate').value;
            const eDate = document.getElementById('mEndDate').value;

            if (!sDate || !eDate) return;

            const container = document.getElementById('mobileList');
            container.innerHTML = '<div class="text-center py-4">⏳ 데이터 불러오는 중...</div>';

            let allData = [];
            let page = 0;
            const pageSize = 1000;
            let hasMore = true;

            while (hasMore) {
                // 🚀 select 쿼리에 distribution_center 명시
                const selectCols = "order_date,delivery_date,store_code,store_name,brand_name,distribution_center,item_code,item_name,qty,price,total_amount";
                const url = `${SUPABASE_URL}/rest/v1/oms_orders?select=${selectCols}&delivery_date=gte.${sDate}&delivery_date=lte.${eDate}&order=delivery_date.desc`;

                const res = await fetch(url, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Range': `${page * pageSize}-${(page + 1) * pageSize - 1}`
                    }
                });

                if (!res.ok) break;
                const data = await res.json();
                allData = allData.concat(data);

                if (data.length < pageSize) hasMore = false;
                else page++;
            }

            mRawData = allData;
            populateMobileCenterFilter(mRawData);
            renderMobileView();
        }

        function populateMobileCenterFilter(data) {
            const select = document.getElementById('mCenterFilter');
            const curVal = select.value;
            const centers = new Set();

            data.forEach(row => {
                const cName = (row.distribution_center || row.center_name || row.center || '').trim();
                if (cName) centers.add(cName);
            });

            select.innerHTML = '<option value="">전체 물류센터</option>';
            Array.from(centers).sort().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                if (c === curVal) opt.selected = true;
                select.appendChild(opt);
            });
        }

        document.getElementById('mCenterFilter').addEventListener('change', renderMobileView);

        function renderMobileView() {
            const selectedCenter = document.getElementById('mCenterFilter').value;
            const container = document.getElementById('mobileList');
            container.innerHTML = '';

            let filtered = mRawData;
            if (selectedCenter) {
                filtered = mRawData.filter(row => {
                    const cName = (row.distribution_center || row.center_name || row.center || '').trim();
                    return cName === selectedCenter;
                });
            }

            let tQty = 0;
            let tAmt = 0;

            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-4 text-muted">데이터가 없습니다.</div>';
                document.getElementById('mTotalQty').textContent = '0개';
                document.getElementById('mTotalAmount').textContent = '0원';
                return;
            }

            filtered.forEach(row => {
                const qty = Number(row.qty || 0);
                const amt = Number(row.total_amount || 0);
                tQty += qty;
                tAmt += amt;

                // 💡 DB 컬럼명 바인딩 및 Fallback 처리
                const centerName = (row.distribution_center || row.center_name || row.center || '').trim() || '-';

                const card = document.createElement('div');
                card.className = 'mobile-card';
                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="badge bg-secondary font-monospace">${row.delivery_date || '-'}</span>
                        <span class="center-tag">${centerName}</span>
                    </div>
                    <div class="fw-bold fs-6 text-dark mb-1">${row.store_name || '-'} <span class="small text-muted">(${row.brand_name || '-'})</span></div>
                    <div class="text-secondary small mb-2">${row.item_name || '-'}</div>
                    <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                        <span class="small text-muted">수량: <strong class="text-dark">${qty.toLocaleString()}개</strong></span>
                        <span class="fw-bold text-success">${amt.toLocaleString()}원</span>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('mTotalQty').textContent = `${tQty.toLocaleString()}개`;
            document.getElementById('mTotalAmount').textContent = `${tAmt.toLocaleString()}원`;
        }
    </script>
</body>
</html>
