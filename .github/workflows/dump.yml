name: Dump All Data to oms_data.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 설치
        run: pip install pandas psycopg2-binary

      - name: TiDB 최적화 덤프 (Cloudflare 25MB 한도 준수 - 최근 3일)
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: |
          python - << 'EOF'
          import os, json, psycopg2, pandas as pd

          print('🔌 TiDB 연결 중...')
          conn = psycopg2.connect(os.environ['TIDB_DATABASE_URL'])
          conn.autocommit = True
          cur = conn.cursor()

          # 1. [캘린더 전용 초경량 데이터]
          cur.execute('''
              SELECT to_char(delivery_date, 'YYYY-MM-DD') AS delivery_date, SUM(qty)::bigint AS total_qty
              FROM public.oms_orders
              WHERE delivery_date IS NOT NULL
              GROUP BY delivery_date;
          ''')
          cal_rows = cur.fetchall()
          cal_data = {r[0]: int(r[1]) for r in cal_rows if r[0] and r[1] is not None}
          with open('calendar_data.json', 'w', encoding='utf-8') as f:
              json.dump(cal_data, f, ensure_ascii=False)

          # 2. [대시보드 전용] 25MB 이내 유지를 위해 최근 3일치만 타겟팅 (~15MB)
          all_dates = sorted([d for d in cal_data.keys() if d and cal_data[d] > 0])
          recent_dates = all_dates[-3:]
          print(f'📅 최근 3개 배송일자 추출 대상 (25MB 제한 준수): {recent_dates}')

          all_rows = []
          cols = None
          sql = '''
              SELECT 
                  to_char(order_date, 'YYYY-MM-DD') AS order_date,
                  to_char(delivery_date, 'YYYY-MM-DD') AS delivery_date,
                  store_code, store_name, brand_name, distribution_center,
                  item_code, item_name, qty, price, total_amount
              FROM public.oms_orders
              WHERE delivery_date = %s::date;
          '''

          for d_str in recent_dates:
              print(f'   -> [{d_str}] 데이터 조회 중...', flush=True)
              cur.execute(sql, (d_str,))
              if cols is None:
                  cols = [desc[0] for desc in cur.description]
              rows = cur.fetchall()
              print(f'      로드 완료: {len(rows):,}건')
              all_rows.extend(rows)

          cur.close()
          conn.close()

          df = pd.DataFrame(all_rows, columns=cols)
          df.sort_values(by=['delivery_date', 'brand_name'], ascending=[True, True], inplace=True)

          df.to_json('oms_data.json', orient='records', force_ascii=False)
          size_mb = os.path.getsize('oms_data.json') / (1024 * 1024)
          print(f'✅ oms_data.json 생성 완료: 총 {len(df):,}건 ({size_mb:.2f} MB, 25MB 이하 성공)')
          EOF

      - name: 저장소 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add calendar_data.json oms_data.json
          git commit -m 'chore: resize oms_data.json under 25MB for Cloudflare deploy [skip ci]' || exit 0
          git push
          echo "✅ 배포 파일 갱신 완료"
