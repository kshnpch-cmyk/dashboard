name: Dump All Data to oms_data.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 설치
        run: pip install pandas psycopg2-binary

      - name: TiDB 데이터 최적화 덤프 (캘린더 5KB + 대시보드 분리)
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
        run: |
          python - << 'EOF'
          import os, json, psycopg2, pandas as pd

          print('🔌 TiDB 연결 중...')
          conn = psycopg2.connect(os.environ['TIDB_DATABASE_URL'])
          conn.autocommit = True
          cur = conn.cursor()

          # 1. [캘린더 전용 5KB 초경량 데이터] 전 기간 일별 주문건수 집계
          print('📅 캘린더용 일별 집계 데이터 추출 중 (7~11월)...')
          cur.execute('''
              SELECT to_char(delivery_date, 'YYYY-MM-DD') AS delivery_date, SUM(qty)::bigint AS total_qty
              FROM public.oms_orders
              WHERE delivery_date IS NOT NULL
              GROUP BY delivery_date
              ORDER BY delivery_date ASC;
          ''')
          cal_rows = cur.fetchall()
          cal_data = {r[0]: int(r[1]) for r in cal_rows if r[0] and r[1] is not None}
          with open('calendar_data.json', 'w', encoding='utf-8') as f:
              json.dump(cal_data, f, ensure_ascii=False)
          print(f'✅ calendar_data.json 생성 완료: 총 {len(cal_data)}일치 데이터 ({os.path.getsize("calendar_data.json")} bytes)')

          # 2. [대시보드 전용] 최근 35일치 세부 원본 데이터
          print('📥 대시보드용 최근 35일 세부 데이터 추출 중...')
          cur.execute("SELECT (MAX(delivery_date) - INTERVAL '35 days')::date FROM public.oms_orders;")
          start_date = cur.fetchone()[0]

          sql = '''
              SELECT 
                  to_char(order_date, 'YYYY-MM-DD') AS order_date,
                  to_char(delivery_date, 'YYYY-MM-DD') AS delivery_date,
                  store_code, store_name, brand_name, distribution_center,
                  item_code, item_name, qty, price, total_amount
              FROM public.oms_orders
              WHERE delivery_date >= %s
              ORDER BY delivery_date ASC, brand_name ASC;
          '''
          cur.execute(sql, (start_date,))
          cols = [desc[0] for desc in cur.description]
          df = pd.DataFrame(cur.fetchall(), columns=cols)
          df.to_json('oms_data.json', orient='records', force_ascii=False)
          print(f'✅ oms_data.json 생성 완료: 총 {len(df):,}건 ({os.path.getsize("oms_data.json") / (1024*1024):.1f} MB)')

          cur.close()
          conn.close()
          EOF

      - name: 저장소 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add calendar_data.json oms_data.json
          git commit -m 'chore: optimize calendar_data.json and oms_data.json [skip ci]' || exit 0
          git push
          echo "✅ 배포 완료"
