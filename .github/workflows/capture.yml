name: Run OMS Screenshot and Sync Bot

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작일자 (YYYY/MM/DD)'
        required: false
        default: ''
      end_date:
        description: '종료일자 (YYYY/MM/DD)'
        required: false
        default: ''
  repository_dispatch:
    types: [trigger-oms-sync]

# 깃허브 액션이 저장소에 oms_data.json을 커밋/푸시할 수 있도록 쓰기 권한 부여
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & Selenium Chrome Driver
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl selenium psycopg2-binary

      - name: Run Python Screenshot Bot
        env:
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
          OMS_COMPANY_CODE: ${{ secrets.OMS_COMPANY_CODE }}
          OMS_ID: ${{ secrets.OMS_ID }}
          OMS_PW: ${{ secrets.OMS_PW }}
          START_DATE: ${{ github.event.inputs.start_date || github.event.client_payload.start_date }}
          END_DATE: ${{ github.event.inputs.end_date || github.event.client_payload.end_date }}
        run: |
          python -u screenshot.py

      - name: Commit & Push oms_data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 변경되거나 생성된 oms_data.json 스테이징
          git add oms_data.json
          
          # 변경사항이 존재할 때만 커밋 및 푸시
          if git status --porcelain | grep oms_data.json; then
            git commit -m "Auto update oms_data.json [skip ci]"
            git push
            echo "✅ oms_data.json 파일이 GitHub 저장소에 성공적으로 반영되었습니다."
          else
            echo "ℹ️ 변경된 데이터가 없어 커밋을 건너뜁니다."
          fi
