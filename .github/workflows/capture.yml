name: Auto Order Data Sync Bot

on:
  schedule:
    # 10분마다 주기적 자동 실행 (UTC 기준)
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작일'
        required: false
      end_date:
        description: '종료일'
        required: false

# 동시 실행 방지 설정
concurrency:
  group: sync-bot-group
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install selenium beautifulsoup4 requests

      # 1. 파이썬 크롤링 스크립트를 먼저 실행하여 이미지를 생성합니다.
      - name: 동기화 스크립트 실행
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python screenshot.py

      # 2. 스크립트 실행 완료 후(오류 발생 시 포함) 스크린샷을 아티팩트로 업로드합니다.
      - name: 캡처 이미지 저장 (Artifact Upload)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oms-screenshot-result
          path: oms_result.png
          if-no-files-found: warn
