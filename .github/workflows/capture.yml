name: Run OMS Screenshot and Sync Bot

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작일자 (YYYY/MM/DD)'
        required: false
        default: ''
      end_date:
        description: '종료일자 (YYYY/MM/DD)'
        required: false
        default: ''
  # 🚀 cron-job.org의 KST 11:01 정각 신호 수신
  repository_dispatch:
    types: [trigger-oms-sync]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies & Selenium Chrome Driver
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl selenium

      - name: Run Python Screenshot Bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OMS_COMPANY_CODE: ${{ secrets.OMS_COMPANY_CODE }}
          OMS_ID: ${{ secrets.OMS_ID }}
          OMS_PW: ${{ secrets.OMS_PW }}
          # 💡 수동 실행 및 cron-job.org 파라미터 유연 수신
          START_DATE: ${{ github.event.inputs.start_date || github.event.client_payload.start_date }}
          END_DATE: ${{ github.event.inputs.end_date || github.event.client_payload.end_date }}
        run: |
          python -u screenshot.py

      - name: Supabase 구체화 뷰(MATERIALIZED VIEW) 자동 갱신
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/refresh_daily_summary" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_KEY }}"
          
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/refresh_store_summary" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_KEY }}"
          
          echo "✅ Supabase 구체화 뷰 리프레시 완료"
