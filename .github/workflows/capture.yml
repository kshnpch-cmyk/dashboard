name: Run OMS Screenshot and Sync Bot

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작일자 (YYYY/MM/DD)'
        required: false
        default: ''
      end_date:
        description: '종료일자 (YYYY/MM/DD)'
        required: false
        default: ''
  schedule:
    # 매일 정해진 시간(예: 한국시간 오전 7시)에 자동 실행
    - cron: '0 22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies & Selenium Chrome Driver
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl selenium webdriver-manager

      - name: Run Python Screenshot Bot
        env:
          # Supabase 클라우드 DB Secrets
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          
          # 더본 OMS 로그인 정보 Secrets
          OMS_COMPANY_CODE: ${{ secrets.OMS_COMPANY_CODE }}
          OMS_ID: ${{ secrets.OMS_ID }}
          OMS_PW: ${{ secrets.OMS_PW }}
          
          # 날짜 기간 파라미터
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          python -u screenshot.py

      - name: Supabase 구체화 뷰(MATERIALIZED VIEW) 자동 갱신
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/refresh_daily_summary" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_KEY }}"
          
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/refresh_store_summary" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_KEY }}"
          
          echo "✅ Supabase 구체화 뷰 리프레시 완료"
