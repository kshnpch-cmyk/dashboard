name: OMS Order Capture Bot

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작일 (YYYY/MM/DD)'
        required: false
        default: ''
      end_date:
        description: '종료일 (YYYY/MM/DD)'
        required: false
        default: ''
  repository_dispatch:
    types: [trigger-oms-sync]

jobs:
  capture-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체체크아웃
        uses: actions/checkout@v3

      - name: Python 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase requests pandas openpyxl
          playwright install chromium

      - name: OMS 크롤링 및 Supabase 동기화 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          THEBORN_OMS_ID: ${{ secrets.THEBORN_OMS_ID }}
          THEBORN_OMS_PW: ${{ secrets.THEBORN_OMS_PW }}
          INPUT_START_DATE: ${{ github.event.inputs.start_date || github.event.client_payload.start_date }}
          INPUT_END_DATE: ${{ github.event.inputs.end_date || github.event.client_payload.end_date }}
        run: |
          python main.py
