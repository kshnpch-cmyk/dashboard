name: Auto Order Data Sync Bot

on:
  schedule:
    # 10분마다 주기적 자동 실행 (UTC 기준)
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작일'
        required: false
      end_date:
        description: '종료일'
        required: false

# 💡 동시 실행 방지 설정 (이미 실행 중이면 중복 실행 방지)
concurrency:
  group: sync-bot-group
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install selenium beautifulsoup4 requests
        
      - name: 캡처 이미지 저장 (Artifact Upload)
        uses: actions/upload-artifact@v4
        with:
          name: oms-screenshot-result
          path: oms_result.png

      - name: 동기화 스크립트 실행
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python screenshot.py
