name: OMS Order Capture Bot

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작 일자 (YYYY/MM/DD)'
        required: false
        default: ''
      end_date:
        description: '종료 일자 (YYYY/MM/DD)'
        required: false
        default: ''
  schedule:
    # 매일 한국 시간(KST) 아침 06:00 자동 실행 (UTC 21:00)
    - cron: '0 21 * * *'

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Google Chrome 설치 (Selenium 구동용)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager pandas openpyxl requests

      - name: OMS 데이터 수집 및 Supabase 저장 실행
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          SUPABASE_URL: "https://zbilhsgfgyfrolveaego.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN"
          OMS_USER_ID: ${{ secrets.OMS_USER_ID }}
          OMS_USER_PW: ${{ secrets.OMS_USER_PW }}
        run: |
          # 🚀 파이썬 스크립트 실행 (screenshot.py 지정)
          python screenshot.py "$START_DATE" "$END_DATE"

      - name: Supabase 구체화 뷰(MATERIALIZED VIEW) 자동 갱신
        run: |
          curl -X POST "https://zbilhsgfgyfrolveaego.supabase.co/rest/v1/rpc/refresh_daily_summary" \
            -H "apikey: sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN" \
            -H "Authorization: Bearer sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN"
          
          curl -X POST "https://zbilhsgfgyfrolveaego.supabase.co/rest/v1/rpc/refresh_store_summary" \
            -H "apikey: sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN" \
            -H "Authorization: Bearer sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN"
          
          echo "✅ Supabase 구체화 뷰 리프레시 요청이 성공적으로 완료되었습니다."
