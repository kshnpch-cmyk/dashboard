name: Auto Order Data Sync Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작일'
        required: false
      end_date:
        description: '종료일'
        required: false

concurrency:
  group: sync-bot-group
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 requests pandas openpyxl

      - name: 동기화 스크립트 실행
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python screenshot.py

      - name: 캡처 이미지 저장 (Artifact Upload)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oms-screenshot-result
          path: oms_result.png
          if-no-files-found: warn
