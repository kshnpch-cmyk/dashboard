<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>요약 대시보드 프레임</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background: transparent; color: #1e293b; padding: 5px 0; }
        .section-panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 15px; }
        .kpi-card { background: #f8fafc; padding: 15px 20px; border-radius: 8px; border-left: 5px solid #2563eb; }
        .kpi-card.green { border-left-color: #10b981; }
        .kpi-card.orange { border-left-color: #f59e0b; }
        .kpi-card.purple { border-left-color: #8b5cf6; }
        .kpi-title { font-size: 13px; color: #64748b; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .kpi-value { font-size: 22px; font-weight: 800; margin-top: 4px; color: #0f172a; }
        .btn-view-stores { background-color: #f59e0b; color: white; border: none; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
        .chart-container { position: relative; height: 380px; width: 100%; margin-top: 15px; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 420px; max-width: 90%; max-height: 85vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title { font-size: 16px; font-weight: 700; }
        .close-btn { cursor: pointer; font-size: 18px; font-weight: bold; color: #64748b; }
        .modal-body-scroll { flex: 1; overflow-y: auto; margin-top: 10px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
        .brand-store-modal-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; font-size: 13.5px; }
        .brand-store-modal-row b { color: #d97706; font-size: 14px; }

        @keyframes pulse-text { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .loading-text { font-size: 15px; color: #2563eb; animation: pulse-text 1.2s infinite; }
    </style>
</head>
<body>

    <div class="section-panel">
        <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-title">기간 내 총 주문수량</div><div class="kpi-value" id="kpi-total-qty">0 건</div></div>
            <div class="kpi-card green"><div class="kpi-title">기간 내 취급 품목수</div><div class="kpi-value" id="kpi-total-items">0 종</div></div>
            <div class="kpi-card orange">
                <div class="kpi-title"><span>기간 내 주문 점포수</span><button class="btn-view-stores" onclick="openBrandStoreModal()">상세보기 📋</button></div>
                <div class="kpi-value" id="kpi-total-stores">0 개점</div>
            </div>
            <div class="kpi-card purple"><div class="kpi-title">기간 내 총 주문금액</div><div class="kpi-value" id="kpi-total-amount">0 원</div></div>
        </div>
        <div class="chart-container">
            <canvas id="dailyTrendChart"></canvas>
        </div>
    </div>

    <!-- 🏢 브랜드별 점포수 상세 모달 -->
    <div class="modal-overlay" id="brand-store-modal">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title">🏢 브랜드별 주문 점포수 상세</span><span class="close-btn" onclick="closeBrandStoreModal()">✕</span></div>
            <div class="modal-body-scroll" id="brand-store-modal-list"></div>
            <div style="margin-top: 15px; text-align: right;"><button style="padding: 6px 14px; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer;" onclick="closeBrandStoreModal()">닫기</button></div>
        </div>
    </div>

    <script>
        // ⚡ 브라우저 메모리에 보관할 정적 캐시 데이터
        let cachedOmsOrders = null;
        let trendChart = null;
        let currentBrandStoreMap = {};
        let fetchToken = 0;

        function cleanNumber(val) { return parseFloat(String(val).replace(/[^0-9.-]/g, '')) || 0; }
        function formatDisplayDate(dateStr) { return !dateStr || dateStr === '-' ? '-' : String(dateStr).split('T')[0].replace(/-/g, '/'); }
        function safeSearchKeyword(term) { return term ? term.replace(/"/g, '').replace(/[()]/g, '').trim() : ''; }

        function expandCodeVariants(rawCode) {
            const trimmed = String(rawCode).trim();
            const clean = trimmed.replace(/\.0$/, '');
            const withDotZero = clean + '.0';
            return [clean, withDotZero];
        }

        function getWeatherEmoji(code, rain) {
            if (rain && rain >= 2) return '🌧️';
            if (code === 0) return '☀️';
            if ([1, 2].includes(code)) return '🌤️';
            if (code === 3) return '☁️';
            if ([45, 48].includes(code)) return '🌫️';
            if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return '🌧️';
            if ([71, 73, 75, 77, 85, 86].includes(code)) return '❄️';
            if ([95, 96, 99].includes(code)) return '⛈️';
            return '☀️';
        }

        async function fetchWeatherData(startDate, endDate) {
            try {
                let url = `https://archive-api.open-meteo.com/v1/archive?latitude=37.5665&longitude=126.9780&start_date=${startDate}&end_date=${endDate}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode&timezone=Asia%2FSeoul`;
                let res = await fetch(url);
                if (!res.ok) {
                    url = `https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&start_date=${startDate}&end_date=${endDate}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode&timezone=Asia%2FSeoul`;
                    res = await fetch(url);
                }
                if (res.ok) {
                    const json = await res.json();
                    const wMap = {};
                    if (json.daily && json.daily.time) {
                        json.daily.time.forEach((dStr, idx) => {
                            const dKey = formatDisplayDate(dStr);
                            wMap[dKey] = {
                                tMin: json.daily.temperature_2m_min ? json.daily.temperature_2m_min[idx] : null,
                                tMax: json.daily.temperature_2m_max ? json.daily.temperature_2m_max[idx] : null,
                                rain: json.daily.precipitation_sum ? json.daily.precipitation_sum[idx] : 0,
                                code: json.daily.weathercode ? json.daily.weathercode[idx] : 0
                            };
                        });
                    }
                    return wMap;
                }
            } catch (err) {
                console.warn("날씨 데이터 로드 실패:", err);
            }
            return {};
        }

        // ⚡ [0.005초 초고속 조회] 정적 JSON 1회 로드 후 브라우저 메모리 필터링
        async function fetchChartData(params) {
            const currentToken = ++fetchToken;
            const { startDate, endDate, brandName, itemCode, itemName } = params;
            if (!startDate || !endDate) return;

            const sDate = startDate.replace(/\//g, '-');
            const eDate = endDate.replace(/\//g, '-');

            try {
                // 1. 처음 접속 시 1회만 oms_data.json 다운로드 (이후 조회는 0초 즉시 처리)
                if (!cachedOmsOrders) {
                    document.getElementById('kpi-total-stores').innerHTML = `<span class="loading-text">⚡ 데이터 로딩...</span>`;
                    const res = await fetch('./oms_data.json');
                    if (!res.ok) throw new Error("oms_data.json 파일을 찾을 수 없습니다.");
                    cachedOmsOrders = await res.json();
                    console.log(`✅ oms_data.json 메모리 적재 완료: 총 ${cachedOmsOrders.length.toLocaleString()}건`);
                }

                if (fetchToken !== currentToken) return;

                // 2. 검색 조건 파싱
                let bList = [];
                if (brandName) {
                    bList = brandName.split(',').map(b => safeSearchKeyword(b).toLowerCase()).filter(Boolean);
                }

                const targetInput = (itemCode || itemName || '').trim();
                let validCodeList = [];
                if (targetInput) {
                    const rawCodes = targetInput.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
                    const codeSet = new Set();
                    rawCodes.forEach(rc => {
                        expandCodeVariants(rc).forEach(v => codeSet.add(v.toLowerCase()));
                        codeSet.add(rc);
                    });
                    validCodeList = Array.from(codeSet);
                }

                // 3. 브라우저 메모리 안에서 조건 매칭 (0.005초 소요)
                const filteredData = cachedOmsOrders.filter(row => {
                    const d = (row.delivery_date || '').split('T')[0].replace(/\//g, '-');
                    if (!d || d < sDate || d > eDate) return false;

                    // 브랜드 필터
                    if (bList.length > 0) {
                        const bName = (row.brand_name || '').toLowerCase();
                        if (!bList.some(target => bName.includes(target))) return false;
                    }

                    // 품목코드/품목명 필터
                    if (validCodeList.length > 0) {
                        const c = String(row.item_code || '').toLowerCase();
                        const n = String(row.item_name || '').toLowerCase();
                        const match = validCodeList.some(target => c === target || c.startsWith(target) || n.includes(target));
                        if (!match) return false;
                    }

                    return true;
                });

                // 4. 날씨 데이터 수신 및 화면 즉시 렌더링
                const weatherMap = await fetchWeatherData(sDate, eDate);
                if (fetchToken !== currentToken) return;

                renderDashboard(filteredData, weatherMap);
                recalculateStores(filteredData, true);

            } catch (e) {
                console.error("대시보드 조회 실패:", e);
                document.getElementById('kpi-total-stores').innerText = "0 개점";
            }
        }

        function renderDashboard(data, weatherMap = {}) {
            let totalQty = 0, totalAmount = 0; 
            const items = new Set(), dailyMap = {};

            data.forEach(r => {
                const q = cleanNumber(r.qty || r.total_qty);
                const amt = cleanNumber(r.total_amount) || (q * cleanNumber(r.price));
                totalQty += q; 
                totalAmount += amt;
                if (r.item_code) items.add(r.item_code);

                const dKey = formatDisplayDate(r.delivery_date);
                if (!dailyMap[dKey]) dailyMap[dKey] = { qty: 0, amount: 0 };
                dailyMap[dKey].qty += q; 
                dailyMap[dKey].amount += amt;
            });

            document.getElementById('kpi-total-qty').innerText = `${totalQty.toLocaleString()} 건`;
            document.getElementById('kpi-total-items').innerText = `${items.size.toLocaleString()} 종`;
            document.getElementById('kpi-total-amount').innerText = `${totalAmount.toLocaleString()} 원`;

            const rawDates = Object.keys(dailyMap).sort();
            const qtyData = rawDates.map(k => dailyMap[k].qty);
            const amtData = rawDates.map(k => dailyMap[k].amount);

            const chartLabels = rawDates.map(dKey => {
                const labelLines = [dKey];
                const w = weatherMap[dKey];
                if (w && w.tMin !== null && w.tMax !== null) {
                    const emoji = getWeatherEmoji(w.code, w.rain);
                    labelLines.push(`${emoji} ${Math.round(w.tMin)}°/${Math.round(w.tMax)}°`);
                }
                return labelLines;
            });

            const ctx = document.getElementById('dailyTrendChart').getContext('2d');
            if (trendChart) trendChart.destroy();
            trendChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartLabels,
                    datasets: [
                        {
                            label: '주문수량 (건)',
                            data: qtyData,
                            backgroundColor: 'rgba(37, 99, 235, 0.6)',
                            yAxisID: 'y1',
                            order: 2
                        },
                        {
                            label: '주문금액 (원)',
                            data: amtData,
                            type: 'line',
                            borderColor: '#8b5cf6',
                            backgroundColor: '#8b5cf6',
                            borderWidth: 2,
                            pointRadius: 2,
                            yAxisID: 'y2',
                            order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                title: (tooltipItems) => {
                                    const raw = tooltipItems[0].label;
                                    return Array.isArray(raw) ? raw[0] : raw;
                                },
                                afterBody: (tooltipItems) => {
                                    const raw = tooltipItems[0].label;
                                    const dKey = Array.isArray(raw) ? raw[0] : raw;
                                    const w = weatherMap[dKey];
                                    if (w && w.tMin !== null && w.tMax !== null) {
                                        const emoji = getWeatherEmoji(w.code, w.rain);
                                        return `🌤️ 날씨: ${emoji} 최저 ${Math.round(w.tMin)}℃ / 최고 ${Math.round(w.tMax)}℃`;
                                    }
                                    return '';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                font: { size: 10, weight: 'bold' },
                                maxRotation: 0,
                                minRotation: 0,
                                autoSkip: true,
                                autoSkipPadding: 8
                            }
                        },
                        y1: {
                            type: 'linear',
                            position: 'left',
                            beginAtZero: true,
                            grace: '20%',
                            title: { display: true, text: '주문수량 (건)', font: { size: 10, weight: 'bold' } }
                        },
                        y2: {
                            type: 'linear',
                            position: 'right',
                            beginAtZero: true,
                            grid: { drawOnChartArea: false },
                            grace: '20%',
                            title: { display: true, text: '주문금액 (원)', font: { size: 10, weight: 'bold' } }
                        }
                    }
                }
            });
        }

        function recalculateStores(storeList, isFinished = false) {
            const uniqueStores = new Set();
            currentBrandStoreMap = {};
            storeList.forEach(r => {
                if (r.store_name && r.store_name !== '-') {
                    uniqueStores.add(r.store_name);
                    const b = r.brand_name || '기타';
                    if (!currentBrandStoreMap[b]) currentBrandStoreMap[b] = new Set();
                    currentBrandStoreMap[b].add(r.store_name);
                }
            });

            const countStr = uniqueStores.size.toLocaleString();
            if (isFinished) {
                document.getElementById('kpi-total-stores').innerHTML = `${countStr} 개점`;
            } else {
                document.getElementById('kpi-total-stores').innerHTML = `<span class="loading-text">⚡ ${countStr} 개점</span>`;
            }
        }

        function openBrandStoreModal() {
            document.getElementById('brand-store-modal').style.display = 'flex';
            const listEl = document.getElementById('brand-store-modal-list');
            const sorted = Object.keys(currentBrandStoreMap).sort((a,b) => currentBrandStoreMap[b].size - currentBrandStoreMap[a].size);
            if (sorted.length === 0) {
                listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #94a3b8;">주문 점포 데이터가 없습니다.</div>';
                return;
            }
            listEl.innerHTML = sorted.map(b => `<div class="brand-store-modal-row"><span>🏢 ${b}</span><b>${currentBrandStoreMap[b].size.toLocaleString()} 개점</b></div>`).join('');
        }
        function closeBrandStoreModal() { document.getElementById('brand-store-modal').style.display = 'none'; }

        window.addEventListener('message', (e) => {
            if (e.data && (e.data.action === 'SEARCH' || e.data.action === 'INIT_SEARCH')) {
                fetchChartData(e.data.params);
            }
        });
        window.addEventListener('DOMContentLoaded', () => {
            window.parent.postMessage({ action: 'FRAME_READY', tab: 'dashboard' }, '*');
        });
    </script>
</body>
</html>
