<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>요약 대시보드 프레임</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background: transparent; color: #1e293b; padding: 5px 0; }
        .section-panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 15px; }
        .kpi-card { background: #f8fafc; padding: 15px 20px; border-radius: 8px; border-left: 5px solid #2563eb; }
        .kpi-card.green { border-left-color: #10b981; }
        .kpi-card.orange { border-left-color: #f59e0b; }
        .kpi-card.purple { border-left-color: #8b5cf6; }
        .kpi-title { font-size: 13px; color: #64748b; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .kpi-value { font-size: 22px; font-weight: 800; margin-top: 4px; color: #0f172a; }
        .btn-view-stores { background-color: #f59e0b; color: white; border: none; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
        .chart-container { position: relative; height: 350px; width: 100%; margin-top: 15px; }
        
        /* 점포 모달 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 420px; max-width: 90%; max-height: 85vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title { font-size: 16px; font-weight: 700; }
        .close-btn { cursor: pointer; font-size: 18px; font-weight: bold; color: #64748b; }
        .modal-body-scroll { flex: 1; overflow-y: auto; margin-top: 10px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
        .brand-store-modal-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; font-size: 13.5px; }
        .brand-store-modal-row b { color: #d97706; font-size: 14px; }

        @keyframes pulse-text { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .loading-text { font-size: 15px; color: #2563eb; animation: pulse-text 1.2s infinite; }
    </style>
</head>
<body>

    <div class="section-panel">
        <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-title">기간 내 총 주문수량</div><div class="kpi-value" id="kpi-total-qty">0 건</div></div>
            <div class="kpi-card green"><div class="kpi-title">기간 내 취급 품목수</div><div class="kpi-value" id="kpi-total-items">0 종</div></div>
            <div class="kpi-card orange">
                <div class="kpi-title"><span>기간 내 주문 점포수</span><button class="btn-view-stores" onclick="openBrandStoreModal()">상세보기 📋</button></div>
                <div class="kpi-value" id="kpi-total-stores">0 개점</div>
            </div>
            <div class="kpi-card purple"><div class="kpi-title">기간 내 총 주문금액</div><div class="kpi-value" id="kpi-total-amount">0 원</div></div>
        </div>
        <div class="chart-container">
            <canvas id="dailyTrendChart"></canvas>
        </div>
    </div>

    <!-- 🏢 브랜드별 점포수 상세 모달 -->
    <div class="modal-overlay" id="brand-store-modal">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title">🏢 브랜드별 주문 점포수 상세</span><span class="close-btn" onclick="closeBrandStoreModal()">✕</span></div>
            <div class="modal-body-scroll" id="brand-store-modal-list"></div>
            <div style="margin-top: 15px; text-align: right;"><button style="padding: 6px 14px; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer;" onclick="closeBrandStoreModal()">닫기</button></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://zbilhsgfgyfrolveaego.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN";
        let trendChart = null;
        let currentBrandStoreMap = {};
        let fetchToken = 0;

        function cleanNumber(val) { return parseFloat(String(val).replace(/[^0-9.-]/g, '')) || 0; }
        function formatDisplayDate(dateStr) { return !dateStr || dateStr === '-' ? '-' : String(dateStr).split('T')[0].replace(/-/g, '/'); }
        function safeSearchKeyword(term) { return term ? term.replace(/"/g, '').replace(/[()]/g, '*').trim() : ''; }

        function expandCodeVariants(rawCode) {
            const trimmed = String(rawCode).trim();
            const clean = trimmed.replace(/\.0$/, '');
            const withDotZero = clean + '.0';
            return [clean, withDotZero];
        }

        // 🌤️ 날씨 API 연동 함수 (서울 기준 최고기온 및 강수량 로드)
        async function fetchWeatherData(startDate, endDate) {
            try {
                let url = `https://archive-api.open-meteo.com/v1/archive?latitude=37.5665&longitude=126.9780&start_date=${startDate}&end_date=${endDate}&daily=temperature_2m_max,precipitation_sum&timezone=Asia%2FSeoul`;
                let res = await fetch(url);
                if (!res.ok) {
                    url = `https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&start_date=${startDate}&end_date=${endDate}&daily=temperature_2m_max,precipitation_sum&timezone=Asia%2FSeoul`;
                    res = await fetch(url);
                }
                if (res.ok) {
                    const json = await res.json();
                    const wMap = {};
                    if (json.daily && json.daily.time) {
                        json.daily.time.forEach((dStr, idx) => {
                            const dKey = formatDisplayDate(dStr);
                            wMap[dKey] = {
                                temp: json.daily.temperature_2m_max ? json.daily.temperature_2m_max[idx] : null,
                                rain: json.daily.precipitation_sum ? json.daily.precipitation_sum[idx] : null
                            };
                        });
                    }
                    return wMap;
                }
            } catch (err) {
                console.warn("날씨 데이터 로드 실패 (차트 정상 유지):", err);
            }
            return {};
        }

        async function fetchChartData(params) {
            const currentToken = ++fetchToken;
            const { startDate, endDate, brandName, itemName } = params;
            if (!startDate || !endDate) return;

            // 1. 요약 데이터 쿼리 URL 세팅
            let dailyUrl = `${SUPABASE_URL}/rest/v1/daily_order_summary?delivery_date=gte.${startDate}&delivery_date=lte.${endDate}&select=delivery_date,total_qty,total_amount,item_name,item_code,brand_name`;
            
            if (brandName) {
                const bList = brandName.split(',').map(b => b.trim()).filter(Boolean);
                if (bList.length === 1) dailyUrl += `&brand_name=ilike.*${encodeURIComponent(safeSearchKeyword(bList[0]))}*`;
                else if (bList.length > 1) dailyUrl += `&or=(${bList.map(b => `brand_name.ilike.*${encodeURIComponent(safeSearchKeyword(b))}*`).join(',')})`;
            }
            if (itemName) {
                const iList = itemName.split(',').map(i => i.trim()).filter(Boolean);
                if (iList.length === 1) { 
                    const safe = encodeURIComponent(safeSearchKeyword(iList[0]));
                    dailyUrl += `&or=(item_code.ilike.*${safe}*,item_name.ilike.*${safe}*)`; 
                } else if (iList.length > 1) { 
                    const orConds = iList.map(i => {
                        const safe = encodeURIComponent(safeSearchKeyword(i));
                        return `item_code.ilike.*${safe}*,item_name.ilike.*${safe}*`;
                    }).join(','); 
                    dailyUrl += `&or=(${orConds})`; 
                }
            }

            try {
                // 1단계: 주문 요약 데이터와 날씨 데이터를 병렬로 동시 호출
                const [resDaily, weatherMap] = await Promise.all([
                    fetch(dailyUrl, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }),
                    fetchWeatherData(startDate, endDate)
                ]);
                const dailyData = resDaily.ok ? await resDaily.json() : [];

                document.getElementById('kpi-total-stores').innerHTML = `<span class="loading-text">⚡ 집계중...</span>`;
                currentBrandStoreMap = {};
                renderDashboard(dailyData, weatherMap);

                // 2단계: 점포수 산출 (.0 코드 포맷 완벽 매칭 유지)
                if (itemName) {
                    const codeTargets = new Set();
                    
                    const userInputs = itemName.split(',').map(s => s.trim()).filter(Boolean);
                    userInputs.forEach(input => {
                        expandCodeVariants(input).forEach(c => codeTargets.add(c));
                    });

                    dailyData.forEach(r => {
                        if (r.item_code && r.item_code !== '-') {
                            expandCodeVariants(r.item_code).forEach(c => codeTargets.add(c));
                        }
                    });

                    const finalCodes = Array.from(codeTargets);
                    if (finalCodes.length === 0) {
                        recalculateStores([], true);
                        return;
                    }

                    let storeUrl = `${SUPABASE_URL}/rest/v1/oms_orders?delivery_date=gte.${startDate}&delivery_date=lte.${endDate}&select=store_name,brand_name`;

                    if (brandName) {
                        const bList = brandName.split(',').map(b => b.trim()).filter(Boolean);
                        if (bList.length === 1) storeUrl += `&brand_name=ilike.*${encodeURIComponent(safeSearchKeyword(bList[0]))}*`;
                        else if (bList.length > 1) storeUrl += `&or=(${bList.map(b => `brand_name.ilike.*${encodeURIComponent(safeSearchKeyword(b))}*`).join(',')})`;
                    }

                    storeUrl += `&item_code=in.(${finalCodes.map(encodeURIComponent).join(',')})`;

                    let offset = 0, limit = 1000, hasMore = true;
                    let storeDataAccumulated = [];
                    while (hasMore) {
                        if (fetchToken !== currentToken) return;
                        const res = await fetch(`${storeUrl}&limit=${limit}&offset=${offset}`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                        if (res.ok) {
                            const chunk = await res.json();
                            if (!chunk || chunk.length === 0) break;
                            storeDataAccumulated = storeDataAccumulated.concat(chunk);
                            recalculateStores(storeDataAccumulated, false);
                            if (chunk.length < limit) hasMore = false; else offset += limit;
                        } else { 
                            hasMore = false; 
                        }
                    }
                    recalculateStores(storeDataAccumulated, true);

                } else {
                    let storeUrl = `${SUPABASE_URL}/rest/v1/store_order_summary?delivery_date=gte.${startDate}&delivery_date=lte.${endDate}&select=store_name,brand_name`;
                    if (brandName) {
                        const bList = brandName.split(',').map(b => b.trim()).filter(Boolean);
                        if (bList.length === 1) storeUrl += `&brand_name=ilike.*${encodeURIComponent(safeSearchKeyword(bList[0]))}*`;
                        else if (bList.length > 1) storeUrl += `&or=(${bList.map(b => `brand_name.ilike.*${encodeURIComponent(safeSearchKeyword(b))}*`).join(',')})`;
                    }

                    const res = await fetch(`${storeUrl}&limit=10000`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                    const storeDataAccumulated = res.ok ? await res.json() : [];
                    recalculateStores(storeDataAccumulated, true);
                }

            } catch (e) {
                console.error("대시보드 조회 실패:", e);
                document.getElementById('kpi-total-stores').innerText = "0 개점";
            }
        }

        function renderDashboard(data, weatherMap = {}) {
            let totalQty = 0, totalAmount = 0; const items = new Set(), dailyMap = {};
            data.forEach(r => {
                const q = cleanNumber(r.total_qty || r.qty), amt = cleanNumber(r.total_amount) || (q * cleanNumber(r.price));
                totalQty += q; totalAmount += amt;
                if (r.item_name) items.add(r.item_name);
                const dKey = formatDisplayDate(r.delivery_date);
                if (!dailyMap[dKey]) dailyMap[dKey] = { qty: 0, amount: 0 };
                dailyMap[dKey].qty += q; dailyMap[dKey].amount += amt;
            });

            document.getElementById('kpi-total-qty').innerText = `${totalQty.toLocaleString()} 건`;
            document.getElementById('kpi-total-items').innerText = `${items.size.toLocaleString()} 종`;
            document.getElementById('kpi-total-amount').innerText = `${totalAmount.toLocaleString()} 원`;

            const labels = Object.keys(dailyMap).sort();
            const qtyData = labels.map(k => dailyMap[k].qty);
            const amtData = labels.map(k => dailyMap[k].amount);
            
            // 날씨 데이터 매핑 (기온 및 강수량)
            const tempData = labels.map(k => (weatherMap[k] && weatherMap[k].temp !== null) ? weatherMap[k].temp : null);
            const hasWeatherData = tempData.some(v => v !== null);

            // 차트 데이터셋 구성
            const datasets = [
                {
                    label: '주문수량 (건)',
                    data: qtyData,
                    backgroundColor: 'rgba(37, 99, 235, 0.6)',
                    yAxisID: 'y1',
                    order: 3
                },
                {
                    label: '주문금액 (원)',
                    data: amtData,
                    type: 'line',
                    borderColor: '#8b5cf6',
                    backgroundColor: '#8b5cf6',
                    borderWidth: 2,
                    pointRadius: 2,
                    yAxisID: 'y2',
                    order: 2
                }
            ];

            // 날씨 데이터가 존재하면 최고기온 라인 추가
            if (hasWeatherData) {
                datasets.push({
                    label: '최고기온 (℃)',
                    data: tempData,
                    type: 'line',
                    borderColor: '#f97316',
                    backgroundColor: '#f97316',
                    borderWidth: 2,
                    borderDash: [3, 3],
                    pointRadius: 3,
                    yAxisID: 'y3',
                    order: 1
                });
            }

            const scales = {
                x: { ticks: { font: { size: 11, weight: 'bold' } } },
                y1: {
                    type: 'linear',
                    position: 'left',
                    beginAtZero: true,
                    grace: '20%',
                    title: { display: true, text: '주문수량 (건)', font: { size: 10, weight: 'bold' } }
                },
                y2: {
                    type: 'linear',
                    position: 'right',
                    beginAtZero: true,
                    grid: { drawOnChartArea: false },
                    grace: '20%',
                    title: { display: true, text: '주문금액 (원)', font: { size: 10, weight: 'bold' } }
                }
            };

            if (hasWeatherData) {
                scales.y3 = {
                    type: 'linear',
                    position: 'right',
                    grid: { drawOnChartArea: false },
                    title: { display: true, text: '기온 (℃)', font: { size: 10, weight: 'bold' } },
                    ticks: { callback: v => `${v}℃` }
                };
            }

            const ctx = document.getElementById('dailyTrendChart').getContext('2d');
            if (trendChart) trendChart.destroy();
            trendChart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                afterBody: (tooltipItems) => {
                                    const dKey = tooltipItems[0].label;
                                    if (weatherMap[dKey] && weatherMap[dKey].rain !== null && weatherMap[dKey].rain > 0) {
                                        return `🌧️ 강수량: ${weatherMap[dKey].rain}mm`;
                                    }
                                    return '';
                                }
                            }
                        }
                    },
                    scales
                }
            });
        }

        function recalculateStores(storeList, isFinished = false) {
            const uniqueStores = new Set();
            currentBrandStoreMap = {};
            storeList.forEach(r => {
                if (r.store_name && r.store_name !== '-') {
                    uniqueStores.add(r.store_name);
                    const b = r.brand_name || '기타';
                    if (!currentBrandStoreMap[b]) currentBrandStoreMap[b] = new Set();
                    currentBrandStoreMap[b].add(r.store_name);
                }
            });

            const countStr = uniqueStores.size.toLocaleString();
            if (isFinished) {
                document.getElementById('kpi-total-stores').innerHTML = `${countStr} 개점`;
            } else {
                document.getElementById('kpi-total-stores').innerHTML = `<span class="loading-text">⚡ ${countStr} 개점</span>`;
            }
        }

        function openBrandStoreModal() {
            document.getElementById('brand-store-modal').style.display = 'flex';
            const listEl = document.getElementById('brand-store-modal-list');
            const sorted = Object.keys(currentBrandStoreMap).sort((a,b) => currentBrandStoreMap[b].size - currentBrandStoreMap[a].size);
            if(sorted.length === 0) {
                listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #94a3b8;">주문 점포 데이터가 없습니다.</div>';
                return;
            }
            listEl.innerHTML = sorted.map(b => `<div class="brand-store-modal-row"><span>🏢 ${b}</span><b>${currentBrandStoreMap[b].size.toLocaleString()} 개점</b></div>`).join('');
        }
        function closeBrandStoreModal() { document.getElementById('brand-store-modal').style.display = 'none'; }

        window.addEventListener('message', (e) => {
            if (e.data && (e.data.action === 'SEARCH' || e.data.action === 'INIT_SEARCH')) {
                fetchChartData(e.data.params);
            }
        });
        window.addEventListener('DOMContentLoaded', () => {
            window.parent.postMessage({ action: 'FRAME_READY', tab: 'dashboard' }, '*');
        });
    </script>
</body>
</html>
