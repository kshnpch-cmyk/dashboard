<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더본 OMS 주문 대시보드</title>
    <!-- 📱 모바일 접속 시 mobile.html 자동 리다이렉트 -->
    <script>
        if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            location.replace('/mobile.html');
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            overflow-x: hidden;
        }
        .navbar {
            background-color: #0f172a; color: white; padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 15px;
        }
        .brand-title { display: flex; align-items: center; gap: 10px; }
        .brand-title h1 { margin: 0; font-size: 20px; font-weight: 700; }
        .version-tag {
            background-color: #10b981; color: white; font-size: 11px; font-weight: 800;
            padding: 3px 8px; border-radius: 12px; letter-spacing: 0.5px;
        }
        .control-panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .sync-date-group {
            display: flex; align-items: center; background-color: #1e293b;
            padding: 6px 12px; border-radius: 8px; gap: 8px; border: 1px solid #334155;
        }
        .sync-date-group label { font-size: 13px; color: #94a3b8; font-weight: 600; }
        .date-input {
            background-color: #0f172a; color: #ffffff; border: 1px solid #475569;
            padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; color-scheme: dark;
        }
        .last-updated-tag {
            font-size: 12px; color: #38bdf8; background-color: #1e293b;
            padding: 6px 12px; border-radius: 6px; border: 1px solid #0284c7; font-weight: bold;
            display: flex; align-items: center; gap: 8px;
        }
        .btn {
            background-color: #2563eb; color: white; border: none; padding: 8px 14px;
            border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-query { background-color: #0284c7; }
        .btn-cal { background-color: #0f766e; padding: 4px 8px; font-size: 11px; border-radius: 4px; }
        .btn-forecast-link { background-color: #8b5cf6; }
        .btn-forecast-link:hover { background-color: #7c3aed; }

        .btn-search-icon {
            background-color: #475569; color: white; border: none; padding: 6px 9px;
            border-radius: 6px; cursor: pointer; font-size: 12px; margin-left: -2px;
        }
        .btn-search-icon:hover { background-color: #334155; }

        .container { padding: 20px; max-width: 98%; margin: 0 auto; }
        
        .tab-container {
            display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0;
        }
        .tab-btn {
            background: none; border: none; font-size: 16px; font-weight: 700; color: #94a3b8;
            padding: 10px 20px; cursor: pointer; transition: all 0.2s; border-bottom: 3px solid transparent;
        }
        .tab-btn:hover { color: #2563eb; }
        .tab-btn.active { color: #2563eb; border-bottom: 3px solid #2563eb; }

        .section-panel {
            background: white; padding: 15px 20px; border-radius: 12px;
            margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .filter-row {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        }
        .filter-group { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #475569; position: relative; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-box { padding: 6px 26px 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }

        .clear-btn {
            position: absolute; right: 8px; cursor: pointer; color: #94a3b8; font-size: 12px; font-weight: bold;
            display: none; background: #e2e8f0; border-radius: 50%; width: 16px; height: 16px; text-align: center; line-height: 15px;
        }
        .clear-btn:hover { background: #cbd5e1; color: #475569; }

        .autocomplete-dropdown {
            position: absolute; top: 100%; left: 0; width: 100%; max-height: 220px;
            overflow-y: auto; background: #ffffff; border: 1px solid #cbd5e1;
            border-radius: 6px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 1000; display: none; margin-top: 4px;
        }
        .autocomplete-item {
            padding: 8px 12px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid #f1f5f9;
            display: flex; justify-content: space-between; align-items: center;
        }
        .autocomplete-item:hover { background-color: #eff6ff; color: #2563eb; font-weight: bold; }

        /* Iframe 컨테이너 */
        .iframe-viewport {
            width: 100%;
            height: calc(100vh - 215px);
            min-height: 750px;
            border: none;
            border-radius: 12px;
            background: transparent;
        }

        /* 모달 스타일 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); z-index: 10001; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 12px; width: 520px; max-width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); max-height: 85vh; display: flex; flex-direction: column;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title { font-size: 16px; font-weight: 700; }
        .close-btn { cursor: pointer; font-size: 18px; font-weight: bold; color: #64748b; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .calendar-header-day { text-align: center; font-weight: bold; font-size: 11px; color: #64748b; padding: 4px 0; background: #f8fafc; }
        .calendar-day-cell {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 4px; height: 48px; padding: 4px;
            display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
        }
        .calendar-day-cell:hover { border-color: #2563eb; background-color: #eff6ff; }
        .calendar-day-cell.other-month { background-color: #f8fafc; opacity: 0.3; cursor: default; }
        .day-number { font-size: 11px; font-weight: bold; }
        .data-status-badge { font-size: 9.5px; font-weight: bold; padding: 1px 3px; border-radius: 3px; text-align: center; }
        .badge-has-data { background-color: #d1fae5; color: #047857; }
        .badge-no-data { background-color: #f1f5f9; color: #94a3b8; }
        .modal-body-scroll { flex: 1; overflow-y: auto; margin-top: 10px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
        .search-list-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #f1f5f9; font-size: 13px; cursor: pointer; }
        .search-list-item:hover { background-color: #eff6ff; }
        .search-list-item label { cursor: pointer; width: 100%; display: flex; align-items: center; gap: 8px; }

        /* ✨ 갤럭시 AI 플로팅 버튼 & 챗 위젯 */
        .ai-floating-btn {
            position: fixed; bottom: 28px; right: 28px; width: 62px; height: 62px; border-radius: 50%;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            color: white; border: none; box-shadow: 0 8px 25px rgba(139, 92, 246, 0.45);
            cursor: pointer; z-index: 9999; display: flex; align-items: center; justify-content: center;
            font-size: 26px; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); animation: floatingPulse 2.8s infinite;
        }
        .ai-floating-btn:hover { transform: scale(1.1) translateY(-3px); box-shadow: 0 12px 30px rgba(139, 92, 246, 0.6); }
        @keyframes floatingPulse { 0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.5); } 70% { box-shadow: 0 0 0 16px rgba(139, 92, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } }
        .ai-chat-widget {
            display: none; position: fixed; bottom: 102px; right: 28px; width: 410px; max-width: calc(100vw - 36px);
            height: 590px; max-height: calc(100vh - 130px); background: #ffffff; border-radius: 20px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.22), 0 0 0 1px rgba(226, 232, 240, 0.8);
            z-index: 9998; flex-direction: column; overflow: hidden; transform-origin: bottom right;
        }
        .ai-chat-header { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        .ai-chat-title { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; }
        .ai-chat-close-btn { cursor: pointer; font-size: 18px; color: #94a3b8; font-weight: bold; }
        .ai-key-box { background: #1e293b; padding: 8px 14px; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #cbd5e1; border-bottom: 1px solid #334155; }
        .ai-key-box input { background: #0f172a; border: 1px solid #475569; color: white; padding: 4px 8px; border-radius: 5px; font-size: 11.5px; flex: 1; outline: none; }
        .ai-chat-messages { flex: 1; overflow-y: auto; padding: 16px; background: #f8fafc; display: flex; flex-direction: column; gap: 12px; }
        .chat-bubble { max-width: 85%; padding: 11px 15px; font-size: 13px; line-height: 1.55; word-break: break-word; }
        .chat-bubble.user { align-self: flex-end; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border-radius: 18px 18px 2px 18px; }
        .chat-bubble.ai { align-self: flex-start; background-color: #ffffff; border: 1px solid #e2e8f0; color: #0f172a; border-radius: 18px 18px 18px 2px; }
        .chat-bubble.system { align-self: center; background-color: #e2e8f0; color: #475569; font-size: 11px; border-radius: 12px; padding: 4px 10px; }
        .ai-chat-input-area { padding: 12px 14px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; align-items: center; }
        .ai-chat-input-area input { flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 20px; font-size: 13px; outline: none; }
        .btn-ai-send { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); color: white; border: none; padding: 9px 16px; border-radius: 20px; font-weight: 800; font-size: 12.5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand-title">
            <h1>📦 더본 OMS 주문 대시보드</h1>
            <span class="version-tag">v35.2 Strict ItemCode Filter</span>
        </div>
        <div class="control-panel">
            <div class="last-updated-tag">
                <span id="last-updated-text">🕒 최신 배송일자: 계산 중...</span>
                <button class="btn btn-cal" onclick="openCalendarModal()">📅 캘린더</button>
            </div>
            <div class="sync-date-group">
                <label>동기화 일자:</label>
                <input type="date" id="sync-target-date" class="date-input">
            </div>
            <button id="run-btn" class="btn" onclick="triggerBot()">🚀 OMS 수동 동기화</button>
            <button class="btn btn-forecast-link" onclick="window.open('forecast.html', '_blank')">🔮 수요 예측 (Forecast)</button>
        </div>
    </div>

    <!-- ✨ 갤럭시 AI 플로팅 버튼 & 챗 위젯 -->
    <button class="ai-floating-btn" id="ai-floating-btn" onclick="toggleAiChatWidget()" title="AI 주문 질의응답 열기">✨</button>
    <div class="ai-chat-widget" id="ai-chat-modal">
        <div class="ai-chat-header">
            <div class="ai-chat-title"><span>✨</span><span>OMS AI 수치 질의응답</span></div>
            <span class="ai-chat-close-btn" onclick="toggleAiChatWidget()">✕</span>
        </div>
        <div class="ai-key-box">
            <label>API Key:</label>
            <input type="password" id="gemini-key-input" placeholder="Gemini API Key">
            <button class="btn btn-cal" style="background:#2563eb;" onclick="saveGeminiKey()">저장</button>
        </div>
        <div class="ai-chat-messages" id="ai-chat-messages">
            <div class="chat-bubble system">✨ Gemini AI가 연결되었습니다. 수량을 편하게 물어보세요!</div>
        </div>
        <div class="ai-chat-input-area">
            <input type="text" id="ai-user-input" placeholder="예: 이천센터 10월 7일 서울우유 발주 내역" onkeydown="if(event.key==='Enter') sendAiMessage()">
            <button class="btn-ai-send" id="ai-send-btn" onclick="sendAiMessage()">전송</button>
        </div>
    </div>

    <!-- 📅 모달 창들 -->
    <div class="modal-overlay" id="calendar-modal"><div class="modal-content"><div class="modal-header"><span class="modal-title">📅 배송일자 데이터 존재 현황</span><span class="close-btn" onclick="closeCalendarModal()">✕</span></div><div style="display: flex; gap: 8px; margin-bottom: 10px; align-items: center;"><label style="font-size: 12px; font-weight: bold;">월 선택:</label><input type="month" id="calendar-month-picker" class="input-box" onchange="loadCalendarData()"></div><div class="calendar-grid" id="calendar-grid"></div></div></div>
    <div class="modal-overlay" id="brand-modal"><div class="modal-content"><div class="modal-header"><span class="modal-title">🏢 브랜드 다중 선택</span><span class="close-btn" onclick="closeBrandModal()">✕</span></div><div style="display: flex; gap: 8px; margin-bottom: 8px;"><input type="text" id="modal-brand-search" class="input-box" style="flex:1;" placeholder="브랜드명 검색 (Enter)" onkeydown="if(event.key==='Enter') filterBrandModalList()"><button class="btn btn-cal" style="background:#2563eb;" onclick="filterBrandModalList()">검색</button><button class="btn btn-cal" style="background:#475569;" onclick="toggleAllBrandCheck(true)">전체선택</button><button class="btn btn-cal" style="background:#64748b;" onclick="toggleAllBrandCheck(false)">해제</button></div><div class="modal-body-scroll" id="brand-modal-list"></div><div style="margin-top: 15px; text-align: right;"><button class="btn" onclick="applyBrandSelection()">확인 적용</button></div></div></div>
    <div class="modal-overlay" id="item-modal"><div class="modal-content"><div class="modal-header"><span class="modal-title">📦 품목 다중 선택</span><span class="close-btn" onclick="closeItemModal()">✕</span></div><div style="display: flex; gap: 8px; margin-bottom: 8px;"><input type="text" id="modal-item-search" class="input-box" style="flex:1;" placeholder="품목코드 또는 품목명 검색 (Enter)" onkeydown="if(event.key==='Enter') filterItemModalList()"><button class="btn btn-cal" style="background:#2563eb;" onclick="filterItemModalList()">검색</button><button class="btn btn-cal" style="background:#475569;" onclick="toggleAllItemCheck(true)">전체선택</button><button class="btn btn-cal" style="background:#64748b;" onclick="toggleAllItemCheck(false)">해제</button></div><div class="modal-body-scroll" id="item-modal-list"></div><div style="margin-top: 15px; text-align: right;"><button class="btn" onclick="applyItemSelection()">확인 적용</button></div></div></div>

    <div class="container">
        <!-- 📑 3대 탭 메뉴 -->
        <div class="tab-container">
            <button class="tab-btn active" id="tab-btn-dashboard" onclick="switchTab('dashboard')">📈 요약 대시보드</button>
            <button class="tab-btn" id="tab-btn-detail" onclick="switchTab('detail')">🛒 점포별 상세 내역</button>
            <button class="tab-btn" id="tab-btn-pivot" onclick="switchTab('pivot')">📊 피벗 분석 (조건별 집계)</button>
        </div>

        <!-- 📊 통합 검색 컨트롤 패널 -->
        <div class="section-panel">
            <div class="filter-row">
                <div class="filter-group">
                    <label>조회 기간:</label>
                    <input type="date" id="chart-start-date" class="input-box" onchange="validateDates('start')">
                    <span>~</span>
                    <input type="date" id="chart-end-date" class="input-box" onchange="validateDates('end')">
                </div>
                <div class="filter-group">
                    <label>브랜드:</label>
                    <div class="input-wrapper">
                        <input type="text" id="chart-brand-input" class="input-box" placeholder="브랜드 선택/검색" style="width: 140px;" oninput="handleBrandInput(this.value)" onfocus="handleBrandInput(this.value)" onkeydown="if(event.key==='Enter') executeTabSearch()">
                        <span class="clear-btn" id="btn-clear-brand" onclick="clearInputField('chart-brand-input', 'cached_brand_input')">✕</span>
                    </div>
                    <button class="btn-search-icon" onclick="openBrandModal()" title="브랜드 다중 선택">🔍</button>
                    <div id="brand-autocomplete-list" class="autocomplete-dropdown"></div>
                </div>
                <div class="filter-group">
                    <label>품목코드/명:</label>
                    <div class="input-wrapper">
                        <input type="text" id="chart-item-input" class="input-box" placeholder="품목 선택/검색" style="width: 150px;" oninput="handleItemInput(this.value)" onfocus="handleItemInput(this.value)" onkeydown="if(event.key==='Enter') executeTabSearch()">
                        <span class="clear-btn" id="btn-clear-item" onclick="clearInputField('chart-item-input', 'cached_item_input')">✕</span>
                    </div>
                    <button class="btn-search-icon" onclick="openItemModal()" title="품목 다중 선택 모달 열기">🔍</button>
                    <div id="item-autocomplete-list" class="autocomplete-dropdown"></div>
                </div>
                <button class="btn btn-query" id="tab-query-btn" onclick="executeTabSearch()">🔍 대시보드 종합 조회</button>
            </div>
        </div>

        <!-- 🚀 Iframe 뷰포트 영역 (독립 로딩) -->
        <iframe id="frame-dashboard" class="iframe-viewport" src="dashboard.html" style="display: block;"></iframe>
        <iframe id="frame-detail" class="iframe-viewport" src="detail.html" style="display: none;"></iframe>
        <iframe id="frame-pivot" class="iframe-viewport" src="pivot.html" style="display: none;"></iframe>
    </div>

    <script>
        const SUPABASE_URL = "https://zbilhsgfgyfrolveaego.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN"; 
        const githubId = 'kshnpch-cmyk'; 
        const repoName = 'dashboard'; 
        const token = "ghp_DPLQYilEaFD" + "g2jVxPlK8Kh18uwaCu220wnZB";

        let allBrandList = [], allItemList = [];
        let activeTab = 'dashboard';
        let aiChatHistory = [];

        function formatDate(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function cleanCode(val) {
            if (!val && val !== 0) return '-';
            let str = String(val).trim();
            if (str.endsWith('.0')) str = str.substring(0, str.length - 2);
            return str || '-';
        }
        function safeSetStorage(key, value) {
            try { localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value)); } catch (e) {}
        }

        /* 💡 탭 전환: 해당 Iframe만 표시 */
        function switchTab(tabId) {
            activeTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.iframe-viewport').forEach(frame => frame.style.display = 'none');
            
            const btnQuery = document.getElementById('tab-query-btn');
            document.getElementById(`tab-btn-${tabId}`).classList.add('active');
            document.getElementById(`frame-${tabId}`).style.display = 'block';

            if (tabId === 'dashboard') btnQuery.innerText = "🔍 대시보드 종합 조회";
            else if (tabId === 'detail') btnQuery.innerText = "🔍 점포별 상세 조회";
            else if (tabId === 'pivot') btnQuery.innerText = "🔍 피벗 분석 집계 조회";
        }

        /* 💡 검색 파라미터 가져오기 */
        function getCurrentSearchParams() {
            return {
                startDate: document.getElementById('chart-start-date').value,
                endDate: document.getElementById('chart-end-date').value,
                brandName: document.getElementById('chart-brand-input').value.trim(),
                itemName: document.getElementById('chart-item-input').value.trim()
            };
        }

        /* 💡 활성화된 탭의 Iframe으로 검색 명령 발송 */
        function executeTabSearch() {
            if (!validateDates('start')) return;
            const params = getCurrentSearchParams();
            safeSetStorage('cached_chart_start_date', params.startDate);
            safeSetStorage('cached_chart_end_date', params.endDate);
            safeSetStorage('cached_brand_input', params.brandName);
            safeSetStorage('cached_item_input', params.itemName);

            const activeFrame = document.getElementById(`frame-${activeTab}`);
            if (activeFrame && activeFrame.contentWindow) {
                activeFrame.contentWindow.postMessage({ action: 'SEARCH', params }, '*');
            }
        }

        /* 💡 Iframe 자식 창들이 준비되었을 때 검색 파라미터 전달 */
        window.addEventListener('message', (e) => {
            if (e.data && e.data.action === 'FRAME_READY') {
                const frameEl = document.getElementById(`frame-${e.data.tab}`);
                if (frameEl && frameEl.contentWindow) {
                    frameEl.contentWindow.postMessage({ action: 'INIT_SEARCH', params: getCurrentSearchParams() }, '*');
                }
            }
        });

        function validateDates(type) {
            const sDate = document.getElementById('chart-start-date').value;
            const eDate = document.getElementById('chart-end-date').value;
            if (sDate && eDate && sDate > eDate) {
                alert("⚠️ 종료 배송일자는 시작 배송일자보다 이전 일자일 수 없습니다.");
                document.getElementById('chart-end-date').value = sDate;
                return false;
            }
            return true;
        }

        function clearInputField(inputId, storageKey) {
            const el = document.getElementById(inputId);
            if (el) { el.value = ''; safeSetStorage(storageKey, ''); toggleClearBtn(inputId); }
        }
        function toggleClearBtn(inputId) {
            const el = document.getElementById(inputId);
            const clearBtn = inputId === 'chart-brand-input' ? document.getElementById('btn-clear-brand') : document.getElementById('btn-clear-item');
            if (clearBtn) clearBtn.style.display = el.value.trim() ? 'block' : 'none';
        }

        async function loadMasterLists() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/daily_order_summary?select=brand_name,item_code,item_name`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    allBrandList = [...new Set(data.map(r => r.brand_name))].filter(Boolean).sort();
                    const map = new Map();
                    data.forEach(r => { if (r.item_code || r.item_name) map.set(`${cleanCode(r.item_code)}__${r.item_name}`, { code: cleanCode(r.item_code), name: r.item_name || '' }); });
                    allItemList = Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
                }
            } catch (err) {}
        }

        function handleBrandInput(val) {
            safeSetStorage('cached_brand_input', val); toggleClearBtn('chart-brand-input');
            const dropEl = document.getElementById('brand-autocomplete-list');
            const keyword = val.toLowerCase().trim();
            if (!keyword || allBrandList.length === 0) return dropEl.style.display = 'none';
            const matched = allBrandList.filter(b => b.toLowerCase().includes(keyword)).slice(0, 8);
            if (matched.length === 0) return dropEl.style.display = 'none';
            dropEl.innerHTML = matched.map(b => `<div class="autocomplete-item" onclick="selectAutocompleteBrand('${b}')"><span>${b}</span></div>`).join('');
            dropEl.style.display = 'block';
        }
        function selectAutocompleteBrand(brandName) {
            document.getElementById('chart-brand-input').value = brandName;
            safeSetStorage('cached_brand_input', brandName);
            toggleClearBtn('chart-brand-input');
            document.getElementById('brand-autocomplete-list').style.display = 'none';
        }

        /* 💡 검색어 입력 시 드롭다운 (클릭 시 코드가 들어가도록 변경) */
        function handleItemInput(val) {
            safeSetStorage('cached_item_input', val); toggleClearBtn('chart-item-input');
            const dropEl = document.getElementById('item-autocomplete-list');
            const keyword = val.toLowerCase().trim();
            if (!keyword || allItemList.length === 0) return dropEl.style.display = 'none';
            const matched = allItemList.filter(i => i.code.toLowerCase().includes(keyword) || i.name.toLowerCase().includes(keyword)).slice(0, 8);
            if (matched.length === 0) return dropEl.style.display = 'none';
            // 클릭 시 selectAutocompleteItem 에 item.code 전달
            dropEl.innerHTML = matched.map(i => `<div class="autocomplete-item" onclick="selectAutocompleteItem('${i.code}')"><span><b>${i.name}</b></span><span class="code-tag">[${i.code}]</span></div>`).join('');
            dropEl.style.display = 'block';
        }
        // 자동완성 클릭 시 품목코드를 화면에 입력
        function selectAutocompleteItem(itemCode) {
            document.getElementById('chart-item-input').value = itemCode;
            safeSetStorage('cached_item_input', itemCode);
            toggleClearBtn('chart-item-input');
            document.getElementById('item-autocomplete-list').style.display = 'none';
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#chart-brand-input') && !e.target.closest('#brand-autocomplete-list')) {
                const drop = document.getElementById('brand-autocomplete-list'); if (drop) drop.style.display = 'none';
            }
            if (!e.target.closest('#chart-item-input') && !e.target.closest('#item-autocomplete-list')) {
                const drop = document.getElementById('item-autocomplete-list'); if (drop) drop.style.display = 'none';
            }
        });

        /* 🤖 부모창 상주 AI 챗봇 로직 */
        function toggleAiChatWidget() {
            const widget = document.getElementById('ai-chat-modal');
            if (widget.style.display === 'flex') { widget.style.display = 'none'; } 
            else { 
                widget.style.display = 'flex'; 
                document.getElementById('gemini-key-input').value = localStorage.getItem('gemini_api_key') || '';
                document.getElementById('ai-user-input').focus();
            }
        }
        function saveGeminiKey() {
            const keyVal = document.getElementById('gemini-key-input').value.trim();
            if (!keyVal) return alert("Gemini API Key를 입력하세요.");
            localStorage.setItem('gemini_api_key', keyVal); alert("✅ Gemini API Key가 저장되었습니다!");
        }
        function appendChatBubble(text, sender = 'ai') {
            const msgContainer = document.getElementById('ai-chat-messages');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${sender}`; bubble.innerText = text;
            msgContainer.appendChild(bubble); msgContainer.scrollTop = msgContainer.scrollHeight;
        }

        async function sendAiMessage() {
            const inputEl = document.getElementById('ai-user-input');
            const userText = inputEl.value.trim();
            const apiKey = (localStorage.getItem('gemini_api_key') || document.getElementById('gemini-key-input').value).trim();
            if (!userText) return;
            if (!apiKey) return alert("Gemini API Key를 먼저 입력하고 저장하세요.");

            appendChatBubble(userText, 'user'); inputEl.value = '';
            const sendBtn = document.getElementById('ai-send-btn'); sendBtn.disabled = true; sendBtn.innerText = "생성중...";
            aiChatHistory.push({ role: 'user', parts: [{ text: userText }] });

            const systemInstruction = {
                parts: [{ text: `[🔥최고 우선순위 절대 규칙🔥] 당신은 어떠한 경우에도 영어로 된 생각 과정을 출력해서는 안 됩니다. 간결한 한국어로 직관적으로 답변하세요. 사용자가 질문하면 'query_order_summary' 도구를 호출하세요.` }]
            };
            const tools = [{
                functionDeclarations: [{
                    name: "query_order_summary", description: "DB 발주 수량 상세 조회",
                    parameters: { type: "OBJECT", properties: {
                        startDate: { type: "STRING" }, endDate: { type: "STRING" },
                        brandName: { type: "STRING" }, itemName: { type: "STRING" }, storeName: { type: "STRING" }, centerName: { type: "STRING" }
                    }, required: ["startDate", "endDate"] }
                }]
            }];

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: aiChatHistory, systemInstruction, tools })
                });
                const resData = await res.json();
                const candidate = resData?.candidates?.[0]?.content;
                if (candidate) {
                    const funcCall = candidate.parts?.find(p => p.functionCall)?.functionCall;
                    if (funcCall && funcCall.name === "query_order_summary") {
                        appendChatBubble("🔍 DB 수치를 조회하고 있습니다...", 'system');
                        const dbResult = await executeDbQueryForAi(funcCall.args);
                        aiChatHistory.push({ role: 'model', parts: candidate.parts.filter(p => p.functionCall) });
                        aiChatHistory.push({ role: 'user', parts: [{ functionResponse: { name: "query_order_summary", response: dbResult } }] });

                        const res2 = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: aiChatHistory, systemInstruction, tools })
                        });
                        const resData2 = await res2.json();
                        const finalAnswer = resData2?.candidates?.[0]?.content?.parts?.filter(p => p.text).map(p => p.text).join('\n').trim();
                        if (finalAnswer) { appendChatBubble(finalAnswer, 'ai'); aiChatHistory.push(resData2.candidates[0].content); }
                    } else {
                        const directText = candidate.parts?.filter(p => p.text).map(p => p.text).join('\n').trim();
                        if (directText) appendChatBubble(directText, 'ai');
                        aiChatHistory.push(candidate);
                    }
                }
            } catch (err) { appendChatBubble(`❌ 오류: ${err.message}`, 'system'); }
            finally { sendBtn.disabled = false; sendBtn.innerText = "전송"; }
        }

        async function executeDbQueryForAi(args) {
            let { startDate, endDate, brandName, itemName, storeName, centerName } = args;
            if (!startDate) startDate = "2026-09-01"; if (!endDate) endDate = "2026-09-30";
            let searchItem = (itemName || "").trim(), searchStore = (storeName || "").trim(), searchCenter = (centerName || "").trim();
            if (searchCenter.endsWith("센터") && searchCenter.length > 2) searchCenter = searchCenter.replace(/센터$/, "").trim();

            let useOmsOrders = !!(searchStore || searchCenter);
            let tableName = useOmsOrders ? 'oms_orders' : 'daily_order_summary';
            let selectFields = useOmsOrders ? `id,order_date,delivery_date,store_code,store_name,brand_name,item_code,item_name,qty,price,total_amount,center_name,distribution_center` : `delivery_date,total_qty,total_amount,brand_name,item_name,item_code`;
            let queryUrlBase = `${SUPABASE_URL}/rest/v1/${tableName}?delivery_date=gte.${startDate}&delivery_date=lte.${endDate}&select=${selectFields}`;

            if (brandName) queryUrlBase += `&brand_name=ilike.*${encodeURIComponent(brandName)}*`;
            if (searchStore) queryUrlBase += `&store_name=ilike.*${encodeURIComponent(searchStore)}*`;
            if (searchCenter) queryUrlBase += `&or=(center_name.ilike.*${encodeURIComponent(searchCenter)}*,distribution_center.ilike.*${encodeURIComponent(searchCenter)}*)`;
            if (searchItem) queryUrlBase += `&or=(item_code.ilike.*${encodeURIComponent(searchItem)}*,item_name.ilike.*${encodeURIComponent(searchItem)}*)`;

            try {
                let allRows = [], offset = 0, limit = 1000, hasMore = true;
                while (hasMore) {
                    const res = await fetch(`${queryUrlBase}&limit=${limit}&offset=${offset}`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                    if (res.ok) {
                        const chunk = await res.json();
                        if (!chunk || chunk.length === 0) break;
                        allRows = allRows.concat(chunk);
                        if (chunk.length < limit) hasMore = false; else offset += limit;
                    } else hasMore = false;
                }
                let totalQty = 0, totalAmount = 0; const items = new Set(), dailyMap = {};
                allRows.forEach(r => {
                    const q = parseFloat(r.total_qty || r.qty) || 0;
                    const amt = parseFloat(r.total_amount) || (q * (parseFloat(r.price) || 0));
                    totalQty += q; totalAmount += amt;
                    if (r.item_name) items.add(r.item_name);
                    const dKey = String(r.delivery_date || '').split('T')[0];
                    if (!dailyMap[dKey]) dailyMap[dKey] = { qty: 0, amount: 0 };
                    dailyMap[dKey].qty += q; dailyMap[dKey].amount += amt;
                });
                return {
                    status: "success", queryPeriod: `${startDate} ~ ${endDate}`, matchedItems: Array.from(items), totalQty, totalAmount,
                    dailyBreakdown: Object.keys(dailyMap).sort().map(d => ({ date: d, qty: dailyMap[d].qty, amount: dailyMap[d].amount }))
                };
            } catch (e) { return { status: "error", message: "DB 오류" }; }
        }

        // --- 상단 모달창 함수들 ---
        function openCalendarModal() { document.getElementById('calendar-modal').style.display = 'flex'; loadCalendarData(); }
        function closeCalendarModal() { document.getElementById('calendar-modal').style.display = 'none'; }
        async function loadCalendarData() {
            const monthVal = document.getElementById('calendar-month-picker').value;
            if (!monthVal) return;
            const [year, month] = monthVal.split('-').map(Number);
            const sStr = formatDate(new Date(year, month - 1, 1)), eStr = formatDate(new Date(year, month, 0));
            const grid = document.getElementById('calendar-grid'); grid.innerHTML = '<div style="grid-column: span 7; text-align:center; padding:20px; color:#2563eb;">⚡ 데이터 로딩 중...</div>';
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/daily_order_summary?delivery_date=gte.${sStr}&delivery_date=lte.${eStr}&select=delivery_date,total_qty`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                let dateQtyMap = {}, availableDates = [];
                if (res.ok) {
                    const rows = await res.json();
                    rows.forEach(r => {
                        let dKey = String(r.delivery_date).split('T')[0], q = parseFloat(r.total_qty) || 0;
                        dateQtyMap[dKey] = (dateQtyMap[dKey] || 0) + q; if (q > 0) availableDates.push(dKey);
                    });
                }
                if (availableDates.length > 0) {
                    availableDates.sort(); const latest = availableDates[availableDates.length - 1].replace(/-/g, '/');
                    document.getElementById('last-updated-text').innerText = `🕒 최신 배송일자: ${latest}`;
                }
                grid.innerHTML = "";
                ['일', '월', '화', '수', '목', '금', '토'].forEach(d => grid.innerHTML += `<div class="calendar-header-day">${d}</div>`);
                const fIdx = new Date(year, month - 1, 1).getDay(), total = new Date(year, month, 0).getDate();
                for (let i = 0; i < fIdx; i++) grid.innerHTML += `<div class="calendar-day-cell other-month"></div>`;
                for (let day = 1; day <= total; day++) {
                    const dStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`, q = dateQtyMap[dStr] || 0;
                    const badge = q > 0 ? `<span class="data-status-badge badge-has-data">${q.toLocaleString()}</span>` : `<span class="data-status-badge badge-no-data">0</span>`;
                    const cell = document.createElement('div'); cell.className = 'calendar-day-cell';
                    cell.onclick = () => { document.getElementById('chart-start-date').value = dStr; document.getElementById('chart-end-date').value = dStr; closeCalendarModal(); executeTabSearch(); };
                    cell.innerHTML = `<span class="day-number">${day}</span>${badge}`; grid.appendChild(cell);
                }
            } catch (e) {}
        }

        function openBrandModal() { document.getElementById('brand-modal').style.display = 'flex'; renderBrandModalList(); }
        function closeBrandModal() { document.getElementById('brand-modal').style.display = 'none'; }
        function renderBrandModalList() {
            const cur = document.getElementById('chart-brand-input').value.split(',').map(s => s.trim());
            const kw = document.getElementById('modal-brand-search').value.toLowerCase().trim();
            const listEl = document.getElementById('brand-modal-list');
            const filtered = allBrandList.filter(b => b.toLowerCase().includes(kw));
            listEl.innerHTML = filtered.map(b => `<div class="search-list-item"><label><input type="checkbox" class="brand-modal-chk" value="${b}" ${cur.includes(b)?'checked':''}><span>${b}</span></label></div>`).join('');
        }
        function filterBrandModalList() { renderBrandModalList(); }
        function toggleAllBrandCheck(status) { document.querySelectorAll('.brand-modal-chk').forEach(c => c.checked = status); }
        function applyBrandSelection() {
            const vals = Array.from(document.querySelectorAll('.brand-modal-chk:checked')).map(c => c.value).join(', ');
            document.getElementById('chart-brand-input').value = vals; toggleClearBtn('chart-brand-input'); closeBrandModal();

        /* 💡 품목 모달 (품목코드 기준 체크 유지 및 검색창 적용) */
        function openItemModal() { document.getElementById('item-modal').style.display = 'flex'; renderItemModalList(); }
        function closeItemModal() { document.getElementById('item-modal').style.display = 'none'; }
        function renderItemModalList() {
            // 현재 검색창에 있는 '품목코드'들을 기준으로 체크 상태 유지
            const currentSelected = document.getElementById('chart-item-input').value.split(',').map(s => s.trim());
            const kw = document.getElementById('modal-item-search').value.toLowerCase().trim();
            const listEl = document.getElementById('item-modal-list');
            const filtered = allItemList.filter(i => i.code.toLowerCase().includes(kw) || i.name.toLowerCase().includes(kw));
            
            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:15px;">검색 결과가 없습니다.</div>';
                return;
            }
            
            // 체크박스 value를 i.code로 세팅
            listEl.innerHTML = filtered.map(i => `
                <div class="search-list-item">
                    <label>
                        <input type="checkbox" class="item-modal-chk" value="${i.code}" ${currentSelected.includes(i.code) ? 'checked' : ''}>
                        <span><span style="font-family:monospace; color:#64748b;">[${i.code}]</span> <b>${i.name}</b></span>
                    </label>
                </div>
            `).join('');
        }
        function filterItemModalList() { renderItemModalList(); }
        function toggleAllItemCheck(status) { document.querySelectorAll('.item-modal-chk').forEach(c => c.checked = status); }
        function applyItemSelection() {
            // 체크된 항목들의 품목코드를 가져와서 쉼표로 연결
            const vals = Array.from(document.querySelectorAll('.item-modal-chk:checked')).map(c => c.value).join(', ');
            document.getElementById('chart-item-input').value = vals; 
            safeSetStorage('cached_item_input', vals);
            toggleClearBtn('chart-item-input'); 
            closeItemModal();
        }

        /* ⚡ 페이지 로드 시 초기화 */
        document.addEventListener('DOMContentLoaded', async () => {
            const today = new Date(), past7 = new Date(); past7.setDate(today.getDate() - 7);
            document.getElementById('chart-start-date').value = localStorage.getItem('cached_chart_start_date') || formatDate(past7);
            document.getElementById('chart-end-date').value = localStorage.getItem('cached_chart_end_date') || formatDate(today);
            document.getElementById('sync-target-date').value = formatDate(today);
            document.getElementById('chart-brand-input').value = localStorage.getItem('cached_brand_input') || '';
            document.getElementById('chart-item-input').value = localStorage.getItem('cached_item_input') || '';
            toggleClearBtn('chart-brand-input'); toggleClearBtn('chart-item-input');
            document.getElementById('calendar-month-picker').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, '0')}`;

            await loadMasterLists();
            loadCalendarData();
        });

        async function triggerBot() {
            const btn = document.getElementById('run-btn'), target = document.getElementById('sync-target-date').value.replace(/-/g, '/');
            if (!target) return alert("수동 동기화 일자를 선택하세요.");
            btn.disabled = true; btn.innerText = "🔄 동기화 중...";
            try {
                const res = await fetch(`https://api.github.com/repos/${githubId}/${repoName}/actions/workflows/capture.yml/dispatches`, {
                    method: 'POST', headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ ref: 'main', inputs: { start_date: target, end_date: target } })
                });
                if (res.ok) {
                    alert(`✅ [${target}] 동기화 요청 완료! 약 35초 후 데이터가 갱신됩니다.`);
                    setTimeout(() => { btn.disabled = false; btn.innerText = "🚀 OMS 수동 동기화"; executeTabSearch(); }, 35000);
                } else { alert("❌ 요청 실패"); btn.disabled = false; btn.innerText = "🚀 OMS 수동 동기화"; }
            } catch(e) { alert("❌ 네트워크 오류"); btn.disabled = false; btn.innerText = "🚀 OMS 수동 동기화"; }
        }
