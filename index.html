<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMS 주문 데이터 대시보드</title>
    <!-- Bootstrap 5 CSS (디자인 스킨) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-stat { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-container { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-responsive { max-height: 650px; overflow-y: auto; }
        thead th { position: sticky; top: 0; background-color: #212529 !important; color: white; z-index: 1; }
    </style>
</head>
<body>

<div class="container-fluid py-4 px-4">
    <!-- 상단 헤더 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold m-0">📦 OMS 주문 현황 대시보드</h3>
            <small class="text-muted" id="updateTime">최종 동기화 시각: 불러오는 중...</small>
        </div>
        <button class="btn btn-outline-primary btn-sm" onclick="fetchData()">🔄 데이터 새로고침</button>
    </div>

    <!-- 요약 통계 카드 -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card card-stat bg-primary text-white p-3">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 opacity-75">누적 총 주문 건수</h6>
                    <h3 class="card-title fw-bold m-0" id="totalRows">0 건</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-stat bg-success text-white p-3">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 opacity-75">데이터 소스 상태</h6>
                    <h3 class="card-title fw-bold m-0" id="dbStatus">GitHub DB (Parquet)</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-stat bg-dark text-white p-3">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 opacity-75">검색 필터 적용 항목</h6>
                    <h3 class="card-title fw-bold m-0" id="filteredRows">0 건 표시 중</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- 테이블 영역 -->
    <div class="table-container">
        <!-- 검색 및 데이터 건수 선택 -->
        <div class="row mb-3 align-items-center">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="주문번호, 품목명, 거래처명 검색..." onkeyup="filterData()">
            </div>
            <div class="col-md-6 text-end">
                <small class="text-muted" id="dataCountInfo">조회 중...</small>
            </div>
        </div>

        <!-- 데이터 테이블 -->
        <div class="table-responsive">
            <table class="table table-hover table-striped align-middle" id="dataTable">
                <thead>
                    <tr id="tableHeader">
                        <th>데이터를 불러오는 중입니다...</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td class="text-center py-5">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="mt-2 text-muted">GitHub DB에서 최신 데이터 수신 중...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 💡 실제 GitHub 저장소 경로에 맞게 URL을 수정해 주세요.
    const DATA_URL = "https://raw.githubusercontent.com/kshnpch-cmyk/dashboard/main/dashboard_data.json";

    let globalData = [];
    let globalColumns = [];

    // 1. JSON 데이터 수신 함수
    function fetchData() {
        document.getElementById("tableBody").innerHTML = `
            <tr>
                <td class="text-center py-5" colspan="100%">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">GitHub DB에서 최신 데이터 수신 중...</p>
                </td>
            </tr>`;

        fetch(DATA_URL + "?nocache=" + new Date().getTime()) // 캐시 방지 QueryParam
            .then(response => {
                if (!response.ok) throw new Error("네트워크 응답이 정상이 아닙니다.");
                return response.json();
            })
            .then(result => {
                globalData = result.data || [];
                globalColumns = result.columns || [];

                // 요약 카드 업데이트
                document.getElementById("updateTime").innerText = "최종 동기화 시각: " + (result.updated_at || "N/A");
                document.getElementById("totalRows").innerText = Number(result.total_rows || globalData.length).toLocaleString() + " 건";

                // 테이블 헤더 및 바디 렌더링
                renderTable(globalData, globalColumns);
            })
            .catch(error => {
                console.error("데이터 로드 실패:", error);
                document.getElementById("tableBody").innerHTML = `
                    <tr>
                        <td class="text-center text-danger py-5" colspan="100%">
                            ❌ 데이터를 불러오는 데 실패했습니다.<br>
                            <small class="text-muted">${error.message}</small>
                        </td>
                    </tr>`;
            });
    }

    // 2. 테이블 렌더링 함수
    function renderTable(data, columns) {
        const thead = document.getElementById("tableHeader");
        const tbody = document.getElementById("tableBody");

        if (!columns || columns.length === 0) {
            if (data.length > 0) columns = Object.keys(data[0]);
        }

        // 헤더 생성
        thead.innerHTML = columns.map(col => `<th>${col}</th>`).join("");

        // 바디 생성 (웹 성능을 위해 최대 상위 1,000건 우선 렌더링)
        const displayData = data.slice(0, 1000);
        tbody.innerHTML = displayData.map(row => {
            const cells = columns.map(col => `<td>${row[col] !== undefined ? row[col] : ''}</td>`).join("");
            return `<tr>${cells}</tr>`;
        }).join("");

        // 표시 상태 업데이트
        document.getElementById("filteredRows").innerText = Number(data.length).toLocaleString() + " 건 표시 중";
        document.getElementById("dataCountInfo").innerText = `전체 ${data.length.toLocaleString()}건 중 상위 ${displayData.length.toLocaleString()}건 출력 중`;
    }

    // 3. 실시간 검색 필터
    function filterData() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        const filtered = globalData.filter(row => {
            return Object.values(row).some(val => String(val).toLowerCase().includes(query));
        });
        renderTable(filtered, globalColumns);
    }

    // 페이지 로드 시 실행
    window.onload = fetchData;
</script>

</body>
</html>
