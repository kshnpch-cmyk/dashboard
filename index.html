<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더본 OMS 주문 실시간 대시보드</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>

        body {
            margin: 0; padding: 0;

        .brand-title h1 { margin: 0; font-size: 20px; font-weight: 700; }
        .version-tag {
            background-color: #10b981; color: white; font-size: 11px; font-weight: 800;
            padding: 3px 8px; border-radius: 12px; letter-spacing: 0.5px;
        }
        .control-panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .sync-date-group {
            display: flex; align-items: center; background-color: #1e293b;
            padding: 6px 12px; border-radius: 8px; gap: 8px; border: 1px solid #334155;
        }
        .sync-date-group label { font-size: 13px; color: #94a3b8; font-weight: 600; }
        .date-input {
            background-color: #0f172a; color: #ffffff; border: 1px solid #475569;
            padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; color-scheme: dark;
        }
        .last-updated-tag {
            font-size: 12px; color: #38bdf8; background-color: #1e293b;
            padding: 6px 12px; border-radius: 6px; border: 1px solid #0284c7; font-weight: bold;
            display: flex; align-items: center; gap: 8px;
        }
        .btn {
            background-color: #2563eb; color: white; border: none; padding: 8px 14px;
            border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn-query { background-color: #0284c7; }
        .btn-cal { background-color: #0f766e; padding: 4px 8px; font-size: 11px; border-radius: 4px; }
        .btn-excel { background-color: #16a34a; padding: 5px 10px; font-size: 12px; }
        .btn-search-icon {
            background-color: #475569; color: white; border: none; padding: 6px 9px;
            border-radius: 6px; cursor: pointer; font-size: 12px; margin-left: -2px;
        }
        .btn-search-icon:hover { background-color: #334155; }

        .container { padding: 20px; max-width: 98%; margin: 0 auto; }
        .section-panel {
            background: white; padding: 20px; border-radius: 12px;
            margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
        }

        .filter-row {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            background-color: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px;

        .filter-group { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #475569; }
        .input-box { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }

        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 15px; }
        .kpi-card { background: #f8fafc; padding: 15px 20px; border-radius: 8px; border-left: 5px solid #2563eb; }
        .kpi-card.green { border-left-color: #10b981; }

        .chart-container { position: relative; height: 260px; width: 100%; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;

        }
        .modal-content {

            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }

        .calendar-day-cell {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 4px; height: 48px; padding: 4px;
            display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;

        .data-status-badge { font-size: 9.5px; font-weight: bold; padding: 1px 3px; border-radius: 3px; text-align: center; }

        .search-list-item {

        .search-list-item label { cursor: pointer; width: 100%; display: flex; align-items: center; gap: 8px; }

        .dashboard-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .panel { background: white; padding: 20px; border-radius: 12px; }
        .panel-title {
            font-size: 18px; font-weight: 700; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;

        .summary-badge { background-color: #f1f5f9; padding: 4px 10px; border-radius: 6px; border: 1px solid #cbd5e1; color: #475569; }

        .store-item.total-item { background-color: #f8fafc; font-weight: 700; }

        .table-container { width: 100%; overflow-x: auto; max-height: 550px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }

<body>

    <div class="navbar">
        <div class="brand-title">

        </div>
        <div class="control-panel">

    <!-- 📅 캘린더 팝업 모달 -->

    <!-- 🔍 브랜드 선택 다중 체크 모달 -->

    <!-- 🔍 품목 검색 및 선택 모달 -->

            <div class="modal-header">

            <div class="modal-body-scroll" id="item-modal-list"></div>

    </div>

    <div class="container">
        
        <!-- 📊 상단 영역: 기간별 추이 차트 분석 -->
        <div class="section-panel">
            <div class="panel-header" style="margin-bottom: 0; border-bottom: none;">

            <div class="chart-container">

        <!-- 🛒 하단 영역: 하루 단위 상세 내역 -->

            <div class="filter-group">

        <div class="dashboard-layout">

            <div class="panel">
                <div class="panel-title">
                    <span id="selected-store-title">🛒 점포별 주문 상세</span>
                    <div class="summary-badge-group">
                        <button class="btn btn-excel" onclick="exportToExcel()">📥 엑셀 저장</button>
                        <span class="summary-badge">수량합계: <b id="list-total-qty">0</b>개</span>
                        <span class="summary-badge">금액합계: <b id="list-total-amount">0</b>원</span>
                    </div>
                </div>
                
                <div class="table-container">
                    <table id="detail-table">
                        <colgroup>
                            <col style="width: 90px;"><col style="width: 160px;"><col style="width: 100px;">
                            <col style="width: 100px;"><col style="width: 100px;"><col style="width: 200px;">
                            <col style="width: 70px;"><col style="width: 90px;"><col style="width: 110px;">
                        </colgroup>
                        <thead>
                            <tr>
                                <th>점포코드</th><th>점포명</th><th>주문일자</th><th>배송일자</th>
                                <th>품목코드</th><th>품목명</th><th class="text-right">수량</th>
                                <th class="text-right">단가</th><th class="text-right">금액</th>
                            </tr>
                            <tr class="filter-row-table">
                                <th><input type="text" id="filter-storeCode" class="table-filter-input" placeholder="검색" onkeyup="debouncedApplyColumnFilters()"></th>
                                <th><input type="text" id="filter-storeName" class="table-filter-input" placeholder="검색" onkeyup="debouncedApplyColumnFilters()"></th>
                                <th><input type="text" id="filter-orderDate" class="table-filter-input" placeholder="검색" onkeyup="debouncedApplyColumnFilters()"></th>

                                <th><input type="text" id="filter-itemName" class="table-filter-input" placeholder="검색" onkeyup="debouncedApplyColumnFilters()"></th>
                                <th></th><th></th><th></th>

    <script>
        const SUPABASE_URL = "https://zbilhsgfgyfrolveaego.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN"; 

        const githubId = 'kshnpch-cmyk'; 
        const repoName = 'dashboard'; 

        const tokenPart1 = "ghp_DPLQYilEaFD";
        const tokenPart2 = "g2jVxPlK8Kh18uwaCu220wnZB";
        const token = tokenPart1 + tokenPart2;

        let rawDetailOrders = [], filteredDetailOrders = [], baseDetailOrders = [], currentDetailOrders = [];
        let trendChart = null;

        let allBrandList = [];
        let allItemList = [];

        async function fetchWithRetry(url, options, retries = 2, backoff = 500) {
            try {
                const res = await fetch(url, options);
                if (!res.ok && res.status >= 500 && retries > 0) {
                    throw new Error(`Server Error ${res.status}`);
                }
                return res;
            } catch (err) {
                if (retries > 0) {
                    await new Promise(r => setTimeout(r, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                throw err;
            }
        }

        function debounce(func, delay = 150) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        }

        const debouncedApplyColumnFilters = debounce(applyColumnFilters, 150);
        const debouncedFilterStoreList = debounce(filterStoreList, 150);

        function formatDate(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr || dateStr === '-') return '-';
            let s = String(dateStr);
            if (s.includes('T')) s = s.split('T')[0];
            return s.replace(/-/g, '/');
        }

        function cleanNumber(val) {
            if (!val) return 0;
            return parseFloat(String(val).replace(/[^0-9.-]/g, '')) || 0;
        }

        function cleanCode(val) {
            if (!val && val !== 0) return '-';
            let str = String(val).trim();
            if (str.endsWith('.0')) {
                str = str.substring(0, str.length - 2);
            }
            return str || '-';
        }

        /* -------------------------------------------------------------
           🏢 브랜드 선택 다중 체크 모달
        ------------------------------------------------------------- */
        async function openBrandModal() {
            document.getElementById('brand-modal').style.display = 'flex';
            const listEl = document.getElementById('brand-modal-list');
            
            if (allBrandList.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; padding:15px; color:#2563eb;">⚡ 브랜드 목록 로드 중...</div>';
                try {
                    const res = await fetchWithRetry(`${SUPABASE_URL}/rest/v1/oms_orders?select=brand_name`, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        allBrandList = [...new Set(data.map(r => r.brand_name))].filter(Boolean).sort();
                        localStorage.setItem('cached_brands', JSON.stringify(allBrandList));
                    }
                } catch (err) {
                    console.error("브랜드 로드 오류:", err);
                }
            }
            renderBrandModalList();
        }

        function closeBrandModal() {
            document.getElementById('brand-modal').style.display = 'none';
        }

        function renderBrandModalList() {
            const currentSelected = document.getElementById('chart-brand-input').value.split(',').map(s => s.trim());
            const searchKeyword = document.getElementById('modal-brand-search').value.toLowerCase().trim();
            const listEl = document.getElementById('brand-modal-list');

            const filtered = allBrandList.filter(b => b.toLowerCase().includes(searchKeyword));
            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:15px;">검색 결과가 없습니다.</div>';
                return;
            }

            const html = filtered.map(brand => {
                const isChecked = currentSelected.includes(brand) ? 'checked' : '';
                return `
                    <div class="search-list-item">
                        <label>
                            <input type="checkbox" class="brand-modal-chk" value="${brand}" ${isChecked}>
                            <span>${brand}</span>
                        </label>
                    </div>
                `;
            }).join('');

            listEl.innerHTML = html;
        }

        function filterBrandModalList() {
            renderBrandModalList();
        }

        function toggleAllBrandCheck(status) {
            document.querySelectorAll('.brand-modal-chk').forEach(chk => chk.checked = status);
        }

        function applyBrandSelection() {
            const checkedVals = Array.from(document.querySelectorAll('.brand-modal-chk:checked')).map(c => c.value);
            const brandStr = checkedVals.join(', ');
            document.getElementById('chart-brand-input').value = brandStr;
            localStorage.setItem('cached_brand_input', brandStr);
            closeBrandModal();
        }

        /* -------------------------------------------------------------
           📦 품목 검색 선택 모달
        ------------------------------------------------------------- */
        async function openItemModal() {
            document.getElementById('item-modal').style.display = 'flex';
            const listEl = document.getElementById('item-modal-list');
            
            if (allItemList.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; padding:15px; color:#2563eb;">⚡ 품목 목록 로드 중...</div>';
                try {
                    const res = await fetchWithRetry(`${SUPABASE_URL}/rest/v1/oms_orders?select=item_code,item_name`, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const map = new Map();
                        data.forEach(r => {
                            if (r.item_code || r.item_name) {
                                map.set(`${cleanCode(r.item_code)}__${r.item_name}`, {
                                    code: cleanCode(r.item_code),
                                    name: r.item_name || ''
                                });
                            }
                        });
                        allItemList = Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
                        localStorage.setItem('cached_items', JSON.stringify(allItemList));
                    }
                } catch (err) {
                    console.error("품목 로드 오류:", err);
                }
            }
            renderItemModalList();
        }

        function closeItemModal() {
            document.getElementById('item-modal').style.display = 'none';
        }

        function renderItemModalList() {
            const searchKeyword = document.getElementById('modal-item-search').value.toLowerCase().trim();
            const listEl = document.getElementById('item-modal-list');

            const filtered = allItemList.filter(item => 
                item.code.toLowerCase().includes(searchKeyword) || 
                item.name.toLowerCase().includes(searchKeyword)
            );

            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:15px;">검색 결과가 없습니다.</div>';
                return;
            }

            const html = filtered.slice(0, 100).map(item => `
                <div class="search-list-item" onclick="selectItemFromModal('${item.name}')">
                    <div>
                        <span class="code-tag">[${item.code}]</span>
                        <b style="margin-left: 5px;">${item.name}</b>
                    </div>
                    <button class="btn btn-cal" style="background:#2563eb;">선택</button>
                </div>
            `).join('');

            listEl.innerHTML = html;
        }

        function filterItemModalList() {
            renderItemModalList();
        }

        function selectItemFromModal(itemName) {
            document.getElementById('chart-item-input').value = itemName;
            localStorage.setItem('cached_item_input', itemName);
            closeItemModal();
        }

        /* -------------------------------------------------------------
           📅 캘린더 모달
        ------------------------------------------------------------- */
        function openCalendarModal() {
            document.getElementById('calendar-modal').style.display = 'flex';
            loadCalendarData();
        }

        function closeCalendarModal() {
            document.getElementById('calendar-modal').style.display = 'none';
        }

        async function loadCalendarData() {
            const monthVal = document.getElementById('calendar-month-picker').value;
            if (!monthVal) return;

            const [year, month] = monthVal.split('-').map(Number);
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);

            const startDateStr = formatDate(firstDay);
            const endDateStr = formatDate(lastDay);

            const queryUrl = `${SUPABASE_URL}/rest/v1/oms_orders?delivery_date=gte.${startDateStr}&delivery_date=lte.${endDateStr}&select=delivery_date`;

            let dateCountMap = {};
            let availableDates = [];

            try {
                const res = await fetchWithRetry(queryUrl, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                if (res.ok) {
                    const rows = await res.json();
                    rows.forEach(r => {
                        let dKey = formatDisplayDate(r.delivery_date).replace(/\//g, '-');
                        dateCountMap[dKey] = (dateCountMap[dKey] || 0) + 1;
                        availableDates.push(dKey);
                    });
                }
            } catch (err) {
                console.error("캘린더 로드 오류:", err);
            }

            if (availableDates.length > 0) {
                availableDates.sort();
                const latestDate = availableDates[availableDates.length - 1].replace(/-/g, '/');
                document.getElementById('last-updated-text').innerText = `🕒 최신 배송일자: ${latestDate}`;
                localStorage.setItem('cached_last_updated', latestDate);
            } else {
                document.getElementById('last-updated-text').innerText = `🕒 최신 배송일자: 데이터 없음`;
            }

            renderCalendarGrid(year, month, dateCountMap);
        }

        function renderCalendarGrid(year, month, dateCountMap) {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = "";

            const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];
            daysOfWeek.forEach(d => {
                grid.innerHTML += `<div class="calendar-header-day">${d}</div>`;
            });

            const firstDayIndex = new Date(year, month - 1, 1).getDay();
            const totalDays = new Date(year, month, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div class="calendar-day-cell other-month"></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const dString = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const count = dateCountMap[dString] || 0;

                let badgeHtml = count > 0 
                    ? `<span class="data-status-badge badge-has-data">🟢 있음</span>`
                    : `<span class="data-status-badge badge-no-data">⚪ 없음</span>`;

                const cell = document.createElement('div');
                cell.className = 'calendar-day-cell';
                cell.onclick = () => selectDateFromCalendar(dString);
                cell.innerHTML = `
                    <span class="day-number">${day}</span>
                    ${badgeHtml}
                `;
                grid.appendChild(cell);
            }
        }

        function selectDateFromCalendar(dateStr) {
            document.getElementById('detail-target-date').value = dateStr;
            localStorage.setItem('cached_detail_target_date', dateStr);
            closeCalendarModal();
            fetchDetailData();
        }

        /* -------------------------------------------------------------
           📊 추이 그래프 데이터 안전 조회 & 로컬 저장
        ------------------------------------------------------------- */
        async function fetchChartData() {
            const startDate = document.getElementById('chart-start-date').value;
            const endDate = document.getElementById('chart-end-date').value;
            const brandInputValue = document.getElementById('chart-brand-input').value.trim();
            const itemKeyword = document.getElementById('chart-item-input').value.trim();

            if (!startDate || !endDate) return alert("시작일과 종료일을 선택하세요.");

            // 입력 조건 저장
            localStorage.setItem('cached_chart_start_date', startDate);
            localStorage.setItem('cached_chart_end_date', endDate);
            localStorage.setItem('cached_brand_input', brandInputValue);
            localStorage.setItem('cached_item_input', itemKeyword);

            let queryUrl = `${SUPABASE_URL}/rest/v1/oms_orders?delivery_date=gte.${startDate}&delivery_date=lte.${endDate}&select=delivery_date,order_date,qty,price,total_amount,brand_name,item_code,item_name`;

            if (brandInputValue) {
                const brandList = brandInputValue.split(',').map(b => b.trim()).filter(Boolean);
                if (brandList.length === 1) {
                    queryUrl += `&brand_name=ilike.*${encodeURIComponent(brandList[0])}*`;
                } else if (brandList.length > 1) {
                    const brandQueryStr = brandList.map(b => `brand_name.ilike.*${encodeURIComponent(b)}*`).join(',');
                    queryUrl += `&or=(${brandQueryStr})`;
                }
            }

            if (itemKeyword) {
                queryUrl += `&or=(item_code.ilike.*${encodeURIComponent(itemKeyword)}*,item_name.ilike.*${encodeURIComponent(itemKeyword)}*)`;
            }

            try {
                const res = await fetchWithRetry(queryUrl, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                if (!res.ok) throw new Error(`API 응답 실패 (${res.status})`);
                const data = await res.json();

                if (Array.isArray(data) && data.length > 0) {
                    localStorage.setItem('cached_chart_data', JSON.stringify(data));
                    renderChartAndKPI(data);
                }
            } catch (err) {
                console.warn("⚠️ 간헐적 DB 지연으로 캐시 데이터를 유지합니다:", err.message);
            }
        }

        function renderChartAndKPI(data) {
            if (!data || !Array.isArray(data) || data.length === 0) return;

            let totalQty = 0, totalAmount = 0;
            const uniqueItems = new Set();
            const dailyMap = {};

            data.forEach(r => {
                const q = cleanNumber(r.qty);
                const p = cleanNumber(r.price);
                const amt = cleanNumber(r.total_amount) || (q * p);

                totalQty += q;
                totalAmount += amt;
                if (r.item_name) uniqueItems.add(r.item_name);

                let dateKey = formatDisplayDate(r.delivery_date) || formatDisplayDate(r.order_date);
                if (!dateKey || dateKey === '-') return;

                if (!dailyMap[dateKey]) dailyMap[dateKey] = { qty: 0, amount: 0 };
                dailyMap[dateKey].qty += q;
                dailyMap[dateKey].amount += amt;
            });

            document.getElementById('kpi-total-qty').innerText = `${totalQty.toLocaleString()} 건`;
            document.getElementById('kpi-total-items').innerText = `${uniqueItems.size.toLocaleString()} 종`;
            document.getElementById('kpi-total-amount').innerText = `${totalAmount.toLocaleString()} 원`;

            const labels = Object.keys(dailyMap).sort();
            const qtyData = labels.map(k => dailyMap[k].qty);
            const amtData = labels.map(k => dailyMap[k].amount);

            const ctx = document.getElementById('dailyTrendChart').getContext('2d');
            if (trendChart) trendChart.destroy();

            trendChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '주문수량', data: qtyData, backgroundColor: 'rgba(37, 99, 235, 0.6)', yAxisID: 'y1' },
                        { label: '주문금액', data: amtData, type: 'line', borderColor: '#8b5cf6', yAxisID: 'y2' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y1: { type: 'linear', position: 'left', beginAtZero: true },
                        y2: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false } }
                    }
                }
            });
        }

        /* -------------------------------------------------------------
           🛒 하루치 상세 내역 안전 조회 & 로컬 저장
        ------------------------------------------------------------- */
        async function fetchDetailData() {
            const targetDate = document.getElementById('detail-target-date').value;
            if (!targetDate) return;

            localStorage.setItem('cached_detail_target_date', targetDate);

            let queryUrl = `${SUPABASE_URL}/rest/v1/oms_orders?delivery_date=eq.${targetDate}&select=store_code,store_name,order_date,delivery_date,item_code,item_name,qty,price,total_amount,brand_name&order=store_name.asc`;

            try {
                const res = await fetchWithRetry(queryUrl, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                if (!res.ok) throw new Error("API 응답 실패");
                
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    rawDetailOrders = data;
                    localStorage.setItem('cached_detail_orders', JSON.stringify(rawDetailOrders));
                    processDetailData();
                }
            } catch (err) {
                console.error("상세 데이터 로드 실패:", err);
            }
        }

        function processDetailData() {
            filteredDetailOrders = rawDetailOrders;

            const brandSelect = document.getElementById('brand-select');
            const brands = [...new Set(filteredDetailOrders.map(r => r.brand_name))].filter(Boolean);
            brandSelect.innerHTML = '<option value="ALL">🌐 전체 브랜드</option>';
            brands.forEach(b => brandSelect.innerHTML += `<option value="${b}">${b}</option>`);

            onBrandChange();
        }

        function onBrandChange() {
            const selectedBrand = document.getElementById('brand-select').value;
            let brandOrders = (selectedBrand === 'ALL' || !selectedBrand) ? filteredDetailOrders : filteredDetailOrders.filter(r => r.brand_name === selectedBrand);

            const stores = [...new Set(brandOrders.map(r => r.store_name))].filter(Boolean);
            document.getElementById('brand-store-count').innerText = stores.length;
            document.getElementById('brand-item-count').innerText = new Set(brandOrders.map(r => r.item_name)).size;

            const storeListEl = document.getElementById('store-list');
            let listItemsHtml = [`<li class="store-item total-item active" onclick="onStoreSelect('ALL', '${selectedBrand}', this)">
                <span>🏢 전체 점포 합산</span><span style="color:#2563eb;">${brandOrders.length}건</span>
            </li>`];

            for (let i = 0; i < stores.length; i++) {
                const store = stores[i];
                const count = brandOrders.filter(r => r.store_name === store).length;
                listItemsHtml.push(`<li class="store-item" onclick="onStoreSelect('${store}', '${selectedBrand}', this)">
                    <span>${store}</span><span style="color:#64748b;">${count}건</span>
                </li>`);
            }
            storeListEl.innerHTML = listItemsHtml.join('');
            onStoreSelect('ALL', selectedBrand, storeListEl.firstElementChild);
        }

        function filterStoreList() {
            const query = document.getElementById('store-search-input').value.toLowerCase();
            document.querySelectorAll('#store-list .store-item').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        }

        function onStoreSelect(storeName, brandName, element) {
            document.querySelectorAll('.store-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            if (storeName === 'ALL') {
                document.getElementById('selected-store-title').innerText = `🛒 전체 점포 합산 상세`;
                baseDetailOrders = (brandName === 'ALL' || !brandName) ? filteredDetailOrders : filteredDetailOrders.filter(r => r.brand_name === brandName);
            } else {
                document.getElementById('selected-store-title').innerText = `🛒 [${storeName}] 주문 상세`;
                baseDetailOrders = filteredDetailOrders.filter(r => r.store_name === storeName);
            }
            applyColumnFilters();
        }

        function applyColumnFilters() {
            const qSC = document.getElementById('filter-storeCode').value.toLowerCase().trim();
            const qSN = document.getElementById('filter-storeName').value.toLowerCase().trim();
            const qOD = document.getElementById('filter-orderDate').value.toLowerCase().trim();
            const qDD = document.getElementById('filter-deliveryDate').value.toLowerCase().trim();
            const qIC = document.getElementById('filter-itemCode').value.toLowerCase().trim();
            const qIN = document.getElementById('filter-itemName').value.toLowerCase().trim();

            currentDetailOrders = baseDetailOrders.filter(row => {
                if (qSC && !cleanCode(row.store_code).toLowerCase().includes(qSC)) return false;
                if (qSN && !String(row.store_name||'').toLowerCase().includes(qSN)) return false;
                if (qOD && !formatDisplayDate(row.order_date).toLowerCase().includes(qOD)) return false;
                if (qDD && !formatDisplayDate(row.delivery_date).toLowerCase().includes(qDD)) return false;
                if (qIC && !cleanCode(row.item_code).toLowerCase().includes(qIC)) return false;
                if (qIN && !String(row.item_name||'').toLowerCase().includes(qIN)) return false;
                return true;
            });

            renderDetailTable();
        }

        function renderDetailTable() {
            const tbody = document.getElementById('order-detail-table');

            if (!currentDetailOrders || currentDetailOrders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:30px; color:#94a3b8;">데이터가 없습니다.</td></tr>`;
                document.getElementById('list-total-qty').innerText = "0";
                document.getElementById('list-total-amount').innerText = "0";
                return;
            }

            let sumQty = 0, sumAmount = 0;
            const rowsHtml = [];

            for (let i = 0; i < currentDetailOrders.length; i++) {
                const row = currentDetailOrders[i];
                const q = cleanNumber(row.qty);
                const p = cleanNumber(row.price);
                let t = cleanNumber(row.total_amount) || (q * p);
                sumQty += q; sumAmount += t;

                rowsHtml.push(`
                    <tr>
                        <td><span class="code-tag">${cleanCode(row.store_code)}</span></td>
                        <td><b>${row.store_name||'-'}</b></td>
                        <td>${formatDisplayDate(row.order_date)}</td>
                        <td><span style="color:#2563eb; font-weight:bold;">${formatDisplayDate(row.delivery_date)}</span></td>
                        <td><span class="code-tag">${cleanCode(row.item_code)}</span></td>
                        <td>${row.item_name||'-'}</td>
                        <td class="text-right">${q.toLocaleString()}</td>
                        <td class="text-right">${p > 0 ? p.toLocaleString() + '원' : '-'}</td>
                        <td class="text-right"><b>${t > 0 ? t.toLocaleString() + '원' : '-'}</b></td>
                    </tr>
                `);
            }

            tbody.innerHTML = rowsHtml.join('');
            document.getElementById('list-total-qty').innerText = sumQty.toLocaleString();
            document.getElementById('list-total-amount').innerText = sumAmount.toLocaleString();
        }

        function exportToExcel() {
            if (!currentDetailOrders || currentDetailOrders.length === 0) return alert("저장할 데이터가 없습니다.");
            const exportData = currentDetailOrders.map(row => ({
                '점포코드': cleanCode(row.store_code), 
                '점포명': row.store_name || '-',
                '주문일자': formatDisplayDate(row.order_date), 
                '배송일자': formatDisplayDate(row.delivery_date),
                '품목코드': cleanCode(row.item_code), 
                '품목명': row.item_name || '-',
                '수량': cleanNumber(row.qty), 
                '단가': cleanNumber(row.price),
                '금액': cleanNumber(row.total_amount) || (cleanNumber(row.qty) * cleanNumber(row.price))
            }));
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "주문상세");
            XLSX.writeFile(wb, `OMS주문상세_${document.getElementById('detail-target-date').value}.xlsx`);
        }

        /* -------------------------------------------------------------
           ⚡ 초기 로드 및 캐시 완벽 복원 (로컬스토리지 보완)
        ------------------------------------------------------------- */
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const past7 = new Date(); past7.setDate(today.getDate() - 7);

            // 날짜 및 검색 조건 캐시 복원
            document.getElementById('chart-start-date').value = localStorage.getItem('cached_chart_start_date') || formatDate(past7);
            document.getElementById('chart-end-date').value = localStorage.getItem('cached_chart_end_date') || formatDate(today);
            document.getElementById('sync-target-date').value = formatDate(today);
            document.getElementById('detail-target-date').value = localStorage.getItem('cached_detail_target_date') || formatDate(today);
            
            document.getElementById('chart-brand-input').value = localStorage.getItem('cached_brand_input') || '';
            document.getElementById('chart-item-input').value = localStorage.getItem('cached_item_input') || '';

            const mStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, '0')}`;
            document.getElementById('calendar-month-picker').value = mStr;

            // ⚡ 1. 로컬 저장소 데이터 안전 복원
            const cachedLastUpdated = localStorage.getItem('cached_last_updated');
            if (cachedLastUpdated) {
                document.getElementById('last-updated-text').innerText = `🕒 최신 배송일자: ${cachedLastUpdated}`;
            }

            try {
                const cachedBrands = localStorage.getItem('cached_brands');
                if (cachedBrands) allBrandList = JSON.parse(cachedBrands);

                const cachedItems = localStorage.getItem('cached_items');
                if (cachedItems) allItemList = JSON.parse(cachedItems);

                const cachedChartData = localStorage.getItem('cached_chart_data');
                if (cachedChartData) {
                    const data = JSON.parse(cachedChartData);
                    if (Array.isArray(data) && data.length > 0) renderChartAndKPI(data);
                }

                const cachedDetailOrders = localStorage.getItem('cached_detail_orders');
                if (cachedDetailOrders) {
                    const data = JSON.parse(cachedDetailOrders);
                    if (Array.isArray(data) && data.length > 0) {
                        rawDetailOrders = data;
                        processDetailData();
                    }
                }
            } catch (e) {
                console.warn("캐시 데이터 복원 중 예외 처리:", e);
            }

            // ⚡ 2. 백그라운드 최신 서버 데이터 동기화
            loadCalendarData();
            fetchChartData();
            fetchDetailData();
        });

        async function triggerBot() {
            const btn = document.getElementById('run-btn');
            const targetDateVal = document.getElementById('sync-target-date').value.replace(/-/g, '/');

            if (!targetDateVal) return alert("수동 동기화할 일자를 선택하세요.");

            btn.disabled = true; 
            btn.innerText = "🔄 동기화 중...";

            try {
                const res = await fetch(`https://api.github.com/repos/${githubId}/${repoName}/actions/workflows/capture.yml/dispatches`, {
                    method: 'POST',
                    headers: { 
                        'Accept': 'application/vnd.github.v3+json', 
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ 
                        ref: 'main', 
                        inputs: { 
                            start_date: targetDateVal, 
                            end_date: targetDateVal 
                        } 
                    })
                });

                if (res.ok) {
                    alert(`✅ [${targetDateVal}] OMS 데이터 동기화 요청 완료! (약 30~40초 후 완료)`);
                    setTimeout(() => { 
                        btn.disabled = false; 
                        btn.innerText = "🚀 OMS 수동 동기화"; 
                        loadCalendarData();
                        fetchDetailData(); 
                    }, 35000);
                } else {
                    alert("❌ 수동 동기화 요청 실패 - GitHub 토큰을 확인해 주세요."); 
                    btn.disabled = false; 
                    btn.innerText = "🚀 OMS 수동 동기화";
                }
            } catch (err) {
                alert("❌ 요청 중 네트워크 오류가 발생했습니다.");
                btn.disabled = false;
                btn.innerText = "🚀 OMS 수동 동기화";
            }
        }
    </script>
