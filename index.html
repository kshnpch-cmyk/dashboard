<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 데이터 동기화 대시보드</title>
    <style>
        body { 
            text-align: center; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 30px; 
            font-family: 'Malgun Gothic', sans-serif; 
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        h1 { color: #1e293b; margin-bottom: 25px; }
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background-color: #10b981;
            color: white;
            font-weight: bold;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .btn-group { margin: 20px 0; }
        .sheet-btn {
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 8px;
            display: inline-block;
            transition: background 0.2s;
        }
        .sheet-btn:hover { background-color: #0369a1; }
        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 더본 OMS 주문 데이터 자동 동기화</h1>
        <div class="status-badge">🔄 10분 주기 자동 동기화 가동 중</div>
        
        <div class="btn-group">
            <a href="https://docs.google.com/spreadsheets/d/1E_FwM6qIiv-vmFGdpGTR9zHWPgyudNG9UY8Jo8LCGPM/edit" target="_blank" class="sheet-btn">
                📊 구글 스프레드시트 바로가기
            </a>
        </div>

        <!-- 구글 시트 웹 뷰 임베드 -->
        <iframe src="https://docs.google.com/spreadsheets/d/1E_FwM6qIiv-vmFGdpGTR9zHWPgyudNG9UY8Jo8LCGPM/htmlembed?widget=true&amp;headers=false"></iframe>
    </div>
</body>
</html>
