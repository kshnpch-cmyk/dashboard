<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더본 OMS 주문 현황 대시보드</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .navbar {
            background-color: #0f172a;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex-wrap: wrap;
            gap: 15px;
        }
        .navbar h1 { margin: 0; font-size: 20px; font-weight: 700; }
        .control-panel {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .date-picker-group {
            display: flex;
            align-items: center;
            background-color: #1e293b;
            padding: 6px 12px;
            border-radius: 8px;
            gap: 8px;
            border: 1px solid #334155;
        }
        .date-picker-group label {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
        }
        .date-input {
            background-color: #0f172a;
            color: white;
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
        }
        .last-updated-tag {
            font-size: 12px;
            color: #38bdf8;
            background-color: #1e293b;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #0284c7;
            font-weight: bold;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn-query { background-color: #0284c7; }
        .btn-query:hover { background-color: #0369a1; }
        .btn-reset { background-color: #475569; }
        .btn-reset:hover { background-color: #334155; }
        .btn-save-width { background-color: #10b981; padding: 5px 10px; font-size: 12px; }
        .btn-save-width:hover { background-color: #059669; }
        .btn-reset-width { background-color: #64748b; padding: 5px 10px; font-size: 12px; }
        .btn-reset-width:hover { background-color: #475569; }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .container { padding: 20px; max-width: 98%; margin: 0 auto; }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .kpi-card {
            background: white;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 5px solid #2563eb;
        }
        .kpi-card.green { border-left-color: #10b981; }
        .kpi-card.purple { border-left-color: #8b5cf6; }
        .kpi-title { font-size: 14px; color: #64748b; font-weight: 600; }
        .kpi-value { font-size: 26px; font-weight: 800; margin-top: 6px; color: #0f172a; }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }
        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .panel-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .summary-badge-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .summary-badge {
            background-color: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            color: #475569;
        }
        .summary-badge b { color: #2563eb; }

        .select-box, .search-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .store-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 540px;
            overflow-y: auto;
        }
        .store-item {
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            font-size: 14px;
        }
        .store-item:hover, .store-item.active {
            background-color: #eff6ff;
            border-color: #2563eb;
            font-weight: bold;
        }
        .store-item.total-item {
            background-color: #f8fafc;
            border-color: #94a3b8;
            font-weight: 700;
        }
        .store-item.total-item.active {
            background-color: #dbeafe;
            border-color: #2563eb;
        }
        
        .table-container { width: 100%; overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        th { 
            background-color: #f8fafc; 
            color: #475569; 
            font-size: 13px; 
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        th:hover { background-color: #e2e8f0; }
        .resizer {
            position: absolute;
            right: 0; top: 0;
            height: 100%; width: 6px;
            background: transparent;
            cursor: col-resize;
            user-select: none;
        }
        .resizer:hover, .resizing { background-color: #2563eb; }
        .filter-row th {
            background-color: #ffffff;
            padding: 6px 8px;
            cursor: default;
        }
        .table-filter-input {
            width: 100%;
            padding: 6px 8px;
            font-size: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #f8fafc;
            box-sizing: border-box;
        }
        .table-filter-input:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            outline: none;
        }
        td { font-size: 13.5px; }
        .text-right { text-align: right; }
        .sort-icon { font-size: 11px; margin-left: 4px; color: #2563eb; }
        .code-tag {
            font-size: 12px;
            color: #64748b;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>📦 더본 OMS 주문 실시간 대시보드</h1>
        <div class="control-panel">
            <div class="last-updated-tag" id="last-updated-text">
                🕒 동기화: 확인 중...
            </div>
            <div class="date-picker-group">
                <label>조회 기간:</label>
                <input type="date" id="start-date" class="date-input" onchange="onDateFilterChange()">
                <span style="color:#94a3b8;">~</span>
                <input type="date" id="end-date" class="date-input" onchange="onDateFilterChange()">
            </div>
            <button class="btn btn-query" onclick="fetchSheetData(true)">
                🔍 시트 데이터 조회
            </button>
            <button class="btn btn-reset" onclick="resetToTomorrow()">
                🔄 내일 기준 초기화
            </button>
            <button id="run-btn" class="btn" onclick="triggerBot()">
                🚀 해당 기간 OMS 동기화
            </button>
        </div>
    </div>

    <div class="container">
        <!-- 요약 KPI -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-title">전체 총 주문수량</div>
                <div class="kpi-value" id="total-qty">0 건</div>
            </div>
            <div class="kpi-card green">
                <div class="kpi-title">전체 취급 품목수</div>
                <div class="kpi-value" id="total-items">0 종</div>
            </div>
            <div class="kpi-card purple">
                <div class="kpi-title">전체 총 주문금액</div>
                <div class="kpi-value" id="total-amount">0 원</div>
            </div>
        </div>

        <div class="dashboard-layout">
            <div class="panel">
                <div class="panel-title">
                    <span>🏢 브랜드별 점포 목록</span>
                </div>
                
                <select id="brand-select" class="select-box" onchange="onBrandChange()">
                    <option value="ALL">🌐 전체 브랜드</option>
                </select>

                <input type="text" id="store-search-input" class="search-input" placeholder="🔍 점포명/코드 검색..." onkeyup="filterStoreList()">

                <div id="brand-summary" style="margin-bottom: 12px; font-size: 13px; color: #64748b;">
                    점포수: <b id="brand-store-count">0</b>개 | 품목수: <b id="brand-item-count">0</b>종
                </div>

                <ul class="store-list" id="store-list">
                    <li style="color: #94a3b8; text-align: center; padding: 20px;">데이터를 불러오는 중입니다...</li>
                </ul>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <span id="selected-store-title">🛒 점포별 주문 상세</span>
                    <div class="summary-badge-group">
                        <button class="btn btn-save-width" onclick="saveColumnWidths()">💾 열 너비 저장</button>
                        <button class="btn btn-reset-width" onclick="resetColumnWidths()">🔄 너비 초기화</button>
                        <span class="summary-badge">수량합계: <b id="list-total-qty">0</b>개</span>
                        <span class="summary-badge">금액합계: <b id="list-total-amount">0</b>원</span>
                    </div>
                </div>
                
                <div class="table-container">
                    <table id="detail-table">
                        <colgroup>
                            <col id="col-0" style="width: 100px;">
                            <col id="col-1" style="width: 180px;">
                            <col id="col-2" style="width: 110px;">
                            <col id="col-3" style="width: 110px;">
                            <col id="col-4" style="width: 120px;">
                            <col id="col-5" style="width: 250px;">
                            <col id="col-6" style="width: 80px;">
                            <col id="col-7" style="width: 100px;">
                            <col id="col-8" style="width: 120px;">
                        </colgroup>
                        <thead>
                            <tr>
                                <th onclick="sortTable('storeCode')">점포코드<span id="sort-storeCode" class="sort-icon"></span><div class="resizer"></div></th>
                                <th onclick="sortTable('storeName')">점포명<span id="sort-storeName" class="sort-icon"></span><div class="resizer"></div></th>
                                <th onclick="sortTable('orderDate')">주문일자<span id="sort-orderDate" class="sort-icon"></span><div class="resizer"></div></th>
                                <th onclick="sortTable('deliveryDate')">배송일자<span id="sort-deliveryDate" class="sort-icon"></span><div class="resizer"></div></th>
                                <th onclick="sortTable('itemCode')">품목코드<span id="sort-itemCode" class="sort-icon"></span><div class="resizer"></div></th>
                                <th onclick="sortTable('itemName')">품목명<span id="sort-itemName" class="sort-icon"></span><div class="resizer"></div></th>
                                <th class="text-right" onclick="sortTable('qty')">수량<span id="sort-qty" class="sort-icon"></span><div class="resizer"></div></th>
                                <th class="text-right" onclick="sortTable('price')">단가<span id="sort-price" class="sort-icon"></span><div class="resizer"></div></th>
                                <th class="text-right" onclick="sortTable('total')">금액<span id="sort-total" class="sort-icon"></span><div class="resizer"></div></th>
                            </tr>
                            <tr class="filter-row">
                                <th><input type="text" id="filter-storeCode" class="table-filter-input" placeholder="🔍 검색" onkeyup="applyColumnFilters()"></th>
                                <th><input type="text" id="filter-storeName" class="table-filter-input" placeholder="🔍 검색" onkeyup="applyColumnFilters()"></th>
                                <th><input type="text" id="filter-orderDate" class="table-filter-input" placeholder="🔍 검색" onkeyup="applyColumnFilters()"></th>
                                <th><input type="text" id="filter-deliveryDate" class="table-filter-input" placeholder="🔍 검색" onkeyup="applyColumnFilters()"></th>
                                <th><input type="text" id="filter-itemCode" class="table-filter-input" placeholder="🔍 검색" onkeyup="applyColumnFilters()"></th>
                                <th><input type="text" id="filter-itemName" class="table-filter-input" placeholder="🔍 검색" onkeyup="applyColumnFilters()"></th>
                                <th></th>
                                <th></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="order-detail-table">
                            <tr>
                                <td colspan="9" style="text-align: center; color: #94a3b8; padding: 40px;">
                                    데이터를 불러오는 중입니다...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const githubId = 'kshnpch-cmyk'; 
        const repoName = 'dashboard'; 
        const token = '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'; 
        const webhookUrl = "https://script.google.com/macros/s/AKfycbxqFDL26lqaQqzAEw7VCOp1t9oSZLNOEXyUuTPJa9DnLzqc9RNPIFk-88n4YLD0oChR/exec";

        let colOrderDate    = 3;  
        let colDeliveryDate = 5;  
        let colStoreCode    = 6;  
        let colStoreName    = 7;  
        let colBrandName    = 8;  
        let colItemCode     = 15; 
        let colItemName     = 16; 
        let colQty          = 24; 
        let colPrice        = 25; 
        let colTotal        = 26; 

        let allOrders = []; 
        let filteredOrders = []; 
        let baseDetailOrders = [];   
        let currentDetailOrders = [];
        let isShowAlert = false;

        let currentSortKey = '';
        let currentSortAsc = true;

        const DEFAULT_WIDTHS = ['100px', '180px', '110px', '110px', '120px', '250px', '80px', '100px', '120px'];

        loadSavedColumnWidths();
        resetToTomorrow();
        fetchSheetData();

        function formatDate(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function resetToTomorrow() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tomorrowStr = formatDate(tomorrow);

            document.getElementById('start-date').value = tomorrowStr;
            document.getElementById('end-date').value = tomorrowStr;
            
            processData();
        }

        function onDateFilterChange() {
            processData();
        }

        function fetchSheetData(showAlert = false) {
            isShowAlert = showAlert;
            const oldScript = document.getElementById('jsonp-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonp-script';
            script.src = `${webhookUrl}?callback=handleSheetResponse&_=${new Date().getTime()}`;
            document.body.appendChild(script);
        }

        function detectColumnIndexes(headerRow) {
            if (!headerRow) return;
            for (let i = 0; i < headerRow.length; i++) {
                const title = String(headerRow[i]).trim();
                if (title === "주문일자") colOrderDate = i;
                else if (title === "배송일자") colDeliveryDate = i;
                else if (title === "거래처코드" || title === "점포코드") colStoreCode = i;
                else if (title === "거래처명" || title === "점포명") colStoreName = i;
                else if (title === "브랜드명") colBrandName = i;
                else if (title === "품목코드") colItemCode = i;
                else if (title === "품목명") colItemName = i;
                else if (title === "수량" || title === "주문수량") colQty = i;
                else if (title === "단가" || title === "공급단가") colPrice = i;
                else if (title === "합계" || title === "주문금액" || title === "공급가액") colTotal = i;
            }
        }

        // 💡 배열 수신 및 객체 수신 모두 완벽 지원하도록 파서 보완
        function handleSheetResponse(res) {
            let data = [];
            if (Array.isArray(res)) {
                data = res;
            } else if (res && res.data) {
                data = res.data;
                if (res.lastUpdated) {
                    document.getElementById('last-updated-text').innerText = `🕒 동기화: ${res.lastUpdated}`;
                }
            }

            if (Array.isArray(data) && data.length > 0) {
                detectColumnIndexes(data[0]); 
                allOrders = data;
                processData();
                if (isShowAlert) alert("✅ 구글 시트 데이터를 성공적으로 불러왔습니다!");
            } else {
                if (isShowAlert) alert("⚠️ 시트에 데이터가 존재하지 않습니다.");
            }
        }

        function cleanDateNum(dateStr) {
            if (!dateStr) return 0;
            return parseInt(String(dateStr).replace(/[^0-9]/g, ''), 10) || 0;
        }

        function cleanNumber(val) {
            if (!val) return 0;
            return parseFloat(String(val).replace(/[^0-9.-]/g, '')) || 0;
        }

        function processData() {
            if (!allOrders || allOrders.length <= 1) return;

            const startNum = cleanDateNum(document.getElementById('start-date').value);
            const endNum = cleanDateNum(document.getElementById('end-date').value);

            // 배송일자 기준 필터링 (없으면 주문일자 보완)
            filteredOrders = allOrders.slice(1).filter(row => {
                let rowDateNum = cleanDateNum(row[colDeliveryDate]);
                if (rowDateNum === 0) rowDateNum = cleanDateNum(row[colOrderDate]); 
                return rowDateNum >= startNum && rowDateNum <= endNum;
            });

            document.getElementById('total-qty').innerText = `${filteredOrders.length} 건`;
            const uniqueItems = new Set(filteredOrders.map(r => r[colItemName]));
            document.getElementById('total-items').innerText = `${uniqueItems.size} 종`;

            let totalAmount = 0;
            filteredOrders.forEach(r => {
                let amt = cleanNumber(r[colTotal]);
                if (amt === 0) amt = cleanNumber(r[colQty]) * cleanNumber(r[colPrice]);
                totalAmount += amt;
            });
            document.getElementById('total-amount').innerText = `${totalAmount.toLocaleString()} 원`;

            const brandSelect = document.getElementById('brand-select');
            const brands = [...new Set(filteredOrders.map(r => r[colBrandName]))].filter(Boolean);
            
            brandSelect.innerHTML = '<option value="ALL">🌐 전체 브랜드</option>';
            brands.forEach(b => {
                brandSelect.innerHTML += `<option value="${b}">${b}</option>`;
            });

            onBrandChange();
        }

        function onBrandChange() {
            const selectedBrand = document.getElementById('brand-select').value;
            document.getElementById('store-search-input').value = '';

            let brandOrders = filteredOrders;
            if (selectedBrand && selectedBrand !== 'ALL') {
                brandOrders = filteredOrders.filter(r => r[colBrandName] === selectedBrand);
            }

            const stores = [...new Set(brandOrders.map(r => r[colStoreName]))].filter(Boolean);
            const items = new Set(brandOrders.map(r => r[colItemName]));

            document.getElementById('brand-store-count').innerText = stores.length;
            document.getElementById('brand-item-count').innerText = items.size;

            const storeListEl = document.getElementById('store-list');
            const brandLabel = (selectedBrand === 'ALL' || !selectedBrand) ? '전체 브랜드' : selectedBrand;

            storeListEl.innerHTML = `
                <li class="store-item total-item active" onclick="onStoreSelect('ALL', '${selectedBrand}', this)">
                    <span>🏢 [${brandLabel}] 전체 점포 합산</span>
                    <span style="font-size: 12px; color: #2563eb;">${brandOrders.length}건</span>
                </li>
            `;

            stores.forEach(store => {
                const count = brandOrders.filter(r => r[colStoreName] === store).length;
                storeListEl.innerHTML += `
                    <li class="store-item" onclick="onStoreSelect('${store}', '${selectedBrand}', this)">
                        <span>${store}</span>
                        <span style="font-size: 12px; color: #64748b;">${count}건</span>
                    </li>
                `;
            });

            onStoreSelect('ALL', selectedBrand, storeListEl.firstElementChild);
        }

        function filterStoreList() {
            const query = document.getElementById('store-search-input').value.toLowerCase();
            const items = document.querySelectorAll('#store-list .store-item');
            
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                if (text.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function clearTableFilterInputs() {
            document.getElementById('filter-storeCode').value = '';
            document.getElementById('filter-storeName').value = '';
            document.getElementById('filter-orderDate').value = '';
            document.getElementById('filter-deliveryDate').value = '';
            document.getElementById('filter-itemCode').value = '';
            document.getElementById('filter-itemName').value = '';
        }

        function onStoreSelect(storeName, brandName, element) {
            document.querySelectorAll('.store-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            const brandLabel = (brandName === 'ALL' || !brandName) ? '전체 브랜드' : brandName;

            if (storeName === 'ALL') {
                document.getElementById('selected-store-title').innerText = `🛒 [${brandLabel}] 전체 점포 합산 상세 목록`;
                if (brandName === 'ALL' || !brandName) {
                    baseDetailOrders = filteredOrders;
                } else {
                    baseDetailOrders = filteredOrders.filter(r => r[colBrandName] === brandName);
                }
            } else {
                document.getElementById('selected-store-title').innerText = `🛒 [${storeName}] 주문 상세 목록`;
                baseDetailOrders = filteredOrders.filter(r => r[colStoreName] === storeName);
            }

            clearTableFilterInputs();
            applyColumnFilters();
        }

        function applyColumnFilters() {
            const qStoreCode = document.getElementById('filter-storeCode').value.toLowerCase().trim();
            const qStoreName = document.getElementById('filter-storeName').value.toLowerCase().trim();
            const qOrderDate = document.getElementById('filter-orderDate').value.toLowerCase().trim();
            const qDelivDate = document.getElementById('filter-deliveryDate').value.toLowerCase().trim();
            const qItemCode  = document.getElementById('filter-itemCode').value.toLowerCase().trim();
            const qItemName  = document.getElementById('filter-itemName').value.toLowerCase().trim();

            currentDetailOrders = baseDetailOrders.filter(row => {
                const sc = String(row[colStoreCode] || '').toLowerCase();
                const sn = String(row[colStoreName] || '').toLowerCase();
                const od = String(row[colOrderDate] || '').toLowerCase();
                const dd = String(row[colDeliveryDate] || '').toLowerCase();
                const ic = String(row[colItemCode] || '').toLowerCase();
                const iname = String(row[colItemName] || '').toLowerCase();

                if (qStoreCode && !sc.includes(qStoreCode)) return false;
                if (qStoreName && !sn.includes(qStoreName)) return false;
                if (qOrderDate && !od.includes(qOrderDate)) return false;
                if (qDelivDate && !dd.includes(qDelivDate)) return false;
                if (qItemCode && !ic.includes(qItemCode)) return false;
                if (qItemName && !iname.includes(qItemName)) return false;

                return true;
            });

            renderDetailTable();
        }

        function renderDetailTable() {
            const detailTable = document.getElementById('order-detail-table');
            detailTable.innerHTML = "";

            if (!currentDetailOrders || currentDetailOrders.length === 0) {
                detailTable.innerHTML = `<tr><td colspan="9" style="text-align: center; color: #94a3b8; padding: 40px;">선택한 범위에 표시할 데이터가 없습니다.</td></tr>`;
                document.getElementById('list-total-qty').innerText = "0";
                document.getElementById('list-total-amount').innerText = "0";
                return;
            }

            let sumQty = 0;
            let sumAmount = 0;

            currentDetailOrders.forEach(row => {
                const storeCode    = row[colStoreCode] || '-';
                const storeName    = row[colStoreName] || '-';
                const orderDate    = row[colOrderDate] || '-';
                const deliveryDate = row[colDeliveryDate] || '-';
                const itemCode     = row[colItemCode] || '-';
                const itemName     = row[colItemName] || '-';
                const qty          = cleanNumber(row[colQty]);
                const price        = cleanNumber(row[colPrice]);
                let total          = cleanNumber(row[colTotal]);
                
                if (total === 0 && qty > 0 && price > 0) {
                    total = qty * price;
                }

                sumQty += qty;
                sumAmount += total;

                detailTable.innerHTML += `
                    <tr>
                        <td><span class="code-tag">${storeCode}</span></td>
                        <td><b>${storeName}</b></td>
                        <td>${orderDate}</td>
                        <td><span style="color:#2563eb; font-weight:bold;">${deliveryDate}</span></td>
                        <td><span class="code-tag">${itemCode}</span></td>
                        <td>${itemName}</td>
                        <td class="text-right">${qty.toLocaleString()}</td>
                        <td class="text-right">${price > 0 ? price.toLocaleString() + '원' : '-'}</td>
                        <td class="text-right"><b>${total > 0 ? total.toLocaleString() + '원' : '-'}</b></td>
                    </tr>
                `;
            });

            document.getElementById('list-total-qty').innerText = sumQty.toLocaleString();
            document.getElementById('list-total-amount').innerText = sumAmount.toLocaleString();
        }

        function sortTable(key) {
            if (!currentDetailOrders || currentDetailOrders.length === 0) return;

            if (currentSortKey === key) {
                currentSortAsc = !currentSortAsc;
            } else {
                currentSortKey = key;
                currentSortAsc = true;
            }

            document.querySelectorAll('.sort-icon').forEach(el => el.innerText = '');
            const iconEl = document.getElementById(`sort-${key}`);
            if (iconEl) iconEl.innerText = currentSortAsc ? ' ▲' : ' ▼';

            currentDetailOrders.sort((a, b) => {
                let valA, valB;
                if (key === 'storeCode') { valA = a[colStoreCode] || ''; valB = b[colStoreCode] || ''; }
                else if (key === 'storeName') { valA = a[colStoreName] || ''; valB = b[colStoreName] || ''; }
                else if (key === 'orderDate') { valA = cleanDateNum(a[colOrderDate]); valB = cleanDateNum(b[colOrderDate]); }
                else if (key === 'deliveryDate') { valA = cleanDateNum(a[colDeliveryDate]); valB = cleanDateNum(b[colDeliveryDate]); }
                else if (key === 'itemCode') { valA = a[colItemCode] || ''; valB = b[colItemCode] || ''; }
                else if (key === 'itemName') { valA = a[colItemName] || ''; valB = b[colItemName] || ''; }
                else if (key === 'qty') { valA = cleanNumber(a[colQty]); valB = cleanNumber(b[colQty]); }
                else if (key === 'price') { valA = cleanNumber(a[colPrice]); valB = cleanNumber(b[colPrice]); }
                else if (key === 'total') { 
                    valA = cleanNumber(a[colTotal]) || (cleanNumber(a[colQty]) * cleanNumber(a[colPrice])); 
                    valB = cleanNumber(b[colTotal]) || (cleanNumber(b[colQty]) * cleanNumber(b[colPrice])); 
                }

                if (valA < valB) return currentSortAsc ? -1 : 1;
                if (valA > valB) return currentSortAsc ? 1 : -1;
                return 0;
            });

            renderDetailTable();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initResizableColumns();
        });

        function initResizableColumns() {
            const table = document.getElementById('detail-table');
            const resizers = table.querySelectorAll('.resizer');

            resizers.forEach((resizer, index) => {
                let x = 0;
                let w = 0;

                const mouseDownHandler = (e) => {
                    e.stopPropagation(); 
                    x = e.clientX;
                    const col = document.getElementById(`col-${index}`);
                    w = col.offsetWidth;

                    resizer.classList.add('resizing');
                    document.addEventListener('mousemove', mouseMoveHandler);
                    document.addEventListener('mouseup', mouseUpHandler);
                };

                const mouseMoveHandler = (e) => {
                    const dx = e.clientX - x;
                    const newWidth = Math.max(50, w + dx);
                    const col = document.getElementById(`col-${index}`);
                    col.style.width = `${newWidth}px`;
                };

                const mouseUpHandler = () => {
                    resizer.classList.remove('resizing');
                    document.removeEventListener('mousemove', mouseMoveHandler);
                    document.removeEventListener('mouseup', mouseUpHandler);
                };

                resizer.addEventListener('mousedown', mouseDownHandler);
            });
        }

        function saveColumnWidths() {
            const widths = [];
            for (let i = 0; i < 9; i++) {
                const col = document.getElementById(`col-${i}`);
                widths.push(col.style.width || DEFAULT_WIDTHS[i]);
            }
            localStorage.setItem('oms_col_widths', JSON.stringify(widths));
            alert('💾 열 너비 설정이 저장되었습니다!');
        }

        function loadSavedColumnWidths() {
            const saved = localStorage.getItem('oms_col_widths');
            if (saved) {
                try {
                    const widths = JSON.parse(saved);
                    widths.forEach((w, i) => {
                        const col = document.getElementById(`col-${i}`);
                        if (col) col.style.width = w;
                    });
                } catch(e) {}
            }
        }

        function resetColumnWidths() {
            localStorage.removeItem('oms_col_widths');
            DEFAULT_WIDTHS.forEach((w, i) => {
                const col = document.getElementById(`col-${i}`);
                if (col) col.style.width = w;
            });
            alert('🔄 열 너비 설정이 기본값으로 초기화되었습니다.');
        }

        async function triggerBot() {
            const btn = document.getElementById('run-btn');
            
            const startVal = document.getElementById('start-date').value.replace(/-/g, '/');
            const endVal = document.getElementById('end-date').value.replace(/-/g, '/');

            btn.disabled = true;
            btn.innerText = "🔄 동기화 중...";

            fetch(`https://api.github.com/repos/${githubId}/${repoName}/actions/workflows/capture.yml/dispatches`, {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ 
                    ref: 'main',
                    inputs: {
                        start_date: startVal,
                        end_date: endVal
                    }
                })
            })
            .then(res => {
                if(res.ok) {
                    alert(`✅ [${startVal} ~ ${endVal}] OMS 수동 동기화 요청 완료!\n약 30초 후 데이터가 동기화됩니다.`);
                    setTimeout(() => { 
                        btn.disabled = false; 
                        btn.innerText = "🚀 해당 기간 OMS 동기화"; 
                        fetchSheetData();
                    }, 35000);
                } else {
                    alert("❌ 동기화 요청 실패");
                    btn.disabled = false; btn.innerText = "🚀 해당 기간 OMS 동기화";
                }
            });
        }
    </script>
</body>
