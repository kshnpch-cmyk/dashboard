<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theborn OMS 데이터 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Pretendard', sans-serif; }
        .card { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .table-container { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .badge-center { background-color: #e3f2fd; color: #0d6efd; font-weight: 600; padding: 6px 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <h2 class="fw-bold mb-4">📦 Theborn OMS 주문 데이터 대시보드</h2>

        <!-- 검색 필터 -->
        <div class="card p-3 mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-md-3">
                    <label class="form-label fw-bold">시작 배송일자</label>
                    <input type="date" id="startDate" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">종료 배송일자</label>
                    <input type="date" id="endDate" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">물류센터 필터</label>
                    <select id="centerFilter" class="form-select">
                        <option value="">전체 물류센터</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end gap-2">
                    <button id="btnSearch" class="btn btn-primary w-100 fw-bold" onclick="loadDashboardData()">조회</button>
                    <button id="btnSync" class="btn btn-outline-success w-50 fw-bold" onclick="triggerBot()">동기화</button>
                </div>
            </div>
        </div>

        <!-- 요약 집계 카드 -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <div class="text-secondary mb-1">총 주문 건수</div>
                    <h3 id="totalCount" class="fw-bold text-dark">0건</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <div class="text-secondary mb-1">총 주문 수량</div>
                    <h3 id="totalQty" class="fw-bold text-primary">0개</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <div class="text-secondary mb-1">총 주문 금액</div>
                    <h3 id="totalAmount" class="fw-bold text-success">0원</h3>
                </div>
            </div>
        </div>

        <!-- 주문 데이터 테이블 -->
        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>배송일자</th>
                            <th>브랜드</th>
                            <th>점포명 (코드)</th>
                            <th class="text-center">물류센터</th>
                            <th>품목명</th>
                            <th class="text-end">수량</th>
                            <th class="text-end">단가</th>
                            <th class="text-end">총 금액</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody">
                        <tr>
                            <td colspan="8" class="text-center py-4 text-muted">조회할 날짜를 선택 후 조회를 눌러주세요.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://zbilhsgfgyfrolveaego.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN";

        let currentOrdersData = [];

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = today;
            loadDashboardData();
        };

        // 🚀 Supabase API 호출 (distribution_center 컬럼 명시 포함)
        async function fetchAllOrdersInChunksForRange(startDate, endDate) {
            let allData = [];
            let page = 0;
            const pageSize = 1000;
            let hasMore = true;

            const sDate = startDate.replace(/\//g, '-');
            const eDate = endDate.replace(/\//g, '-');

            while (hasMore) {
                // select 쿼리에 distribution_center 명시
                const selectCols = "order_date,delivery_date,store_code,store_name,brand_name,distribution_center,item_code,item_name,qty,price,total_amount";
                const url = `${SUPABASE_URL}/rest/v1/oms_orders?select=${selectCols}&delivery_date=gte.${sDate}&delivery_date=lte.${eDate}&order=delivery_date.desc`;

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Range': `${page * pageSize}-${(page + 1) * pageSize - 1}`
                    }
                });

                if (!response.ok) {
                    console.error("데이터 패치 실패:", response.statusText);
                    break;
                }

                const data = await response.json();
                allData = allData.concat(data);

                if (data.length < pageSize) {
                    hasMore = false;
                } else {
                    page++;
                }
            }
            return allData;
        }

        async function loadDashboardData() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate || !endDate) {
                alert("조회 날짜를 지정하세요.");
                return;
            }

            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4">⏳ 데이터 불러오는 중...</td></tr>';

            currentOrdersData = await fetchAllOrdersInChunksForRange(startDate, endDate);
            
            populateCenterFilter(currentOrdersData);
            applyFilterAndRender();
        }

        function populateCenterFilter(data) {
            const centerSelect = document.getElementById('centerFilter');
            const selectedVal = centerSelect.value;
            
            const centers = new Set();
            data.forEach(row => {
                const cName = (row.distribution_center || row.center_name || row.center || '').trim();
                if (cName) centers.add(cName);
            });

            centerSelect.innerHTML = '<option value="">전체 물류센터</option>';
            Array.from(centers).sort().forEach(center => {
                const opt = document.createElement('option');
                opt.value = center;
                opt.textContent = center;
                if (center === selectedVal) opt.selected = true;
                centerSelect.appendChild(opt);
            });
        }

        function applyFilterAndRender() {
            const selectedCenter = document.getElementById('centerFilter').value;
            let filtered = currentOrdersData;

            if (selectedCenter) {
                filtered = currentOrdersData.filter(row => {
                    const cName = (row.distribution_center || row.center_name || row.center || '').trim();
                    return cName === selectedCenter;
                });
            }

            renderDashboard(filtered);
        }

        document.getElementById('centerFilter').addEventListener('change', applyFilterAndRender);

        function renderDashboard(dataList) {
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '';

            let totalQty = 0;
            let totalAmount = 0;

            if (dataList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">수집된 데이터가 없습니다.</td></tr>';
            } else {
                dataList.forEach(row => {
                    const qty = Number(row.qty || 0);
                    const amount = Number(row.total_amount || 0);
                    totalQty += qty;
                    totalAmount += amount;

                    // 💡 DB 컬럼명 바인딩 및 Fallback 처리
                    const centerName = (row.distribution_center || row.center_name || row.center || '').trim() || '-';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.delivery_date || '-'}</td>
                        <td>${row.brand_name || '-'}</td>
                        <td><strong>${row.store_name || '-'}</strong> <span class="text-muted font-monospace">(${row.store_code || ''})</span></td>
                        <td class="text-center"><span class="badge-center">${centerName}</span></td>
                        <td>${row.item_name || '-'}</td>
                        <td class="text-end fw-bold">${qty.toLocaleString()}</td>
                        <td class="text-end">${Number(row.price || 0).toLocaleString()}원</td>
                        <td class="text-end fw-bold text-success">${amount.toLocaleString()}원</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('totalCount').textContent = `${dataList.length.toLocaleString()}건`;
            document.getElementById('totalQty').textContent = `${totalQty.toLocaleString()}개`;
            document.getElementById('totalAmount').textContent = `${totalAmount.toLocaleString()}원`;
        }

        function triggerBot() {
            alert("동기화 요청이 트리거되었습니다.");
        }
    </script>
</body>
</html>
