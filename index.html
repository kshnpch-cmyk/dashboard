<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더본 OMS 주문 실시간 대시보드</title>
    <!-- 📱 모바일 접속 시 mobile.html 자동 리다이렉트 -->
    <script>
        if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            location.replace('/mobile.html');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .navbar {
            background-color: #0f172a; color: white; padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 15px;
        }
        .brand-title { display: flex; align-items: center; gap: 10px; }
        .brand-title h1 { margin: 0; font-size: 20px; font-weight: 700; }
        .version-tag {
            background-color: #10b981; color: white; font-size: 11px; font-weight: 800;
            padding: 3px 8px; border-radius: 12px; letter-spacing: 0.5px;
        }
        .control-panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .sync-date-group {
            display: flex; align-items: center; background-color: #1e293b;
            padding: 6px 12px; border-radius: 8px; gap: 8px; border: 1px solid #334155;
        }
        .sync-date-group label { font-size: 13px; color: #94a3b8; font-weight: 600; }
        .date-input {
            background-color: #0f172a; color: #ffffff; border: 1px solid #475569;
            padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; color-scheme: dark;
        }
        .last-updated-tag {
            font-size: 12px; color: #38bdf8; background-color: #1e293b;
            padding: 6px 12px; border-radius: 6px; border: 1px solid #0284c7; font-weight: bold;
            display: flex; align-items: center; gap: 8px;
        }
        .btn {
            background-color: #2563eb; color: white; border: none; padding: 8px 14px;
            border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-query { background-color: #0284c7; }
        .btn-cal { background-color: #0f766e; padding: 4px 8px; font-size: 11px; border-radius: 4px; }
        .btn-excel { background-color: #16a34a; padding: 5px 10px; font-size: 12px; }
        .btn-search-icon {
            background-color: #475569; color: white; border: none; padding: 6px 9px;
            border-radius: 6px; cursor: pointer; font-size: 12px; margin-left: -2px;
        }
        .btn-search-icon:hover { background-color: #334155; }

        .container { padding: 20px; max-width: 98%; margin: 0 auto; }
        .section-panel {
            background: white; padding: 20px; border-radius: 12px;
            margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
        }
        .panel-title-text { font-size: 18px; font-weight: 700; color: #0f172a; }
        
        .filter-row {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            background-color: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px;
        }
        .filter-group { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #475569; }
        .input-box { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }

        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 15px; }
        .kpi-card { background: #f8fafc; padding: 15px 20px; border-radius: 8px; border-left: 5px solid #2563eb; }
        .kpi-card.green { border-left-color: #10b981; }
        .kpi-card.purple { border-left-color: #8b5cf6; }
        .kpi-title { font-size: 13px; color: #64748b; font-weight: 600; }
        .kpi-value { font-size: 22px; font-weight: 800; margin-top: 4px; color: #0f172a; }

        .chart-container { position: relative; height: 280px; width: 100%; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); z-index: 999; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 12px; width: 520px; max-width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            max-height: 85vh; display: flex; flex-direction: column;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title { font-size: 16px; font-weight: 700; }
        .close-btn { cursor: pointer; font-size: 18px; font-weight: bold; color: #64748b; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .calendar-header-day { text-align: center; font-weight: bold; font-size: 11px; color: #64748b; padding: 4px 0; background: #f8fafc; }
        .calendar-day-cell {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 4px; height: 48px; padding: 4px;
            display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
        }
        .calendar-day-cell:hover { border-color: #2563eb; background-color: #eff6ff; }
        .calendar-day-cell.other-month { background-color: #f8fafc; opacity: 0.3; cursor: default; }
        .day-number { font-size: 11px; font-weight: bold; }
        .data-status-badge { font-size: 9.5px; font-weight: bold; padding: 1px 3px; border-radius: 3px; text-align: center; }
        .badge-has-data { background-color: #d1fae5; color: #047857; }
        .badge-no-data { background-color: #f1f5f9; color: #94a3b8; }

        .modal-body-scroll { flex: 1; overflow-y: auto; margin-top: 10px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
        .search-list-item {
            display: flex; align-items: center; justify-content: space-between; padding: 8px 10px;
            border-bottom: 1px solid #f1f5f9; font-size: 13px; cursor: pointer;
        }
        .search-list-item:hover { background-color: #eff6ff; }
        .search-list-item label { cursor: pointer; width: 100%; display: flex; align-items: center; gap: 8px; }

        .dashboard-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
        .panel { background: white; padding: 20px; border-radius: 12px; }
        .panel-title {
            font-size: 18px; font-weight: 700; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }

        .summary-badge-group { display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .summary-badge { background-color: #f1f5f9; padding: 4px 10px; border-radius: 6px; border: 1px solid #cbd5e1; color: #475569; }
        .summary-badge b { color: #2563eb; }

        .select-box, .search-input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; margin-bottom: 12px; }
        .store-list { list-style: none; padding: 0; margin: 0; max-height: 500px; overflow-y: auto; }
        .store-item {
            padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 6px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13.5px;
        }
        .store-item:hover, .store-item.active { background-color: #eff6ff; border-color: #2563eb; font-weight: bold; }
        .store-item.total-item { background-color: #f8fafc; font-weight: 700; }

        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        th { background-color: #f8fafc; color: #475569; cursor: pointer; position: sticky; top: 0; z-index: 2; }
        .table-filter-input { width: 100%; padding: 4px 6px; font-size: 11px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .text-right { text-align: right; }
        .code-tag { font-size: 11px; color: #64748b; font-family: monospace; }

        .pagination-container {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 15px; padding-top: 12px; border-top: 1px solid #e2e8f0; flex-wrap: wrap; gap: 10px;
        }
        .pagination-controls { display: flex; align-items: center; gap: 6px; }
        .page-btn {
            background-color: #f8fafc; border: 1px solid #cbd5e1; color: #334155;
            padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer;
        }
        .page-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-info { font-size: 13px; color: #64748b; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .page-input { width: 50px; text-align: center; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .rows-per-page-selector {
            display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #475569;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand-title">
            <h1>📦 더본 OMS 주문 실시간 대시보드</h1>
            <span class="version-tag">v22.0 Fully Synchronized</span>
        </div>
        <div class="control-panel">
            <div class="last-updated-tag">
                <span id="last-updated-text">🕒 최신 배송일자: 계산 중...</span>
                <button class="btn btn-cal" onclick="openCalendarModal()">📅 캘린더</button>
            </div>
            
            <div class="sync-date-group">
                <label>동기화 일자:</label>
                <input type="date" id="sync-target-date" class="date-input">
            </div>
            <button id="run-btn" class="btn" onclick="triggerBot()">🚀 OMS 수동 동기화</button>
        </div>
    </div>

    <!-- 📅 캘린더 모달 -->
    <div class="modal-overlay" id="calendar-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">📅 배송일자 데이터 존재 현황</span>
                <span class="close-btn" onclick="closeCalendarModal()">✕</span>
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 10px; align-items: center;">
                <label style="font-size: 12px; font-weight: bold;">월 선택:</label>
                <input type="month" id="calendar-month-picker" class="input-box" onchange="loadCalendarData()">
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
    </div>

    <!-- 🔍 브랜드 선택 모달 -->
    <div class="modal-overlay" id="brand-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">🏢 브랜드 다중 선택</span>
                <span class="close-btn" onclick="closeBrandModal()">✕</span>
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <input type="text" id="modal-brand-search" class="input-box" style="flex:1;" placeholder="브랜드명 검색 (Enter)" onkeydown="if(event.key==='Enter') filterBrandModalList()">
                <button class="btn btn-cal" style="background:#2563eb;" onclick="filterBrandModalList()">검색</button>
                <button class="btn btn-cal" style="background:#475569;" onclick="toggleAllBrandCheck(true)">전체선택</button>
                <button class="btn btn-cal" style="background:#64748b;" onclick="toggleAllBrandCheck(false)">해제</button>
            </div>
            <div class="modal-body-scroll" id="brand-modal-list"></div>
            <div style="margin-top: 15px; text-align: right;">
                <button class="btn" onclick="applyBrandSelection()">확인 적용</button>
            </div>
        </div>
    </div>

    <!-- 📦 품목 다중 선택 모달 -->
    <div class="modal-overlay" id="item-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">📦 품목 다중 선택</span>
                <span class="close-btn" onclick="closeItemModal()">✕</span>
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <input type="text" id="modal-item-search" class="input-box" style="flex:1;" placeholder="품목코드 또는 품목명 검색 (Enter)" onkeydown="if(event.key==='Enter') filterItemModalList()">
                <button class="btn btn-cal" style="background:#2563eb;" onclick="filterItemModalList()">검색</button>
                <button class="btn btn-cal" style="background:#475569;" onclick="toggleAllItemCheck(true)">전체선택</button>
                <button class="btn btn-cal" style="background:#64748b;" onclick="toggleAllItemCheck(false)">해제</button>
            </div>
            <div class="modal-body-scroll" id="item-modal-list"></div>
            <div style="margin-top: 15px; text-align: right;">
                <button class="btn" onclick="applyItemSelection()">확인 적용</button>
            </div>
        </div>
    </div>

    <div class="container">
        
        <!-- 📊 통합 검색 컨트롤 패널 -->
        <div class="section-panel">
            <div class="panel-header" style="margin-bottom: 0; border-bottom: none;">
                <span class="panel-title-text" style="white-space: nowrap;">📈 기간별 주문 대시보드</span>
                
                <div class="filter-row" style="margin-bottom: 0; padding: 0; background: transparent; border: none;">
                    <div class="filter-group">
                        <label>조회 기간:</label>
                        <input type="date" id="chart-start-date" class="input-box" onchange="validateDates('start')">
                        <span>~</span>
                        <input type="date" id="chart-end-date" class="input-box" onchange="validateDates('end')">
                    </div>
                    <div class="filter-group">
                        <label>브랜드:</label>
                        <input type="text" id="chart-brand-input" class="input-box" placeholder="브랜드 선택/검색" style="width: 140px;" readonly onclick="openBrandModal('chart')">
                        <button class="btn-search-icon" onclick="openBrandModal('chart')" title="브랜드 다중 선택">🔍</button>
                    </div>
                    <div class="filter-group">
                        <label>품목코드/명:</label>
                        <input type="text" id="chart-item-input" class="input-box" placeholder="품목 선택/검색" style="width: 150px;" readonly onclick="openItemModal()">
                        <button class="btn-search-icon" onclick="openItemModal()" title="품목 다중 선택">🔍</button>
                    </div>
                    <button class="btn btn-query" onclick="fetchAllDashboardData()">🔍 대시보드 종합 조회</button>
                </div>
            </div>

            <div class="kpi-grid" style="margin-top: 15px;">
                <div class="kpi-card">
                    <div class="kpi-title">기간 내 총 주문수량</div>
                    <div class="kpi-value" id="kpi-total-qty">0 건</div>
                </div>
                <div class="kpi-card green">
                    <div class="kpi-title">기간 내 취급 품목수</div>
                    <div class="kpi-value" id="kpi-total-items">0 종</div>
                </div>
                <div class="kpi-card purple">
                    <div class="kpi-title">기간 내 총 주문금액</div>
                    <div class="kpi-value" id="kpi-total-amount">0 원</div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="dailyTrendChart"></canvas>
            </div>
        </div>

        <div class="dashboard-layout">
            <div class="panel">
                <div class="panel-title"><span>🏢 브랜드 필터</span></div>
                <div style="display: flex; gap: 4px; margin-bottom: 12px;">
                    <input type="text" id="detail-brand-input" class="input-box" style="flex:1;" placeholder="브랜드 선택..." readonly onclick="openBrandModal('detail')">
                    <button class="btn-search-icon" onclick="openBrandModal('detail')">🔍</button>
                </div>
                <div style="display: flex; gap: 4px; margin-bottom: 12px;">
                    <input type="text" id="store-search-input" class="search-input" style="margin-bottom:0;" placeholder="🔍 점포명 입력 후 Enter" onkeydown="if(event.key==='Enter') filterStoreList()">
                    <button class="btn btn-query" onclick="filterStoreList()">검색</button>
                </div>
                <div id="brand-summary" style="margin-bottom: 10px; font-size: 12px; color: #64748b;">
                    점포수: <b id="brand-store-count">0개</b> | 품목수: <b id="brand-item-count">-</b>
                </div>
                <ul class="store-list" id="store-list"></ul>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <span id="selected-store-title">🛒 기간 내 주문 상세</span>
                    <div class="summary-badge-group">
                        <button class="btn btn-excel" onclick="exportToExcel()">📥 엑셀 저장</button>
                        <span class="summary-badge">수량합계: <b id="list-total-qty">0개</b></span>
                        <span class="summary-badge">금액합계: <b id="list-total-amount">0원</b></span>
                    </div>
                </div>
                
                <div class="table-container">
                    <table id="detail-table">
                        <colgroup>
                            <col style="width: 80px;"><col style="width: 140px;"><col style="width: 120px;">
                            <col style="width: 90px;"><col style="width: 90px;"><col style="width: 90px;">
                            <col style="width: 180px;"><col style="width: 65px;"><col style="width: 85px;"><col style="width: 105px;">
                        </colgroup>
                        <thead>
                            <tr>
                                <th>점포코드</th><th>점포명</th><th>센터명</th><th>주문일자</th><th>배송일자</th>
                                <th>품목코드</th><th>품목명</th><th class="text-right">수량</th>
                                <th class="text-right">단가</th><th class="text-right">금액</th>
                            </tr>
                            <tr class="filter-row-table">
                                <th><input type="text" id="filter-storeCode" class="table-filter-input" placeholder="Enter" onkeydown="if(event.key==='Enter') applyColumnFilters()"></th>
                                <th><input type="text" id="filter-storeName" class="table-filter-input" placeholder="Enter" onkeydown="if(event.key==='Enter') applyColumnFilters()"></th>
                                <th><input type="text" id="filter-centerName" class="table-filter-input" placeholder="Enter" onkeydown="if(event.key==='Enter') applyColumnFilters()"></th>
                                <th><input type="text" id="filter-orderDate" class="table-filter-input" placeholder="Enter" onkeydown="if(event.key==='Enter') applyColumnFilters()"></th>
                                <th><input type="text" id="filter-deliveryDate" class="table-filter-input" placeholder="Enter" onkeydown="if(event.key==='Enter') applyColumnFilters()"></th>
                                <th><input type="text" id="filter-itemCode" class="table-filter-input" placeholder="Enter" onkeydown="if(event.key==='Enter') applyColumnFilters()"></th>
                                <th><input type="text" id="filter-itemName" class="table-filter-input" placeholder="Enter" onkeydown="if(event.key==='Enter') applyColumnFilters()"></th>
                                <th></th><th></th><th></th>
                            </tr>
                        </thead>
                        <tbody id="order-detail-table"></tbody>
                    </table>
                </div>

                <div class="pagination-container">
                    <div class="rows-per-page-selector">
                        <label>페이지당 보기:</label>
                        <select id="rows-per-page" class="input-box" onchange="changeRowsPerPage()">
                            <option value="10" selected>10개씩</option>
                            <option value="50">50개씩</option>
                            <option value="100">100개씩</option>
                            <option value="1000">1000개씩</option>
                        </select>
                    </div>

                    <div class="pagination-controls">
                        <button class="page-btn" id="btn-first-page" onclick="goToPage(1)">« 처음</button>
                        <button class="page-btn" id="btn-prev-page" onclick="goToPage(currentPage - 1)">‹ 이전</button>
                        
                        <div class="page-info">
                            <input type="number" id="page-input-box" class="page-input" value="1" min="1" onkeydown="if(event.key==='Enter') handlePageInput(this.value)" onblur="handlePageInput(this.value)">
                            <span>/ <b id="total-page-text">1</b> 페이지</span>
                            <span style="font-weight:normal; color:#94a3b8; font-size:11px;" id="total-rows-text">(총 0건)</span>
                        </div>

                        <button class="page-btn" id="btn-next-page" onclick="goToPage(currentPage + 1)">다음 ›</button>
                        <button class="page-btn" id="btn-last-page" onclick="goToPage(totalPages)">끝 »</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://zbilhsgfgyfrolveaego.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN"; 

        // 🌤️ 공공데이터포털 기상청 ASOS API 인증키

        /* 💾 IndexedDB 캐시 */
        const DB_NAME = "OmsLocalCacheDB";
        const STORE_NAME = "query_cache";

        function openIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "url" });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function getCacheIDB(url) {
            try {
                const db = await openIndexedDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, "readonly");
                    const store = tx.objectStore(STORE_NAME);
                    const req = store.get(url);
                    req.onsuccess = () => {
                        const res = req.result;
                        if (res && (Date.now() - res.timestamp < 1000 * 60 * 15)) {
                            resolve(res.data);
                        } else resolve(null);
                    };
                    req.onerror = () => resolve(null);
                });
            } catch (e) { return null; }
        }

        async function setCacheIDB(url, data) {
            try {
                const db = await openIndexedDB();
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).put({ url, data, timestamp: Date.now() });
            } catch (e) {}
        }

        async function fetchWithUltraCache(url, options, retries = 3) {
            const cachedData = await getCacheIDB(url);
            if (cachedData) {
                return new Response(JSON.stringify(cachedData), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }

            const res = await fetchWithRetry(url, options, retries);
            if (res.ok) {
                const clone = res.clone();
                const jsonData = await clone.json();
                setCacheIDB(url, jsonData);
            }
            return res;
        }

        function safeSetStorage(key, value) {
            try { localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value)); }
            catch (e) { localStorage.clear(); }
        }

        async function fetchWithRetry(url, options, retries = 3, backoff = 400) {
            try {
                const res = await fetch(url, options);
                if (!res.ok && res.status >= 500 && retries > 0) throw new Error();
                return res;
            } catch (err) {
                if (retries > 0) {
                    await new Promise(r => setTimeout(r, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 1.5);
                }
                throw err;
            }
        }

        /* 🌤️ 공공데이터포털 기상청 ASOS API 연동 (서울/108 지점 기준) */
        async function fetchKoreaWeatherData(startDate, endDate) {
            try {
                const startStr = startDate.replace(/-/g, '');
                const endStr = endDate.replace(/-/g, '');
                
                const url = `https://apis.data.go.kr/1360000/AsosDalyInfoService/getWthrDataList?serviceKey=${KMA_SERVICE_KEY}&pageNo=1&numOfRows=999&dataType=JSON&dataCd=ASOS&dateCd=DAY&startDt=${startStr}&endDt=${endStr}&stnIds=108`;

                const res = await fetch(url);
                if (!res.ok) return {};
                const resultData = await res.json();
                
                const weatherMap = {};
                const items = resultData?.response?.body?.items?.item;

                if (items && Array.isArray(items)) {
                    items.forEach(r => {
                        const dateRaw = r.tm; // YYYY-MM-DD
                        if (!dateRaw) return;
                        
                        const formattedDate = dateRaw.replace(/-/g, '/');
                        const minTemp = r.minTa !== "" && r.minTa !== undefined ? Math.round(parseFloat(r.minTa)) : '-';
                        const maxTemp = r.maxTa !== "" && r.maxTa !== undefined ? Math.round(parseFloat(r.maxTa)) : '-';
                        const sumRn = parseFloat(r.sumRn || 0); // 강수량(mm)
                        const ddMefs = parseFloat(r.ddMefs || 0); // 눈/적설(cm)
                        const avgTca = parseFloat(r.avgTca || 0); // 평균 전운량(10분위)

                        let statusIcon = "☀️";
                        let statusText = "맑음";

                        if (ddMefs > 0) {
                            statusIcon = "❄️";
                            statusText = "눈";
                        } else if (sumRn > 0) {
                            statusIcon = "🌧️";
                            statusText = "비";
                        } else if (avgTca >= 6.0) {
                            statusIcon = "⛅";
                            statusText = "흐림";
                        }

                        weatherMap[formattedDate] = {
                            minTemp,
                            maxTemp,
                            statusIcon,
                            statusText,
                            displayLabel: `${minTemp}°/${maxTemp}° ${statusIcon}`
                        };
                    });
                }
                return weatherMap;
            } catch (e) {
                console.error("기상청 API 날씨 데이터 로드 오류:", e);
                return {};
            }
        }

            while (hasMore) {
                if (currentToken !== activeFetchToken) return;

                const chunkUrl = `${SUPABASE_URL}/rest/v1/oms_orders?delivery_date=gte.${startDate}&delivery_date=lte.${endDate}&select=store_code,store_name,distribution_center,order_date,delivery_date,item_code,item_name,qty,price,total_amount,brand_name&order=store_name.asc&limit=${limit}&offset=${offset}`;
                try {
                    const res = await fetchWithUltraCache(chunkUrl, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                    if (res.ok) {
                        const chunk = await res.json();
                        chunk.forEach(r => { r.center_name = r.distribution_center || r.center_name || '-'; });

                        rawDetailOrders = rawDetailOrders.concat(chunk);
                        filteredDetailOrders = rawDetailOrders;

                        let calculatedPercent = Math.min(99, Math.round((rawDetailOrders.length / totalExpectedRows) * 100));
                        updateBadgePercent(calculatedPercent);

                        const activeStore = document.querySelector('#store-list .active');
                        if (activeStore && activeStore.innerText.includes('전체 점포 합산')) {
                            baseDetailOrders = filteredDetailOrders;
                            applyColumnFilters();
                        }

                        if (chunk.length < limit) {
                            hasMore = false;
                        } else offset += limit;
                    } else { hasMore = false; }
                } catch(e) { hasMore = false; }
            }

            if (currentToken === activeFetchToken) {
                currentMaxPercent = 100;
                const activeStore = document.querySelector('#store-list .active');
                if (activeStore && activeStore.innerText.includes('전체 점포 합산')) {
                    baseDetailOrders = filteredDetailOrders;
                    applyColumnFilters();
                } else {
                    renderDetailTable();
                }
            }
        }

        async function fetchStoreDetailOrders(storeName) {
            const startDate = document.getElementById('chart-start-date').value;
            const endDate = document.getElementById('chart-end-date').value;
            const queryUrl = `${SUPABASE_URL}/rest/v1/oms_orders?delivery_date=gte.${startDate}&delivery_date=lte.${endDate}&store_name=eq.${encodeURIComponent(storeName)}&select=store_code,store_name,distribution_center,order_date,delivery_date,item_code,item_name,qty,price,total_amount,brand_name`;

            try {
                const res = await fetchWithUltraCache(queryUrl, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                if (res.ok) {
                    const data = await res.json();
                    data.forEach(r => { r.center_name = r.distribution_center || r.center_name || '-'; });
                    baseDetailOrders = data;
                    applyColumnFilters();
                }
            } catch(e) {}
        }

        function updateStoreListAndSummary(selectedBrandsFilter = null) {
            let activeList = storeSummaryList;
            
            if (selectedBrandsFilter && selectedBrandsFilter.length > 0) {
                activeList = storeSummaryList.filter(r => selectedBrandsFilter.includes(r.brand_name));
            } else {
                const detailBrandVal = document.getElementById('detail-brand-input').value.trim();
                if (detailBrandVal) {
                    const bList = detailBrandVal.split(',').map(s => s.trim()).filter(Boolean);
                    if (bList.length > 0) activeList = storeSummaryList.filter(r => bList.includes(r.brand_name));
                }
            }

            const storeGroupMap = {};
            activeList.forEach(r => {
                const sName = r.store_name;
                if (!sName) return;
                if (!storeGroupMap[sName]) storeGroupMap[sName] = 0;
                storeGroupMap[sName] += cleanNumber(r.order_count);
            });

            const sortedStores = Object.keys(storeGroupMap).sort();
            document.getElementById('brand-store-count').innerText = `${sortedStores.length.toLocaleString()}개`;
            document.getElementById('brand-item-count').innerText = '-';

            const storeListEl = document.getElementById('store-list');
            const totalCount = Object.values(storeGroupMap).reduce((a, b) => a + b, 0);

            let listItemsHtml = [`<li class="store-item total-item active" onclick="onStoreSelect('ALL', this)">
                <span>🏢 전체 점포 합산</span><span style="color:#2563eb;">${totalCount.toLocaleString()}건</span>
            </li>`];

            sortedStores.forEach(store => {
                const count = storeGroupMap[store];
                listItemsHtml.push(`<li class="store-item" onclick="onStoreSelect('${store}', this)">
                    <span>${store}</span><span style="color:#64748b;">${count.toLocaleString()}건</span>
                </li>`);
            });
            storeListEl.innerHTML = listItemsHtml.join('');
            onStoreSelect('ALL', storeListEl.firstElementChild);
        }

        function filterStoreList() {
            const query = document.getElementById('store-search-input').value.toLowerCase().trim();
            document.querySelectorAll('#store-list .store-item').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        }

        function onStoreSelect(storeName, element) {
            document.querySelectorAll('.store-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            if (storeName === 'ALL') {
                document.getElementById('selected-store-title').innerText = `🛒 기간 내 전체 점포 합산 상세`;
                baseDetailOrders = filteredDetailOrders;
                applyColumnFilters();
            } else {
                document.getElementById('selected-store-title').innerText = `🛒 [${storeName}] 주문 상세`;
                fetchStoreDetailOrders(storeName);
            }
        }

        function applyColumnFilters() {
            const qSC = document.getElementById('filter-storeCode').value.toLowerCase().trim();
            const qSN = document.getElementById('filter-storeName').value.toLowerCase().trim();
            const qCN = document.getElementById('filter-centerName').value.toLowerCase().trim();
            const qOD = document.getElementById('filter-orderDate').value.toLowerCase().trim();
            const qDD = document.getElementById('filter-deliveryDate').value.toLowerCase().trim();
            const qIC = document.getElementById('filter-itemCode').value.toLowerCase().trim();
            const qIN = document.getElementById('filter-itemName').value.toLowerCase().trim();

            currentDetailOrders = baseDetailOrders.filter(row => {
                if (qSC && !cleanCode(row.store_code).toLowerCase().includes(qSC)) return false;
                if (qSN && !String(row.store_name||'').toLowerCase().includes(qSN)) return false;
                if (qCN && !String(row.center_name||row.distribution_center||'').toLowerCase().includes(qCN)) return false;
                if (qOD && !formatDisplayDate(row.order_date).toLowerCase().includes(qOD)) return false;
                if (qDD && !formatDisplayDate(row.delivery_date).toLowerCase().includes(qDD)) return false;
                if (qIC && !cleanCode(row.item_code).toLowerCase().includes(qIC)) return false;
                if (qIN && !String(row.item_name||'').toLowerCase().includes(qIN)) return false;
                return true;
            });

            currentPage = 1; 
            renderDetailTable();
        }

        function renderDetailTable() {
            const tbody = document.getElementById('order-detail-table');

            if (!currentDetailOrders || currentDetailOrders.length === 0) {
                if (currentMaxPercent < 100) return;
                tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding:30px; color:#94a3b8;">데이터가 없습니다.</td></tr>`;
                document.getElementById('list-total-qty').innerText = "0개";
                document.getElementById('list-total-amount').innerText = "0원";
                updatePaginationUI(0);
                return;
            }

            let sumQty = 0, sumAmount = 0;
            currentDetailOrders.forEach(row => {
                const q = cleanNumber(row.qty), p = cleanNumber(row.price);
                sumQty += q;
                sumAmount += (cleanNumber(row.total_amount) || (q * p));
            });

            if (currentMaxPercent >= 100) {
                document.getElementById('list-total-qty').innerText = `${sumQty.toLocaleString()}개`;
                document.getElementById('list-total-amount').innerText = `${sumAmount.toLocaleString()}원`;
                
                if (baseDetailOrders === filteredDetailOrders) {
                    document.getElementById('kpi-total-qty').innerText = `${sumQty.toLocaleString()} 건`;
                    document.getElementById('kpi-total-amount').innerText = `${sumAmount.toLocaleString()} 원`;
                }
            }

            const totalItems = currentDetailOrders.length;
            totalPages = Math.ceil(totalItems / rowsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * rowsPerPage;
            const pageData = currentDetailOrders.slice(startIndex, startIndex + rowsPerPage);

            const rowsHtml = pageData.map(row => {
                const q = cleanNumber(row.qty), p = cleanNumber(row.price);
                let t = cleanNumber(row.total_amount) || (q * p);
                const centerVal = row.distribution_center || row.center_name || '-';

                return `
                    <tr>
                        <td><span class="code-tag">${cleanCode(row.store_code)}</span></td>
                        <td><b>${row.store_name||'-'}</b></td>
                        <td><span style="color:#2563eb; font-weight:600;">${centerVal}</span></td>
                        <td>${formatDisplayDate(row.order_date)}</td>
                        <td><span style="color:#2563eb; font-weight:bold;">${formatDisplayDate(row.delivery_date)}</span></td>
                        <td><span class="code-tag">${cleanCode(row.item_code)}</span></td>
                        <td>${row.item_name||'-'}</td>
                        <td class="text-right">${q.toLocaleString()}</td>
                        <td class="text-right">${p > 0 ? p.toLocaleString() + '원' : '-'}</td>
                        <td class="text-right"><b>${t > 0 ? t.toLocaleString() + '원' : '-'}</b></td>
                    </tr>
                `;
            });

            tbody.innerHTML = rowsHtml.join('');
            updatePaginationUI(totalItems);
        }

        function updatePaginationUI(totalItems) {
            document.getElementById('page-input-box').value = currentPage;
            document.getElementById('total-page-text').innerText = totalPages.toLocaleString();
            document.getElementById('total-rows-text').innerText = `(총 ${totalItems.toLocaleString()}건)`;

            document.getElementById('btn-first-page').disabled = (currentPage === 1);
            document.getElementById('btn-prev-page').disabled = (currentPage === 1);
            document.getElementById('btn-next-page').disabled = (currentPage === totalPages || totalPages === 0);
            document.getElementById('btn-last-page').disabled = (currentPage === totalPages || totalPages === 0);
        }

        function handlePageInput(val) {
            let page = parseInt(val, 10);
            if (isNaN(page)) page = 1;
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            
            currentPage = page;
            renderDetailTable();
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderDetailTable();
        }

        function changeRowsPerPage() {
            rowsPerPage = parseInt(document.getElementById('rows-per-page').value, 10);
            currentPage = 1;
            renderDetailTable();
        }

        function exportToExcel() {
            if (!currentDetailOrders || currentDetailOrders.length === 0) return alert("저장할 데이터가 없습니다.");
            const exportData = currentDetailOrders.map(row => ({
                '점포코드': cleanCode(row.store_code), '점포명': row.store_name || '-',
                '센터명': row.distribution_center || row.center_name || '-',
                '주문일자': formatDisplayDate(row.order_date), '배송일자': formatDisplayDate(row.delivery_date),
                '품목코드': cleanCode(row.item_code), '품목명': row.item_name || '-',
                '수량': cleanNumber(row.qty), '단가': cleanNumber(row.price),
                '금액': cleanNumber(row.total_amount) || (cleanNumber(row.qty) * cleanNumber(row.price))
            }));
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "주문상세");
            XLSX.writeFile(wb, `OMS주문상세_${document.getElementById('chart-start-date').value}_${document.getElementById('chart-end-date').value}.xlsx`);
        }

        /* ⚡ 초기 실행 */
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const past7 = new Date(); past7.setDate(today.getDate() - 7);

            const initialStartDate = localStorage.getItem('cached_chart_start_date') || formatDate(past7);
            const initialEndDate = localStorage.getItem('cached_chart_end_date') || formatDate(today);

            document.getElementById('chart-start-date').value = initialStartDate;
            document.getElementById('chart-end-date').value = initialEndDate;
            
            validateDates('start');

            document.getElementById('sync-target-date').value = formatDate(today);
            document.getElementById('chart-brand-input').value = localStorage.getItem('cached_brand_input') || '';
            document.getElementById('chart-item-input').value = localStorage.getItem('cached_item_input') || '';

            document.getElementById('calendar-month-picker').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, '0')}`;

            const cachedLastUpdated = localStorage.getItem('cached_last_updated');
            if (cachedLastUpdated) document.getElementById('last-updated-text').innerText = `🕒 최신 배송일자: ${cachedLastUpdated}`;

            loadCalendarData();
            fetchAllDashboardData();
        });

        async function triggerBot() {
            const btn = document.getElementById('run-btn');
            const targetDateVal = document.getElementById('sync-target-date').value.replace(/-/g, '/');

            if (!targetDateVal) return alert("수동 동기화할 일자를 선택하세요.");

            btn.disabled = true; btn.innerText = "🔄 동기화 중...";

            try {
                const res = await fetch(`https://api.github.com/repos/${githubId}/${repoName}/actions/workflows/capture.yml/dispatches`, {
                    method: 'POST',
                    headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ ref: 'main', inputs: { start_date: targetDateVal, end_date: targetDateVal } })
                });

                if (res.ok) {
                    alert(`✅ [${targetDateVal}] OMS 데이터 동기화 요청 완료!`);
                    setTimeout(async () => { 
                        try {
                            const db = await openIndexedDB();
                            db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).clear();

                            await fetch(`${SUPABASE_URL}/rest/v1/rpc/refresh_daily_summary`, {
                                method: 'POST',
                                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                            });
                            await fetch(`${SUPABASE_URL}/rest/v1/rpc/refresh_store_summary`, {
                                method: 'POST',
                                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                            });
                        } catch(e) {}
                        
                        btn.disabled = false; 
                        btn.innerText = "🚀 OMS 수동 동기화"; 
                        loadCalendarData();
                        fetchAllDashboardData(); 
                    }, 35000);
                } else {
                    alert("❌ 동기화 요청 실패"); btn.disabled = false; btn.innerText = "🚀 OMS 수동 동기화";
                }
            } catch (err) {
                alert("❌ 네트워크 오류"); btn.disabled = false; btn.innerText = "🚀 OMS 수동 동기화";
            }
        }
    </script>
</body>
