<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>더본 OMS 주문 실시간 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --navy-header: #1a233a;
            --bg-body: #f4f6f9;
        }
        body { background-color: var(--bg-body); font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; }
        
        /* 상단 원본 네이비 바 */
        .top-navbar { background-color: var(--navy-header); color: #fff; padding: 12px 20px; }
        .badge-sync { background-color: #00c853; color: #fff; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
        
        /* 메인 컨테이너 */
        .main-container { padding: 20px; max-width: 100%; }
        
        /* 카드 디자인 */
        .card-custom { background: #ffffff; border-radius: 10px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.04); padding: 18px; margin-bottom: 16px; }
        .summary-card { border-left: 4px solid #0d6efd; }
        .summary-card-purple { border-left: 4px solid #6f42c1; }
        
        /* 요약 데이터 폰트 */
        .summary-label { font-size: 13px; color: #6c757d; font-weight: 600; }
        .summary-val { font-size: 22px; font-weight: 800; color: #212529; }
        
        /* 테이블 스타일 */
        .table-responsive { width: 100% !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
        .table th { background-color: #f8f9fa; font-size: 13px; font-weight: 700; color: #495057; }
        .table td { font-size: 13px; vertical-align: middle; }
        .badge-center { background-color: #e3f2fd; color: #0d6efd; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
        
        /* 모달 다중 선택 전용 스타일 */
        .multi-select-list { max-height: 320px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 8px; padding: 8px; }
        .multi-select-item { padding: 6px 10px; border-bottom: 1px solid #f1f3f5; display: flex; align-items: center; gap: 8px; }
        .multi-select-item:hover { background-color: #f8f9fa; }

        /* 🗓️ 캘린더 날짜 셀 스타일 (수량 뱃지 포함) */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calendar-day-cell { min-height: 54px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; border: 1px solid #e9ecef; border-radius: 6px; background: #fff; }
        .calendar-day-cell:hover { background-color: #f8f9fa; border-color: #0d6efd; }
        .badge-qty-exist { background-color: #e3f2fd; color: #0d6efd; font-weight: 700; font-size: 11px; padding: 2px 4px; border-radius: 4px; width: 100%; text-align: center; }
        .badge-qty-empty { background-color: #f1f3f5; color: #adb5bd; font-size: 11px; padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 1. 원본 상단 네이비 바 -->
    <div class="top-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="d-flex align-items-center gap-2">
            <span class="fs-5 fw-bold">📦 더본 OMS 주문 실시간 대시보드</span>
            <span class="badge-sync">v24.0 Fully Synchronized</span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-light" onclick="openCalendarModal()">🗓️ 캘린더</button>
        </div>
    </div>

    <!-- 2. 메인 컨테이너 -->
    <div class="main-container">

        <!-- 조회 필터 카드 -->
        <div class="card-custom">
            <div class="row g-2 align-items-end">
                <div class="col-md-2 col-6">
                    <label class="form-label small fw-bold text-secondary mb-1">시작 배송일자</label>
                    <input type="date" id="startDate" class="form-control form-control-sm" onchange="validateDates()">
                </div>
                <div class="col-md-2 col-6">
                    <label class="form-label small fw-bold text-secondary mb-1">종료 배송일자</label>
                    <input type="date" id="endDate" class="form-control form-control-sm" onchange="validateDates()">
                </div>
                <div class="col-md-2 col-12">
                    <label class="form-label small fw-bold text-secondary mb-1">물류센터</label>
                    <select id="centerFilter" class="form-select form-select-sm">
                        <option value="">전체 물류센터</option>
                    </select>
                </div>
                <div class="col-md-2 col-6">
                    <label class="form-label small fw-bold text-secondary mb-1">브랜드 필터</label>
                    <button class="btn btn-outline-secondary btn-sm w-100 text-truncate" onclick="openBrandModal()" id="btnBrandSelect">🏢 전체 브랜드</button>
                </div>
                <div class="col-md-2 col-6">
                    <label class="form-label small fw-bold text-secondary mb-1">품목 필터</label>
                    <button class="btn btn-outline-secondary btn-sm w-100 text-truncate" onclick="openItemModal()" id="btnItemSelect">📦 전체 품목</button>
                </div>
                <div class="col-md-2 col-12">
                    <button class="btn btn-primary btn-sm w-100 fw-bold" onclick="loadDashboardData()">조회</button>
                </div>
            </div>
        </div>

        <!-- 핵심 상단 수치 요약 -->
        <div class="row g-3 mb-3">
            <div class="col-md-4 col-4">
                <div class="card-custom summary-card mb-0">
                    <div class="summary-label">기간 내 총 주문수량</div>
                    <div id="totalQty" class="summary-val text-primary">0 건</div>
                </div>
            </div>
            <div class="col-md-4 col-4">
                <div class="card-custom summary-card mb-0">
                    <div class="summary-label">기간 내 총 주문건수</div>
                    <div id="totalCount" class="summary-val text-dark">0 건</div>
                </div>
            </div>
            <div class="col-md-4 col-4">
                <div class="card-custom summary-card-purple mb-0">
                    <div class="summary-label">기간 내 총 주문금액</div>
                    <div id="totalAmount" class="summary-val text-purple">0 원</div>
                </div>
            </div>
        </div>

        <!-- 주문 데이터 리스트 테이블 -->
        <div class="card-custom p-0 overflow-hidden">
            <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
                <h6 class="fw-bold m-0">📊 기간 내 점포 주문 합산 상세</h6>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>배송일자</th>
                            <th>브랜드</th>
                            <th>점포명(코드)</th>
                            <th class="text-center">센터명</th>
                            <th>품목코드</th>
                            <th>품목명</th>
                            <th class="text-end">수량</th>
                            <th class="text-end">단가</th>
                            <th class="text-end">금액</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody">
                        <tr><td colspan="9" class="text-center py-4 text-muted">조회할 날짜를 지정 후 조회를 눌러주세요.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 🏢 브랜드 다중 선택 모달 -->
    <div class="modal fade" id="brandModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h6 class="modal-title fw-bold">🏢 브랜드 다중 선택</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="input-group input-group-sm mb-2">
                        <input type="text" id="brandSearchKeyword" class="form-control" placeholder="브랜드명 검색" onkeyup="filterBrandList()">
                        <button class="btn btn-outline-dark" onclick="toggleAllBrands(true)">전체선택</button>
                        <button class="btn btn-outline-secondary" onclick="toggleAllBrands(false)">해제</button>
                    </div>
                    <div class="multi-select-list" id="brandContainer"></div>
                </div>
                <div class="modal-footer py-2">
                    <button class="btn btn-primary btn-sm w-100" data-bs-dismiss="modal" onclick="applyFilterAndRender()">적용하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 📦 품목 다중 선택 모달 -->
    <div class="modal fade" id="itemModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h6 class="modal-title fw-bold">📦 품목 다중 선택</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="input-group input-group-sm mb-2">
                        <input type="text" id="itemSearchKeyword" class="form-control" placeholder="품목명/코드 검색" onkeyup="filterItemList()">
                        <button class="btn btn-outline-dark" onclick="toggleAllItems(true)">전체선택</button>
                        <button class="btn btn-outline-secondary" onclick="toggleAllItems(false)">해제</button>
                    </div>
                    <div class="multi-select-list" id="itemContainer"></div>
                </div>
                <div class="modal-footer py-2">
                    <button class="btn btn-primary btn-sm w-100" data-bs-dismiss="modal" onclick="applyFilterAndRender()">적용하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🗓️ 수량 정보 포함 캘린더 모달 -->
    <div class="modal fade" id="calendarModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h6 class="modal-title fw-bold">🗓️ 배송일자 데이터 존재 및 수량 현황</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <label class="fw-bold small">월 선택:</label>
                        <input type="month" id="calendarMonthPicker" class="form-control form-control-sm w-auto" onchange="renderCalendarWithQty(this.value)">
                    </div>
                    <div class="row text-center fw-bold small text-secondary mb-2 g-0">
                        <div class="col">일</div><div class="col">월</div><div class="col">화</div><div class="col">수</div><div class="col">목</div><div class="col">금</div><div class="col">토</div>
                    </div>
                    <div class="calendar-grid" id="calendarGridContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const SUPABASE_URL = "https://zbilhsgfgyfrolveaego.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN";

        let currentOrdersData = [];
        let selectedBrands = new Set();
        let selectedItems = new Set();
        let brandModalObj, itemModalObj, calendarModalObj;

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = today;

            brandModalObj = new bootstrap.Modal(document.getElementById('brandModal'));
            itemModalObj = new bootstrap.Modal(document.getElementById('itemModal'));
            calendarModalObj = new bootstrap.Modal(document.getElementById('calendarModal'));

            loadDashboardData();
        };

        function validateDates() {
            const sDate = document.getElementById('startDate').value;
            const eDate = document.getElementById('endDate').value;
            if (sDate && eDate && sDate > eDate) {
                alert("⚠️ 종료 배송일자는 시작 배송일자보다 이전 일자일 수 없습니다.");
                document.getElementById('endDate').value = sDate;
                return false;
            }
            return true;
        }

        async function fetchAllOrdersInChunksForRange(startDate, endDate) {
            let allData = [];
            let page = 0;
            const pageSize = 1000;
            let hasMore = true;

            const sDate = startDate.replace(/\//g, '-');
            const eDate = endDate.replace(/\//g, '-');

            while (hasMore) {
                const selectCols = "order_date,delivery_date,store_code,store_name,brand_name,distribution_center,item_code,item_name,qty,price,total_amount";
                const url = `${SUPABASE_URL}/rest/v1/oms_orders?select=${selectCols}&delivery_date=gte.${sDate}&delivery_date=lte.${eDate}&order=delivery_date.desc`;

                const res = await fetch(url, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Range': `${page * pageSize}-${(page + 1) * pageSize - 1}` }
                });
                if (!res.ok) break;
                const data = await res.json();
                allData = allData.concat(data);
                if (data.length < pageSize) hasMore = false; else page++;
            }
            return allData;
        }

        async function loadDashboardData() {
            if (!validateDates()) return;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            if (!startDate || !endDate) return;

            document.getElementById('orderTableBody').innerHTML = '<tr><td colspan="9" class="text-center py-4">⏳ 데이터 불러오는 중...</td></tr>';
            currentOrdersData = await fetchAllOrdersInChunksForRange(startDate, endDate);
            
            initFilters();
            applyFilterAndRender();
        }

        function initFilters() {
            const centerSelect = document.getElementById('centerFilter');
            const centers = new Set(), brands = new Set(), items = new Map();

            currentOrdersData.forEach(r => {
                const c = (r.distribution_center || r.center_name || '').trim();
                if (c) centers.add(c);
                const b = (r.brand_name || '').trim();
                if (b) brands.add(b);
                const iCode = (r.item_code || '').trim(), iName = (r.item_name || '').trim();
                if (iCode || iName) items.set(iCode || iName, `[${iCode}] ${iName}`);
            });

            centerSelect.innerHTML = '<option value="">전체 물류센터</option>';
            Array.from(centers).sort().forEach(c => centerSelect.innerHTML += `<option value="${c}">${c}</option>`);

            selectedBrands = new Set(brands);
            renderBrandCheckboxes(Array.from(brands).sort());

            selectedItems = new Set(items.keys());
            renderItemCheckboxes(Array.from(items.entries()).sort());
        }

        /* 🏢 브랜드 선택 기능 */
        function openBrandModal() { brandModalObj.show(); }
        function renderBrandCheckboxes(list) {
            document.getElementById('brandContainer').innerHTML = list.map(b => `
                <div class="multi-select-item">
                    <input type="checkbox" class="form-check-input brand-chk" value="${b}" id="chk_b_${b}" ${selectedBrands.has(b) ? 'checked' : ''} onchange="onBrandChkChange('${b}', this.checked)">
                    <label class="form-check-label w-100" for="chk_b_${b}">${b}</label>
                </div>`).join('');
        }
        function onBrandChkChange(b, checked) {
            if (checked) selectedBrands.add(b); else selectedBrands.delete(b);
            updateBrandBtnText();
        }
        function toggleAllBrands(checked) {
            document.querySelectorAll('.brand-chk').forEach(c => { c.checked = checked; if (checked) selectedBrands.add(c.value); else selectedBrands.delete(c.value); });
            updateBrandBtnText();
        }
        function filterBrandList() {
            const kw = document.getElementById('brandSearchKeyword').value.toLowerCase();
            document.querySelectorAll('#brandContainer .multi-select-item').forEach(el => el.style.display = el.textContent.toLowerCase().includes(kw) ? 'flex' : 'none');
        }
        function updateBrandBtnText() {
            document.getElementById('btnBrandSelect').textContent = selectedBrands.size === 0 ? '🏢 브랜드 선택 없음' : `🏢 브랜드 (${selectedBrands.size}개 선택)`;
        }

        /* 📦 품목 다중 선택 기능 */
        function openItemModal() { itemModalObj.show(); }
        function renderItemCheckboxes(list) {
            document.getElementById('itemContainer').innerHTML = list.map(([k, label]) => `
                <div class="multi-select-item">
                    <input type="checkbox" class="form-check-input item-chk" value="${k}" id="chk_i_${k}" ${selectedItems.has(k) ? 'checked' : ''} onchange="onItemChkChange('${k}', this.checked)">
                    <label class="form-check-label w-100" for="chk_i_${k}">${label}</label>
                </div>`).join('');
        }
        function onItemChkChange(k, checked) {
            if (checked) selectedItems.add(k); else selectedItems.delete(k);
            updateItemBtnText();
        }
        function toggleAllItems(checked) {
            document.querySelectorAll('.item-chk').forEach(c => { c.checked = checked; if (checked) selectedItems.add(c.value); else selectedItems.delete(c.value); });
            updateItemBtnText();
        }
        function filterItemList() {
            const kw = document.getElementById('itemSearchKeyword').value.toLowerCase();
            document.querySelectorAll('#itemContainer .multi-select-item').forEach(el => el.style.display = el.textContent.toLowerCase().includes(kw) ? 'flex' : 'none');
        }
        function updateItemBtnText() {
            document.getElementById('btnItemSelect').textContent = selectedItems.size === 0 ? '📦 품목 선택 없음' : `📦 품목 (${selectedItems.size}개 선택)`;
        }

        /* 🗓️ 수량 정보 포함 캘린더 모달 기능 */
        function openCalendarModal() {
            const ym = document.getElementById('startDate').value.slice(0, 7);
            document.getElementById('calendarMonthPicker').value = ym;
            calendarModalObj.show();
            renderCalendarWithQty(ym);
        }

        async function renderCalendarWithQty(yearMonthStr) {
            const [y, m] = yearMonthStr.split('-');
            const startOfMonth = `${y}-${m}-01`;
            const lastDay = new Date(y, m, 0).getDate();
            const endOfMonth = `${y}-${m}-${String(lastDay).padStart(2, '0')}`;
            const grid = document.getElementById('calendarGridContainer');
            grid.innerHTML = '<div class="text-center py-4 w-100">⏳ 날짜별 수량 집계 중...</div>';

            const url = `${SUPABASE_URL}/rest/v1/oms_orders?select=delivery_date,qty&delivery_date=gte.${startOfMonth}&delivery_date=lte.${endOfMonth}`;
            let data = [];
            try {
                const res = await fetch(url, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                if (res.ok) data = await res.json();
            } catch (e) {}

            const qtyMap = {};
            data.forEach(r => { if (r.delivery_date) qtyMap[r.delivery_date] = (qtyMap[r.delivery_date] || 0) + Number(r.qty || 0); });

            grid.innerHTML = '';
            const firstDayIdx = new Date(y, m - 1, 1).getDay();
            for (let i = 0; i < firstDayIdx; i++) grid.appendChild(document.createElement('div'));

            for (let d = 1; d <= lastDay; d++) {
                const dStr = String(d).padStart(2, '0');
                const fDate = `${y}-${m}-${dStr}`;
                const q = qtyMap[fDate] || 0;
                const cell = document.createElement('div');
                cell.className = 'calendar-day-cell';
                cell.innerHTML = `<div class="fw-bold small">${d}</div>${q > 0 ? `<span class="badge-qty-exist">${q.toLocaleString()}개</span>` : `<span class="badge-qty-empty">없음</span>`}`;
                cell.onclick = () => {
                    document.getElementById('startDate').value = fDate;
                    document.getElementById('endDate').value = fDate;
                    calendarModalObj.hide();
                    loadDashboardData();
                };
                grid.appendChild(cell);
            }
        }

        /* 테이블 적용 렌더링 */
        function applyFilterAndRender() {
            const selectedCenter = document.getElementById('centerFilter').value;
            const filtered = currentOrdersData.filter(row => {
                const cName = (row.distribution_center || row.center_name || '').trim();
                const bName = (row.brand_name || '').trim();
                const iKey = (row.item_code || row.item_name || '').trim();

                const centerMatch = !selectedCenter || cName === selectedCenter;
                const brandMatch = selectedBrands.has(bName);
                const itemMatch = selectedItems.has(iKey) || selectedItems.has(row.item_code) || selectedItems.has(row.item_name);
                return centerMatch && brandMatch && itemMatch;
            });
            renderDashboard(filtered);
        }

        document.getElementById('centerFilter').addEventListener('change', applyFilterAndRender);

        function renderDashboard(dataList) {
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '';
            let totalQty = 0, totalAmount = 0;

            if (dataList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted">선택 조건에 맞는 데이터가 없습니다.</td></tr>';
            } else {
                dataList.forEach(row => {
                    const qty = Number(row.qty || 0), amount = Number(row.total_amount || 0);
                    totalQty += qty; totalAmount += amount;
                    const centerName = (row.distribution_center || row.center_name || '').trim() || '-';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.delivery_date || '-'}</td>
                        <td>${row.brand_name || '-'}</td>
                        <td><strong>${row.store_name || '-'}</strong> <span class="text-muted small">(${row.store_code || ''})</span></td>
                        <td class="text-center"><span class="badge-center">${centerName}</span></td>
                        <td class="font-monospace">${row.item_code || '-'}</td>
                        <td>${row.item_name || '-'}</td>
                        <td class="text-end fw-bold">${qty.toLocaleString()}</td>
                        <td class="text-end">${Number(row.price || 0).toLocaleString()}원</td>
                        <td class="text-end fw-bold text-success">${amount.toLocaleString()}원</td>`;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('totalCount').textContent = `${dataList.length.toLocaleString()} 건`;
            document.getElementById('totalQty').textContent = `${totalQty.toLocaleString()} 개`;
            document.getElementById('totalAmount').textContent = `${totalAmount.toLocaleString()} 원`;
        }
    </script>
</body>
</html>
