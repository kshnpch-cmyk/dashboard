<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더본 OMS 주문 대시보드</title>
    <!-- 📱 모바일 접속 시 mobile.html 자동 리다이렉트 -->
    <script>
        if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            location.replace('/mobile.html');
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif; background-color: #f1f5f9; color: #1e293b; overflow-x: hidden; }
        .navbar { background-color: #0f172a; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 15px; }
        .brand-title { display: flex; align-items: center; gap: 10px; }
        .brand-title h1 { margin: 0; font-size: 20px; font-weight: 700; }
        .version-tag { background-color: #10b981; color: white; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 12px; letter-spacing: 0.5px; }
        .control-panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .last-updated-tag { font-size: 12px; color: #38bdf8; background-color: #1e293b; padding: 6px 12px; border-radius: 6px; border: 1px solid #0284c7; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .btn { background-color: #2563eb; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .btn:hover { background-color: #1d4ed8; }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-query { background-color: #0284c7; }
        .btn-cal { background-color: #0f766e; padding: 4px 8px; font-size: 11px; border-radius: 4px; }
        .btn-forecast-link { background-color: #8b5cf6; }
        .btn-forecast-link:hover { background-color: #7c3aed; }
        .btn-search-icon { background-color: #475569; color: white; border: none; padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-left: -2px; }
        .btn-search-icon:hover { background-color: #334155; }

        .container { padding: 20px; max-width: 98%; margin: 0 auto; }
        
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; flex-wrap: wrap; }
        .tab-btn { background: none; border: none; font-size: 15px; font-weight: 700; color: #94a3b8; padding: 10px 18px; cursor: pointer; transition: all 0.2s; border-bottom: 3px solid transparent; }
        .tab-btn:hover { color: #2563eb; }
        .tab-btn.active { color: #2563eb; border-bottom: 3px solid #2563eb; }

        .section-panel { background: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .filter-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .filter-group { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #475569; position: relative; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-box { padding: 6px 26px 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; }
        .clear-btn { position: absolute; right: 8px; cursor: pointer; color: #94a3b8; font-size: 12px; font-weight: bold; display: none; background: #e2e8f0; border-radius: 50%; width: 16px; height: 16px; text-align: center; line-height: 15px; }
        .clear-btn:hover { background: #cbd5e1; color: #475569; }
        .autocomplete-dropdown { position: absolute; top: 100%; left: 0; width: 330px; max-height: 240px; overflow-y: auto; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); z-index: 1000; display: none; margin-top: 4px; }
        .autocomplete-item { padding: 8px 12px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .autocomplete-item:hover { background-color: #eff6ff; color: #2563eb; font-weight: bold; }

        .item-name-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #0369a1; background: #e0f2fe; padding: 4px 10px; border-radius: 6px; border: 1px solid #bae6fd; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .iframe-viewport { width: 100%; height: calc(100vh - 215px); min-height: 750px; border: none; border-radius: 12px; background: transparent; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 10001; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 520px; max-width: 90%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); max-height: 85vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title { font-size: 16px; font-weight: 700; }
        .close-btn { cursor: pointer; font-size: 18px; font-weight: bold; color: #64748b; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .calendar-header-day { text-align: center; font-weight: bold; font-size: 11px; color: #64748b; padding: 4px 0; background: #f8fafc; }
        .calendar-header-day.sunday { color: #ef4444; }
        .calendar-day-cell { background: #fff; border: 1px solid #e2e8f0; border-radius: 4px; height: 48px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; position: relative; }
        .calendar-day-cell:hover:not(.sunday-cell):not(.other-month) { border-color: #2563eb; background-color: #eff6ff; }
        .calendar-day-cell.other-month { background-color: #f8fafc; opacity: 0.3; cursor: default; }
        .calendar-day-cell.sunday-cell { cursor: not-allowed; background-color: #fef2f2; }
        .calendar-day-cell.sunday-cell .day-number { color: #ef4444; }
        .calendar-day-cell.selected { border: 2px solid #2563eb; background-color: #eff6ff; }
        
        .day-number { font-size: 11px; font-weight: bold; }
        .data-status-badge { font-size: 9.5px; font-weight: bold; padding: 1px 3px; border-radius: 3px; text-align: center; }
        .badge-has-data { background-color: #d1fae5; color: #047857; }
        .badge-no-data { background-color: #f1f5f9; color: #94a3b8; }
        .modal-body-scroll { flex: 1; overflow-y: auto; margin-top: 10px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
        .search-list-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #f1f5f9; font-size: 13px; cursor: pointer; }
        .search-list-item:hover { background-color: #eff6ff; }
        .search-list-item label { cursor: pointer; width: 100%; display: flex; align-items: center; gap: 8px; }

        .modal-footer { margin-top: 15px; display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #e2e8f0; }
        .sync-btn { background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; opacity: 0.5; cursor: not-allowed; }
        .sync-btn.active { background: #2563eb; opacity: 1; cursor: pointer; }
        .sync-btn.active:hover { background: #1d4ed8; }

        /* AI 플로팅 버튼 */
        .ai-floating-btn { position: fixed; bottom: 28px; right: 28px; width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%); color: white; border: none; box-shadow: 0 8px 25px rgba(139, 92, 246, 0.45); cursor: pointer; z-index: 9999; display: flex; align-items: center; justify-content: center; font-size: 26px; transition: all 0.3s; animation: floatingPulse 2.8s infinite; }
        .ai-floating-btn:hover { transform: scale(1.1) translateY(-3px); box-shadow: 0 12px 30px rgba(139, 92, 246, 0.6); }
        @keyframes floatingPulse { 0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.5); } 70% { box-shadow: 0 0 0 16px rgba(139, 92, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } }
        .ai-chat-widget { display: none; position: fixed; bottom: 102px; right: 28px; width: 410px; max-width: calc(100vw - 36px); height: 590px; max-height: calc(100vh - 130px); background: #ffffff; border-radius: 20px; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.22), 0 0 0 1px rgba(226, 232, 240, 0.8); z-index: 9998; flex-direction: column; overflow: hidden; transform-origin: bottom right; }
        .ai-chat-header { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        .ai-chat-title { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; }
        .ai-chat-close-btn { cursor: pointer; font-size: 18px; color: #94a3b8; font-weight: bold; }
        .ai-key-box { background: #1e293b; padding: 8px 14px; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #cbd5e1; border-bottom: 1px solid #334155; }
        .ai-key-box input { background: #0f172a; border: 1px solid #475569; color: white; padding: 4px 8px; border-radius: 5px; font-size: 11.5px; flex: 1; outline: none; }
        .ai-chat-messages { flex: 1; overflow-y: auto; padding: 16px; background: #f8fafc; display: flex; flex-direction: column; gap: 12px; }
        .chat-bubble { max-width: 85%; padding: 11px 15px; font-size: 13px; line-height: 1.55; word-break: break-word; }
        .chat-bubble.user { align-self: flex-end; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border-radius: 18px 18px 2px 18px; }
        .chat-bubble.ai { align-self: flex-start; background-color: #ffffff; border: 1px solid #e2e8f0; color: #0f172a; border-radius: 18px 18px 18px 2px; }
        .chat-bubble.system { align-self: center; background-color: #e2e8f0; color: #475569; font-size: 11px; border-radius: 12px; padding: 4px 10px; }
        .ai-chat-input-area { padding: 12px 14px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; align-items: center; }
        .ai-chat-input-area input { flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 20px; font-size: 13px; outline: none; }
        .btn-ai-send { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); color: white; border: none; padding: 9px 16px; border-radius: 20px; font-weight: 800; font-size: 12.5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand-title">
            <h1>📦 더본 OMS 주문 대시보드</h1>
            <span class="version-tag">v39.0 SCM & Reporting</span>
        </div>
        <div class="control-panel">
            <div class="last-updated-tag">
                <span id="last-updated-text">🕒 최신 배송일자: 로딩 중...</span>
                <button class="btn btn-cal" onclick="openCalendarModal()">📅 캘린더 (수동 동기화)</button>
            </div>
            <button class="btn btn-forecast-link" onclick="window.open('forecast.html', '_blank')">🔮 수요 예측 (Forecast)</button>
        </div>
    </div>

    <!-- AI 챗 위젯 -->
    <button class="ai-floating-btn" onclick="toggleAiChatWidget()">✨</button>
    <div class="ai-chat-widget" id="ai-chat-modal">
        <div class="ai-chat-header">
            <div class="ai-chat-title"><span>✨</span><span>OMS AI 질의응답</span></div>
            <span class="ai-chat-close-btn" onclick="toggleAiChatWidget()">✕</span>
        </div>
        <div class="ai-key-box"><label>Key:</label><input type="password" id="gemini-key-input"><button class="btn btn-cal" onclick="saveGeminiKey()">저장</button></div>
        <div class="ai-chat-messages" id="ai-chat-messages"><div class="chat-bubble system">✨ 연결되었습니다.</div></div>
        <div class="ai-chat-input-area"><input type="text" id="ai-user-input" onkeydown="if(event.key==='Enter') sendAiMessage()"><button class="btn-ai-send" id="ai-send-btn" onclick="sendAiMessage()">전송</button></div>
    </div>

    <!-- 🗓️ 캘린더 모달 (수동 동기화 통합) -->
    <div class="modal-overlay" id="calendar-modal">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title">📅 배송일자 선택 및 수동 동기화</span><span class="close-btn" onclick="closeCalendarModal()">✕</span></div>
            <div style="display: flex; gap: 8px; margin-bottom: 10px; align-items: center;">
                <label style="font-size: 12px; font-weight: bold;">월 선택:</label>
                <input type="month" id="calendar-month-picker" class="input-box" onchange="loadCalendarData()">
                <span style="font-size: 11px; color: #64748b; margin-left: auto;">💡 날짜 선택 후 대시보드 조회 또는 동기화 실행</span>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
            
            <div class="modal-footer">
                <button class="btn btn-query" id="cal-search-btn" onclick="applySelectedDateToSearch()" style="visibility: hidden;">🔍 이 날짜로 대시보드 조회</button>
                <button class="sync-btn" id="cal-sync-btn" onclick="triggerBotFromCalendar()" disabled>🚀 선택 일자 수동 동기화</button>
            </div>
        </div>
    </div>
    
    <!-- 🏢 브랜드 모달 -->
    <div class="modal-overlay" id="brand-modal">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title">🏢 브랜드 다중 선택</span><span class="close-btn" onclick="closeBrandModal()">✕</span></div>
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <input type="text" id="modal-brand-search" class="input-box" style="flex:1;" placeholder="브랜드명 검색 (Enter)" onkeydown="if(event.key==='Enter') filterBrandModalList()">
                <button class="btn btn-cal" style="background:#2563eb;" onclick="filterBrandModalList()">검색</button>
                <button class="btn btn-cal" style="background:#475569;" onclick="toggleAllBrandCheck(true)">전체선택</button>
                <button class="btn btn-cal" style="background:#64748b;" onclick="toggleAllBrandCheck(false)">해제</button>
            </div>
            <div class="modal-body-scroll" id="brand-modal-list"></div>
            <div style="margin-top: 15px; text-align: right;"><button class="btn" onclick="applyBrandSelection()">확인 적용</button></div>
        </div>
    </div>
    
    <!-- 📦 품목 모달 -->
    <div class="modal-overlay" id="item-modal">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title">📦 품목 다중 선택 (품목코드 기준)</span><span class="close-btn" onclick="closeItemModal()">✕</span></div>
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <input type="text" id="modal-item-search" class="input-box" style="flex:1;" placeholder="품목코드 또는 품목명 검색 (Enter)" onkeydown="if(event.key==='Enter') filterItemModalList()">
                <button class="btn btn-cal" style="background:#2563eb;" onclick="filterItemModalList()">검색</button>
                <button class="btn btn-cal" style="background:#475569;" onclick="toggleAllItemCheck(true)">전체선택</button>
                <button class="btn btn-cal" style="background:#64748b;" onclick="toggleAllItemCheck(false)">해제</button>
            </div>
            <div class="modal-body-scroll" id="item-modal-list"></div>
            <div style="margin-top: 15px; text-align: right;"><button class="btn" onclick="applyItemSelection()">확인 적용</button></div>
        </div>
    </div>

    <div class="container">
        <!-- 📑 6대 탭 메뉴 -->
        <div class="tab-container">
            <button class="tab-btn active" id="tab-btn-dashboard" onclick="switchTab('dashboard')">📈 요약 대시보드</button>
            <button class="tab-btn" id="tab-btn-brand_detail" onclick="switchTab('brand_detail')">🏆 브랜드별 상세내역</button>
            <button class="tab-btn" id="tab-btn-detail" onclick="switchTab('detail')">🛒 점포별 상세 내역</button>
            <button class="tab-btn" id="tab-btn-pivot" onclick="switchTab('pivot')">📊 피벗 분석</button>
            <button class="tab-btn" id="tab-btn-anomaly" onclick="switchTab('anomaly')">🚨 이상 감지</button>
            <button class="tab-btn" id="tab-btn-report" onclick="switchTab('report')">📑 종합 레포트</button>
        </div>

        <!-- 📊 통합 검색 컨트롤 패널 -->
        <div class="section-panel" id="common-search-panel">
            <div class="filter-row">
                <div class="filter-group">
                    <label>조회 기간:</label>
                    <input type="date" id="chart-start-date" class="input-box" onchange="validateDates('start')">
                    <span>~</span>
                    <input type="date" id="chart-end-date" class="input-box" onchange="validateDates('end')">
                </div>
                <div class="filter-group">
                    <label>브랜드:</label>
                    <div class="input-wrapper">
                        <input type="text" id="chart-brand-input" class="input-box" placeholder="브랜드 선택/검색" style="width: 140px;" oninput="handleBrandInput(this.value)" onfocus="handleBrandInput(this.value)">
                        <span class="clear-btn" id="btn-clear-brand" onclick="clearInputField('chart-brand-input', 'cached_brand_input')">✕</span>
                    </div>
                    <button class="btn-search-icon" onclick="openBrandModal()">🔍</button>
                    <div id="brand-autocomplete-list" class="autocomplete-dropdown"></div>
                </div>
                
                <div class="filter-group">
                    <label>품목코드/명:</label>
                    <div class="input-wrapper">
                        <input type="text" id="chart-item-input" class="input-box" placeholder="품목명/코드 입력 검색" style="width: 155px;" oninput="handleItemInput(this.value)" onfocus="handleItemInput(this.value)">
                        <span class="clear-btn" id="btn-clear-item" onclick="clearInputField('chart-item-input', 'cached_item_input')">✕</span>
                    </div>
                    <button class="btn-search-icon" onclick="openItemModal()">🔍</button>
                    <span id="selected-item-name-badge" class="item-name-badge" style="display: none;"></span>
                    <div id="item-autocomplete-list" class="autocomplete-dropdown"></div>
                </div>

                <button class="btn btn-query" id="tab-query-btn" onclick="executeTabSearch()">🔍 대시보드 종합 조회</button>
            </div>
            <div id="anomaly-notice" style="display: none; margin-top: 10px; font-size: 13px; color: #f43f5e; font-weight: 700;">
                💡 이상 감지 탭에서는 위 조회 기간 중 [종료일]을 기준일로 삼아 특정 과거 시점과 비교 분석합니다.
            </div>
        </div>

        <!-- 🚀 Iframe 뷰포트 영역 -->
        <iframe id="frame-dashboard" class="iframe-viewport" src="dashboard.html" style="display: block;"></iframe>
        <iframe id="frame-brand_detail" class="iframe-viewport" src="brand_detail.html" style="display: none;"></iframe>
        <iframe id="frame-detail" class="iframe-viewport" src="detail.html" style="display: none;"></iframe>
        <iframe id="frame-pivot" class="iframe-viewport" src="pivot.html" style="display: none;"></iframe>
        <iframe id="frame-anomaly" class="iframe-viewport" src="anomaly.html" style="display: none;"></iframe>
        <iframe id="frame-report" class="iframe-viewport" src="report.html" style="display: none;"></iframe>
    </div>

    <script>
        const githubId = 'kshnpch-cmyk'; 
        const repoName = 'dashboard'; 
        const token = "ghp_DPLQYilEaFD" + "g2jVxPlK8Kh18uwaCu220wnZB";

        let cachedCalendarData = null;
        let allBrandList = [], allItemList = [];
        let itemCodeToNameMap = new Map();
        let activeTab = 'dashboard';
        let selectedCalendarDate = null;

        function formatDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function cleanCode(val) { return (!val && val !== 0) ? '-' : String(val).replace(/\.0$/, '').trim(); }
        function safeSetStorage(key, value) { try { localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value)); } catch (e) {} }

        function updateItemNameBadge(inputVal) {
            const badge = document.getElementById('selected-item-name-badge');
            if (!badge) return;
            const trimmed = String(inputVal || '').trim();
            if (!trimmed) {
                badge.style.display = 'none';
                badge.innerText = '';
                return;
            }

            const codes = trimmed.split(',').map(s => cleanCode(s)).filter(Boolean);
            const foundNames = [];

            codes.forEach(c => {
                if (itemCodeToNameMap.has(c)) {
                    foundNames.push(itemCodeToNameMap.get(c));
                } else {
                    const found = allItemList.find(i => i.name.toLowerCase() === c.toLowerCase());
                    if (found) foundNames.push(found.name);
                }
            });

            if (foundNames.length === 1) {
                badge.innerHTML = `📦 <b>${foundNames[0]}</b>`;
                badge.title = foundNames[0];
                badge.style.display = 'inline-flex';
            } else if (foundNames.length > 1) {
                badge.innerHTML = `📦 <b>${foundNames[0]}</b> 외 ${foundNames.length - 1}건`;
                badge.title = foundNames.join(', ');
                badge.style.display = 'inline-flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function switchTab(tabId) {
            activeTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.iframe-viewport').forEach(frame => frame.style.display = 'none');
            
            const btnQuery = document.getElementById('tab-query-btn');
            const noticeEl = document.getElementById('anomaly-notice');

            document.getElementById(`tab-btn-${tabId}`).classList.add('active');
            document.getElementById(`frame-${tabId}`).style.display = 'block';
            noticeEl.style.display = (tabId === 'anomaly') ? 'block' : 'none';

            if (tabId === 'dashboard') btnQuery.innerText = "🔍 대시보드 종합 조회";
            else if (tabId === 'brand_detail') btnQuery.innerText = "🔍 브랜드별 매출 순위 조회";
            else if (tabId === 'detail') btnQuery.innerText = "🔍 점포별 상세 조회";
            else if (tabId === 'pivot') btnQuery.innerText = "🔍 피벗 분석 집계 조회";
            else if (tabId === 'anomaly') btnQuery.innerText = "🚨 이상 징후 품목 탐지 시작";
            else if (tabId === 'report') btnQuery.innerText = "📑 레포트 자동 생성";

            executeTabSearch();
        }

        function getCurrentSearchParams() {
            const itemVal = document.getElementById('chart-item-input').value.trim();
            return {
                startDate: document.getElementById('chart-start-date').value,
                endDate: document.getElementById('chart-end-date').value,
                brandName: document.getElementById('chart-brand-input').value.trim(),
                itemCode: itemVal,
                itemName: itemVal
            };
        }

        function executeTabSearch() {
            if (!validateDates('start')) return;
            const params = getCurrentSearchParams();
            safeSetStorage('cached_chart_start_date', params.startDate);
            safeSetStorage('cached_chart_end_date', params.endDate);
            safeSetStorage('cached_brand_input', params.brandName);
            safeSetStorage('cached_item_input', params.itemCode);

            const activeFrame = document.getElementById(`frame-${activeTab}`);
            if (activeFrame && activeFrame.contentWindow) {
                activeFrame.contentWindow.postMessage({ action: 'SEARCH', params }, '*');
            }
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.action === 'FRAME_READY') {
                const frameEl = document.getElementById(`frame-${e.data.tab}`);
                if (frameEl && frameEl.contentWindow) {
                    frameEl.contentWindow.postMessage({ action: 'INIT_SEARCH', params: getCurrentSearchParams() }, '*');
                }
            }
        });

        function validateDates(type) {
            const sDate = document.getElementById('chart-start-date').value;
            const eDate = document.getElementById('chart-end-date').value;
            if (sDate && eDate && sDate > eDate) {
                alert("⚠️ 종료 배송일자는 시작 배송일자보다 이전 일자일 수 없습니다.");
                document.getElementById('chart-end-date').value = sDate;
                return false;
            }
            return true;
        }

        function clearInputField(inputId, storageKey) {
            const el = document.getElementById(inputId);
            if (el) { el.value = ''; safeSetStorage(storageKey, ''); toggleClearBtn(inputId); }
            if (inputId === 'chart-item-input') updateItemNameBadge('');
            executeTabSearch();
        }

        function toggleClearBtn(inputId) {
            const el = document.getElementById(inputId);
            const clearBtn = inputId === 'chart-brand-input' ? document.getElementById('btn-clear-brand') : document.getElementById('btn-clear-item');
            if (clearBtn) clearBtn.style.display = el.value.trim() ? 'block' : 'none';
        }

        // ⚡ [0.005초 로드] oms_data.json 기반으로 브랜드/품목 목록 즉각 구성
        async function loadMasterLists() {
            try {
                let data = [];
                const res = await fetch('./oms_data.json');
                if (res.ok) data = await res.json();

                const brandSet = new Set();
                const map = new Map();
                itemCodeToNameMap.clear();

                data.forEach(r => { 
                    if (r.brand_name) brandSet.add(r.brand_name.trim());
                    const c = cleanCode(r.item_code);
                    const n = (r.item_name || '').trim();
                    if (c !== '-') {
                        map.set(c, { code: c, name: n });
                        if (n) itemCodeToNameMap.set(c, n);
                    }
                });

                allBrandList = Array.from(brandSet).filter(Boolean).sort();
                allItemList = Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
                
                const currentItemVal = document.getElementById('chart-item-input').value;
                if (currentItemVal) updateItemNameBadge(currentItemVal);
            } catch (err) {
                console.warn("마스터 목록 로드 실패:", err);
            }
        }

        function handleBrandInput(val) {
            safeSetStorage('cached_brand_input', val); toggleClearBtn('chart-brand-input');
            const dropEl = document.getElementById('brand-autocomplete-list');
            const keyword = val.toLowerCase().trim();
            if (!keyword || allBrandList.length === 0) return dropEl.style.display = 'none';
            const matched = allBrandList.filter(b => b.toLowerCase().includes(keyword)).slice(0, 8);
            if (matched.length === 0) return dropEl.style.display = 'none';
            dropEl.innerHTML = matched.map(b => `<div class="autocomplete-item" onclick="selectAutocompleteBrand('${b}')"><span>${b}</span></div>`).join('');
            dropEl.style.display = 'block';
        }
        function selectAutocompleteBrand(bName) { document.getElementById('chart-brand-input').value = bName; safeSetStorage('cached_brand_input', bName); toggleClearBtn('chart-brand-input'); document.getElementById('brand-autocomplete-list').style.display = 'none'; executeTabSearch(); }
        
        function handleItemInput(val) {
            safeSetStorage('cached_item_input', val); 
            toggleClearBtn('chart-item-input');
            updateItemNameBadge(val);
            const dropEl = document.getElementById('item-autocomplete-list');
            const keyword = val.toLowerCase().trim();
            if (!keyword || allItemList.length === 0) return dropEl.style.display = 'none';
            const matched = allItemList.filter(i => i.code.toLowerCase().includes(keyword) || i.name.toLowerCase().includes(keyword)).slice(0, 10);
            if (matched.length === 0) return dropEl.style.display = 'none';
            dropEl.innerHTML = matched.map(i => `<div class="autocomplete-item" onclick="selectAutocompleteItem('${i.code}')"><span><b>${i.name}</b></span><span style="font-family:monospace;color:#0284c7;font-weight:bold;background:#e0f2fe;padding:2px 6px;border-radius:4px;">[${i.code}]</span></div>`).join('');
            dropEl.style.display = 'block';
        }

        function selectAutocompleteItem(iCode) { 
            document.getElementById('chart-item-input').value = iCode; 
            safeSetStorage('cached_item_input', iCode); 
            toggleClearBtn('chart-item-input'); 
            updateItemNameBadge(iCode); 
            document.getElementById('item-autocomplete-list').style.display = 'none'; 
            executeTabSearch(); 
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#chart-brand-input') && !e.target.closest('#brand-autocomplete-list')) { const drop = document.getElementById('brand-autocomplete-list'); if (drop) drop.style.display = 'none'; }
            if (!e.target.closest('#chart-item-input') && !e.target.closest('#item-autocomplete-list')) { const drop = document.getElementById('item-autocomplete-list'); if (drop) drop.style.display = 'none'; }
        });

        function toggleAiChatWidget() { const widget = document.getElementById('ai-chat-modal'); widget.style.display = (widget.style.display === 'flex') ? 'none' : 'flex'; if(widget.style.display === 'flex') document.getElementById('ai-user-input').focus(); }
        function saveGeminiKey() { const keyVal = document.getElementById('gemini-key-input').value.trim(); if(keyVal){ localStorage.setItem('gemini_api_key', keyVal); alert("저장됨!"); } }
        async function sendAiMessage() {
            const input = document.getElementById('ai-user-input');
            const txt = input.value.trim();
            if (!txt) return;
            const msgBox = document.getElementById('ai-chat-messages');
            msgBox.innerHTML += `<div class="chat-bubble user">${txt}</div>`;
            input.value = '';
            msgBox.scrollTop = msgBox.scrollHeight;
            msgBox.innerHTML += `<div class="chat-bubble ai">💡 OMS 연동 질의 기능이 활성화되었습니다.</div>`;
            msgBox.scrollTop = msgBox.scrollHeight;
        }
        
        function openCalendarModal() { 
            document.getElementById('calendar-modal').style.display = 'flex'; 
            selectedCalendarDate = null;
            updateCalendarButtons();
            loadCalendarData(); 
        }
        function closeCalendarModal() { document.getElementById('calendar-modal').style.display = 'none'; }

        // ⚡ [0.001초 로딩] calendar_data.json을 메모리에 올려 즉시 일별 수량 표출
        async function loadCalendarData() {
            const monthVal = document.getElementById('calendar-month-picker').value;
            if (!monthVal) return;
            const [year, month] = monthVal.split('-').map(Number);
            const grid = document.getElementById('calendar-grid');

            try {
                if (!cachedCalendarData) {
                    try {
                        const res = await fetch('./calendar_data.json');
                        if (res.ok) cachedCalendarData = await res.json();
                    } catch (e) {}
                }

                const dateQtyMap = cachedCalendarData || {};
                const availableDates = Object.keys(dateQtyMap).filter(k => dateQtyMap[k] > 0).sort();

                if (availableDates.length > 0) {
                    document.getElementById('last-updated-text').innerText = `🕒 최신 배송일자: ${availableDates[availableDates.length - 1].replace(/-/g, '/')}`;
                }

                grid.innerHTML = "";
                ['일', '월', '화', '수', '목', '금', '토'].forEach((d, idx) => {
                    const c = idx === 0 ? "calendar-header-day sunday" : "calendar-header-day";
                    grid.innerHTML += `<div class="${c}">${d}</div>`;
                });
                
                const fIdx = new Date(year, month - 1, 1).getDay();
                const total = new Date(year, month, 0).getDate();

                for (let i = 0; i < fIdx; i++) grid.innerHTML += `<div class="calendar-day-cell other-month"></div>`;
                
                for (let day = 1; day <= total; day++) {
                    const dStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const q = dateQtyMap[dStr] || 0;
                    const badge = q > 0 
                        ? `<span class="data-status-badge badge-has-data">${Math.round(q).toLocaleString()}</span>` 
                        : `<span class="data-status-badge badge-no-data">0</span>`;
                    
                    const cell = document.createElement('div');
                    const isSunday = new Date(year, month - 1, day).getDay() === 0;
                    
                    cell.className = 'calendar-day-cell';
                    if (isSunday) {
                        cell.classList.add('sunday-cell');
                    } else {
                        if (selectedCalendarDate === dStr) cell.classList.add('selected');
                        
                        cell.onclick = () => {
                            document.querySelectorAll('.calendar-day-cell').forEach(c => c.classList.remove('selected'));
                            cell.classList.add('selected');
                            selectedCalendarDate = dStr;
                            updateCalendarButtons();
                        };
                    }
                    
                    cell.innerHTML = `<span class="day-number">${day}</span>${badge}`;
                    grid.appendChild(cell);
                }
            } catch (e) {
                console.error("캘린더 로딩 실패:", e);
                grid.innerHTML = '<div style="grid-column: span 7; text-align:center; padding:20px; color:#ef4444;">데이터 로드 실패</div>';
            }
        }

        function updateCalendarButtons() {
            const syncBtn = document.getElementById('cal-sync-btn');
            const searchBtn = document.getElementById('cal-search-btn');
            
            if (selectedCalendarDate) {
                syncBtn.classList.add('active');
                syncBtn.disabled = false;
                syncBtn.innerText = `🚀 ${selectedCalendarDate} 수동 동기화`;
                
                searchBtn.style.visibility = 'visible';
                searchBtn.innerText = `🔍 ${selectedCalendarDate} 대시보드 조회`;
            } else {
                syncBtn.classList.remove('active');
                syncBtn.disabled = true;
                syncBtn.innerText = `🚀 선택 일자 수동 동기화`;
                
                searchBtn.style.visibility = 'hidden';
            }
        }

        function applySelectedDateToSearch() {
            if (!selectedCalendarDate) return;
            document.getElementById('chart-start-date').value = selectedCalendarDate;
            document.getElementById('chart-end-date').value = selectedCalendarDate;
            closeCalendarModal();
            executeTabSearch();
        }

        async function triggerBotFromCalendar() {
            if (!selectedCalendarDate) return;
            
            const btn = document.getElementById('cal-sync-btn');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "⏳ 봇 기동 중...";

            try {
                const formattedDate = selectedCalendarDate.replace(/-/g, '/');
                const res = await fetch(`https://api.github.com/repos/${githubId}/${repoName}/dispatches`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event_type: 'trigger-oms-sync', client_payload: { start_date: formattedDate, end_date: formattedDate } })
                });

                if (res.status === 204 || res.ok) {
                    alert(`🚀 OMS 수동 동기화 봇이 성공적으로 실행되었습니다!\n\n대상 일자: ${selectedCalendarDate}`);
                    closeCalendarModal();
                } else {
                    const errData = await res.json().catch(() => ({}));
                    alert(`❌ 깃허브 연동 실패: ${errData.message || '알 수 없는 오류'}`);
                }
            } catch (err) {
                alert(`❌ 네트워크 통신 오류: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        function openBrandModal() { document.getElementById('brand-modal').style.display = 'flex'; renderBrandModalList(); }
        function closeBrandModal() { document.getElementById('brand-modal').style.display = 'none'; }
        function renderBrandModalList() {
            const cur = document.getElementById('chart-brand-input').value.split(',').map(s => s.trim());
            const kw = document.getElementById('modal-brand-search').value.toLowerCase().trim();
            const listEl = document.getElementById('brand-modal-list');
            const filtered = allBrandList.filter(b => b.toLowerCase().includes(kw));
            listEl.innerHTML = filtered.map(b => `<div class="search-list-item"><label><input type="checkbox" class="brand-modal-chk" value="${b}" ${cur.includes(b)?'checked':''}><span>${b}</span></label></div>`).join('');
        }
        function filterBrandModalList() { renderBrandModalList(); }
        function toggleAllBrandCheck(status) { document.querySelectorAll('.brand-modal-chk').forEach(c => c.checked = status); }
        function applyBrandSelection() { const vals = Array.from(document.querySelectorAll('.brand-modal-chk:checked')).map(c => c.value).join(', '); document.getElementById('chart-brand-input').value = vals; toggleClearBtn('chart-brand-input'); closeBrandModal(); executeTabSearch(); }

        function openItemModal() { document.getElementById('item-modal').style.display = 'flex'; renderItemModalList(); }
        function closeItemModal() { document.getElementById('item-modal').style.display = 'none'; }
        function renderItemModalList() {
            const cur = document.getElementById('chart-item-input').value.split(',').map(s => s.trim());
            const kw = document.getElementById('modal-item-search').value.toLowerCase().trim();
            const listEl = document.getElementById('item-modal-list');
            const filtered = allItemList.filter(i => i.code.toLowerCase().includes(kw) || i.name.toLowerCase().includes(kw));
            if (filtered.length === 0) { listEl.innerHTML = '<div style="text-align:center; padding:15px;">검색 결과가 없습니다.</div>'; return; }
            listEl.innerHTML = filtered.map(i => `<div class="search-list-item"><label><input type="checkbox" class="item-modal-chk" value="${i.code}" ${cur.includes(i.code) ? 'checked' : ''}><span><span style="font-family:monospace; color:#0284c7; font-weight:bold;">[${i.code}]</span> <b>${i.name}</b></span></label></div>`).join('');
        }
        function filterItemModalList() { renderItemModalList(); }
        function toggleAllItemCheck(status) { document.querySelectorAll('.item-modal-chk').forEach(c => c.checked = status); }
        function applyItemSelection() { 
            const vals = Array.from(document.querySelectorAll('.item-modal-chk:checked')).map(c => c.value).join(', '); 
            document.getElementById('chart-item-input').value = vals; 
            safeSetStorage('cached_item_input', vals); 
            toggleClearBtn('chart-item-input'); 
            updateItemNameBadge(vals);
            closeItemModal(); 
            executeTabSearch(); 
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const today = new Date(), past7 = new Date(); past7.setDate(today.getDate() - 7);
            document.getElementById('chart-start-date').value = localStorage.getItem('cached_chart_start_date') || formatDate(past7);
            document.getElementById('chart-end-date').value = localStorage.getItem('cached_chart_end_date') || formatDate(today);
            document.getElementById('chart-brand-input').value = localStorage.getItem('cached_brand_input') || '';
            const initialItemCode = localStorage.getItem('cached_item_input') || '';
            document.getElementById('chart-item-input').value = initialItemCode;
            toggleClearBtn('chart-brand-input'); toggleClearBtn('chart-item-input');
            document.getElementById('calendar-month-picker').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, '0')}`;
            
            await loadMasterLists(); 
            loadCalendarData();
        });
    </script>
</body>
