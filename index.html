<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더본 OMS 주문 현황 대시보드</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .navbar {
            background-color: #0f172a;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .navbar h1 { margin: 0; font-size: 20px; font-weight: 700; }
        .control-panel {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .date-badge {
            background-color: #334155;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn-deadline { background-color: #d97706; }
        .btn-deadline:hover { background-color: #b45309; }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .container { padding: 30px; max-width: 1400px; margin: 0 auto; }
        
        /* Summary KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 5px solid #2563eb;
        }
        .kpi-card.green { border-left-color: #10b981; }
        .kpi-card.purple { border-left-color: #8b5cf6; }
        .kpi-title { font-size: 14px; color: #64748b; font-weight: 600; }
        .kpi-value { font-size: 28px; font-weight: 800; margin-top: 8px; color: #0f172a; }

        /* Dashboard Main Layout */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
        }
        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .panel-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Lists and Tables */
        .select-box {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .store-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 450px;
            overflow-y: auto;
        }
        .store-item {
            padding: 14px 18px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .store-item:hover, .store-item.active {
            background-color: #eff6ff;
            border-color: #2563eb;
            font-weight: bold;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th { background-color: #f8fafc; color: #475569; font-size: 13px; }
        td { font-size: 14px; }
        .text-right { text-align: right; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>📦 더본 OMS 주문 실시간 대시보드</h1>
        <div class="control-panel">
            <div class="date-badge" id="current-target-date">조회 기준일: 계산 중...</div>
            <button class="btn btn-deadline" onclick="toggleDeadline()">
                ⏰ 11시 마감 적용 (다음날)
            </button>
            <button id="run-btn" class="btn" onclick="triggerBot()">
                🚀 수동 동기화
            </button>
        </div>
    </div>

    <div class="container">
        <!-- 1단계: 전체 요약 KPI -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-title">전체 총 주문수량</div>
                <div class="kpi-value" id="total-qty">0 건</div>
            </div>
            <div class="kpi-card green">
                <div class="kpi-title">전체 취급 품목수</div>
                <div class="kpi-value" id="total-items">0 종</div>
            </div>
            <div class="kpi-card purple">
                <div class="kpi-title">전체 총 주문금액</div>
                <div class="kpi-value" id="total-amount">0 원</div>
            </div>
        </div>

        <!-- 2, 3단계: 브랜드 및 점포 상세 조회 -->
        <div class="dashboard-layout">
            <!-- 좌측: 브랜드 선택 및 점포 리스트 -->
            <div class="panel">
                <div class="panel-title">
                    <span>🏢 브랜드별 점포 목록</span>
                </div>
                
                <select id="brand-select" class="select-box" onchange="onBrandChange()">
                    <option value="">-- 브랜드 선택 --</option>
                </select>

                <div id="brand-summary" style="margin-bottom: 15px; font-size: 13px; color: #64748b;">
                    점포수: <b id="brand-store-count">0</b>개 | 품목수: <b id="brand-item-count">0</b>종
                </div>

                <ul class="store-list" id="store-list">
                    <li style="color: #94a3b8; text-align: center; padding: 20px;">브랜드를 먼저 선택해주세요.</li>
                </ul>
            </div>

            <!-- 우측: 점포별 상세 주문 품목 목록 -->
            <div class="panel">
                <div class="panel-title">
                    <span id="selected-store-title">🛒 점포별 주문 상세</span>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th>품목명</th>
                            <th class="text-right">수량</th>
                            <th class="text-right">단가</th>
                            <th class="text-right">금액</th>
                        </tr>
                    </thead>
                    <tbody id="order-detail-table">
                        <tr>
                            <td colspan="4" style="text-align: center; color: #94a3b8; padding: 40px;">
                                좌측에서 점포를 선택하시면 상세 주문 데이터가 표시됩니다.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const githubId = 'kshnpch-cmyk'; 
        const repoName = 'dashboard'; 
        const token = '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'; 
        
        let isDeadlineApplied = false;
        let rawOrders = []; // 가공할 원본 데이터

        // 1. 날짜 세팅 및 초기화
        updateTargetDateUI();

        function updateTargetDateUI() {
            const today = new Date();
            const daysToAdd = isDeadlineApplied ? 2 : 1; // 기본 +1일, 마감 시 +2일
            const targetDate = new Date(today.setDate(today.getDate() + daysToAdd));
            
            const dateStr = targetDate.toISOString().split('T')[0];
            document.getElementById('current-target-date').innerText = `조회 기준일: ${dateStr} (${isDeadlineApplied ? '11시 마감 적용' : '기본 내일'})`;
        }

        function toggleDeadline() {
            isDeadlineApplied = !isDeadlineApplied;
            updateTargetDateUI();
            alert(`조회 기준일이 변경되었습니다.\n[수동 동기화] 버튼을 누르면 해당 일자로 조회가 진행됩니다.`);
        }

        // 2. 수동 실행 중복 방지 체크 및 트리거
        async function triggerBot() {
            const btn = document.getElementById('run-btn');
            
            // 실시간 동작 모니터링
            const res = await fetch(`https://api.github.com/repos/${githubId}/${repoName}/actions/runs?per_page=5`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const active = data.workflow_runs.some(run => ['in_progress', 'queued', 'pending'].includes(run.status));

            if (active) {
                alert("⚠️ 현재 데이터 동기화 업데이트가 진행 중입니다!\n잠시 후 다시 시도해 주세요.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "🔄 동기화 중...";

            fetch(`https://api.github.com/repos/${githubId}/${repoName}/actions/workflows/capture.yml/dispatches`, {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ ref: 'main' })
            })
            .then(res => {
                if(res.ok) {
                    alert("✅ 동기화 요청 완료! 완료 후 데이터가 자동 갱신됩니다.");
                    setTimeout(() => { btn.disabled = false; btn.innerText = "🚀 수동 동기화"; }, 30000);
                } else {
                    alert("❌ 동기화 요청 실패");
                    btn.disabled = false; btn.innerText = "🚀 수동 동기화";
                }
            });
        }
    </script>
</body>
</html>
