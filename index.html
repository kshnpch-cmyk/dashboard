<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더본 OMS 주문 현황 대시보드</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .navbar {
            background-color: #0f172a;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex-wrap: wrap;
            gap: 15px;
        }
        .navbar h1 { margin: 0; font-size: 20px; font-weight: 700; }
        .control-panel {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .date-picker-group {
            display: flex;
            align-items: center;
            background-color: #1e293b;
            padding: 6px 12px;
            border-radius: 8px;
            gap: 8px;
            border: 1px solid #334155;
        }
        .date-picker-group label {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
        }
        .date-input {
            background-color: #0f172a;
            color: white;
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn-reset { background-color: #475569; }
        .btn-reset:hover { background-color: #334155; }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .container { padding: 30px; max-width: 1400px; margin: 0 auto; }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 5px solid #2563eb;
        }
        .kpi-card.green { border-left-color: #10b981; }
        .kpi-card.purple { border-left-color: #8b5cf6; }
        .kpi-title { font-size: 14px; color: #64748b; font-weight: 600; }
        .kpi-value { font-size: 28px; font-weight: 800; margin-top: 8px; color: #0f172a; }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
        }
        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .panel-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .select-box {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .store-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 450px;
            overflow-y: auto;
        }
        .store-item {
            padding: 14px 18px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .store-item:hover, .store-item.active {
            background-color: #eff6ff;
            border-color: #2563eb;
            font-weight: bold;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th { background-color: #f8fafc; color: #475569; font-size: 13px; }
        td { font-size: 14px; }
        .text-right { text-align: right; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>📦 더본 OMS 주문 실시간 대시보드</h1>
        <div class="control-panel">
            <div class="date-picker-group">
                <label>조회 기간(배송일 기준):</label>
                <input type="date" id="start-date" class="date-input" onchange="onDateFilterChange()">
                <span style="color:#94a3b8;">~</span>
                <input type="date" id="end-date" class="date-input" onchange="onDateFilterChange()">
            </div>
            <button class="btn btn-reset" onclick="resetToTomorrow()">
                🔄 내일 기준 초기화
            </button>
            <button id="run-btn" class="btn" onclick="triggerBot()">
                🚀 해당 기간 수동 동기화
            </button>
        </div>
    </div>

    <div class="container">
        <!-- 1단계: 전체 요약 KPI -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-title">전체 총 주문수량</div>
                <div class="kpi-value" id="total-qty">0 건</div>
            </div>
            <div class="kpi-card green">
                <div class="kpi-title">전체 취급 품목수</div>
                <div class="kpi-value" id="total-items">0 종</div>
            </div>
            <div class="kpi-card purple">
                <div class="kpi-title">전체 총 주문금액</div>
                <div class="kpi-value" id="total-amount">0 원</div>
            </div>
        </div>

        <!-- 2, 3단계: 브랜드 및 점포 상세 드릴다운 -->
        <div class="dashboard-layout">
            <div class="panel">
                <div class="panel-title">
                    <span>🏢 브랜드별 점포 목록</span>
                </div>
                
                <select id="brand-select" class="select-box" onchange="onBrandChange()">
                    <option value="">-- 브랜드 선택 --</option>
                </select>

                <div id="brand-summary" style="margin-bottom: 15px; font-size: 13px; color: #64748b;">
                    점포수: <b id="brand-store-count">0</b>개 | 품목수: <b id="brand-item-count">0</b>종
                </div>

                <ul class="store-list" id="store-list">
                    <li style="color: #94a3b8; text-align: center; padding: 20px;">데이터를 불러오는 중입니다...</li>
                </ul>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <span id="selected-store-title">🛒 점포별 주문 상세</span>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th>품목명</th>
                            <th class="text-right">수량</th>
                            <th class="text-right">단가</th>
                            <th class="text-right">금액</th>
                        </tr>
                    </thead>
                    <tbody id="order-detail-table">
                        <tr>
                            <td colspan="4" style="text-align: center; color: #94a3b8; padding: 40px;">
                                좌측에서 점포를 선택하시면 상세 주문 데이터가 표시됩니다.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const githubId = 'kshnpch-cmyk'; 
        const repoName = 'dashboard'; 
        const token = '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'; 
        const webhookUrl = "https://script.google.com/macros/s/AKfycbyFph9famYyQNkqxFtzDkOiUdBIT0dCkKn-2l8y1cP51Xr5pj3YqwA-AdpsJ2UjPJzu/exec";

        const COL_DELIVERY_DATE = 5; // F열: 배송일자
        const COL_STORE_NAME    = 7; // H열: 거래처명
        const COL_BRAND_NAME    = 8; // I열: 브랜드명
        const COL_ITEM_NAME     = 16; // Q열: 품목명

        let allOrders = []; 
        let filteredOrders = []; 

        // 초기화: 기본값 '내일 날짜' 세팅
        resetToTomorrow();
        fetchSheetData();

        function formatDate(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function resetToTomorrow() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tomorrowStr = formatDate(tomorrow);

            document.getElementById('start-date').value = tomorrowStr;
            document.getElementById('end-date').value = tomorrowStr;
            
            processData();
        }

        function onDateFilterChange() {
            processData();
        }

        function fetchSheetData() {
            fetch(webhookUrl)
            .then(res => res.json())
            .then(data => {
                allOrders = data;
                processData();
            })
            .catch(err => {
                console.log("시트 데이터 데이터 로딩 중...");
            });
        }

        // 선택한 기간(start ~ end)으로 F열(배송일자) 필터링
        function processData() {
            if (!allOrders || allOrders.length <= 1) return;

            const startVal = document.getElementById('start-date').value.replace(/-/g, '/');
            const endVal = document.getElementById('end-date').value.replace(/-/g, '/');

            filteredOrders = allOrders.slice(1).filter(row => {
                const rowDate = row[COL_DELIVERY_DATE]; // 예: 2026/09/08
                return rowDate >= startVal && rowDate <= endVal;
            });

            // 1단계 KPI
            document.getElementById('total-qty').innerText = `${filteredOrders.length} 건`;
            
            const uniqueItems = new Set(filteredOrders.map(r => r[COL_ITEM_NAME]));
            document.getElementById('total-items').innerText = `${uniqueItems.size} 종`;

            // 2단계 브랜드 선택 드롭다운 채우기
            const brandSelect = document.getElementById('brand-select');
            const brands = [...new Set(filteredOrders.map(r => r[COL_BRAND_NAME]))].filter(Boolean);
            
            brandSelect.innerHTML = '<option value="">-- 브랜드 선택 --</option>';
            brands.forEach(b => {
                brandSelect.innerHTML += `<option value="${b}">${b}</option>`;
            });

            document.getElementById('store-list').innerHTML = `<li style="color: #94a3b8; text-align: center; padding: 20px;">브랜드를 선택해주세요.</li>`;
            document.getElementById('order-detail-table').innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 40px;">좌측에서 점포를 선택하시면 상세 주문 데이터가 표시됩니다.</td></tr>`;
        }

        function onBrandChange() {
            const selectedBrand = document.getElementById('brand-select').value;
            if (!selectedBrand) return;

            const brandOrders = filteredOrders.filter(r => r[COL_BRAND_NAME] === selectedBrand);
            const stores = [...new Set(brandOrders.map(r => r[COL_STORE_NAME]))].filter(Boolean);
            const items = new Set(brandOrders.map(r => r[COL_ITEM_NAME]));

            document.getElementById('brand-store-count').innerText = stores.length;
            document.getElementById('brand-item-count').innerText = items.size;

            const storeListEl = document.getElementById('store-list');
            storeListEl.innerHTML = "";

            stores.forEach(store => {
                const count = brandOrders.filter(r => r[COL_STORE_NAME] === store).length;
                storeListEl.innerHTML += `
                    <li class="store-item" onclick="onStoreSelect('${store}', '${selectedBrand}', this)">
                        <span>${store}</span>
                        <span style="font-size: 12px; color: #64748b;">${count}건</span>
                    </li>
                `;
            });
        }

        function onStoreSelect(storeName, brandName, element) {
            document.querySelectorAll('.store-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('selected-store-title').innerText = `🛒 [${storeName}] 주문 상세 목록`;

            const storeOrders = filteredOrders.filter(r => r[COL_STORE_NAME] === storeName);
            const detailTable = document.getElementById('order-detail-table');

            detailTable.innerHTML = "";
            storeOrders.forEach(row => {
                detailTable.innerHTML += `
                    <tr>
                        <td>${row[COL_ITEM_NAME] || '-'}</td>
                        <td class="text-right">1</td>
                        <td class="text-right">-</td>
                        <td class="text-right">-</td>
                    </tr>
                `;
            });
        }

        // 선택한 기간을 파라미터로 넘겨 봇 수동 트리거 실행
        async function triggerBot() {
            const btn = document.getElementById('run-btn');
            
            const startVal = document.getElementById('start-date').value.replace(/-/g, '/');
            const endVal = document.getElementById('end-date').value.replace(/-/g, '/');

            btn.disabled = true;
            btn.innerText = "🔄 동기화 중...";

            fetch(`https://api.github.com/repos/${githubId}/${repoName}/actions/workflows/capture.yml/dispatches`, {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ 
                    ref: 'main',
                    inputs: {
                        start_date: startVal,
                        end_date: endVal
                    }
                })
            })
            .then(res => {
                if(res.ok) {
                    alert(`✅ [${startVal} ~ ${endVal}] 기간으로 동기화 요청 완료!\n약 30초 후 데이터가 반영됩니다.`);
                    setTimeout(() => { 
                        btn.disabled = false; 
                        btn.innerText = "🚀 해당 기간 수동 동기화"; 
                        fetchSheetData();
                    }, 35000);
                } else {
                    alert("❌ 동기화 요청 실패");
                    btn.disabled = false; btn.innerText = "🚀 해당 기간 수동 동기화";
                }
            });
        }
    </script>
</body>
</html>
